<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotelier — Guest Queue Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; color: #38bdf8; }
        .stats { display: flex; gap: 2rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; }
        .main { flex: 1; overflow-y: auto; padding: 1rem; min-height: 0; }
        .panel { padding: 1rem; border-bottom: 1px solid #334155; }
        .panel h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .guest-item { padding: 0.5rem; margin-bottom: 0.5rem; background: #0f172a; border-radius: 0.375rem; cursor: pointer; }
        .guest-item:hover { background: #1e293b; }
        .guest-name { font-weight: 600; font-size: 0.875rem; }
        .guest-tags { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
        .guest-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; }
        .status-idle { background: #22c55e; }
        .status-running { background: #f59e0b; }
        .status-disconnected { background: #ef4444; }
        .task-item { padding: 0.75rem; margin-bottom: 0.5rem; background: #1e293b; border-radius: 0.375rem; border-left: 3px solid #38bdf8; cursor: pointer; transition: background 0.15s; }
        .task-item:hover { background: #334155; }
        .task-item.active { background: #334155; border-left-color: #38bdf8; box-shadow: inset 0 0 0 1px #38bdf8; }
        .task-item.completed { border-left-color: #22c55e; }
        .task-item.failed { border-left-color: #ef4444; }
        .task-item.cancelled { border-left-color: #94a3b8; }
        .task-id { font-weight: 600; font-size: 0.875rem; }
        .task-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
        .task-prompt { font-size: 0.85rem; color: #cbd5e1; margin-top: 0.5rem; }
        .submit-form { padding: 1rem; background: #1e293b; border-radius: 0.375rem; margin-bottom: 1rem; }
        .submit-form h3 { margin-bottom: 0.75rem; }
        .form-group { margin-bottom: 0.75rem; }
        .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.375rem; color: #e2e8f0; font-family: inherit; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
        .btn:hover { background: #2563eb; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
        .btn-ghost:hover { background: #1e293b; color: #e2e8f0; }

        /* Task detail view */
        .task-detail { display: flex; flex-direction: column; height: 100%; }
        .task-detail-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #1e293b; border-radius: 0.5rem 0.5rem 0 0; border: 1px solid #334155; border-bottom: none; }
        .task-detail-id { font-weight: 600; font-size: 0.875rem; color: #38bdf8; }
        .task-detail-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
        .task-detail-prompt { font-size: 0.85rem; color: #cbd5e1; padding: 0.75rem 1rem; background: #0f172a; border: 1px solid #334155; border-top: none; border-radius: 0 0 0.5rem 0.5rem; margin-bottom: 1rem; line-height: 1.5; }
        .task-detail-body { flex: 1; overflow-y: auto; padding: 0.5rem 0; }

        /* Streaming log messages */
        .log-msg { margin-bottom: 0.5rem; padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.85rem; line-height: 1.6; }
        .log-msg.guest { background: #0f172a; border-left: 2px solid #22c55e; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; white-space: pre-wrap; }
        .log-msg.guest .md-rendered { white-space: normal; }
        .log-msg.guest .md-rendered h1, .log-msg.guest .md-rendered h2, .log-msg.guest .md-rendered h3, .log-msg.guest .md-rendered h4, .log-msg.guest .md-rendered h5, .log-msg.guest .md-rendered h6 { margin: 0.5em 0 0.25em; font-weight: 600; }
        .log-msg.guest .md-rendered h1 { font-size: 1.25em; }
        .log-msg.guest .md-rendered h2 { font-size: 1.1em; }
        .log-msg.guest .md-rendered h3 { font-size: 1em; }
        .log-msg.guest .md-rendered p { margin: 0.25em 0; }
        .log-msg.guest .md-rendered code { background: #1e293b; padding: 0.125em 0.375em; border-radius: 0.25em; font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', monospace; }
        .log-msg.guest .md-rendered pre { background: #1e293b; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin: 0.5em 0; }
        .log-msg.guest .md-rendered pre code { background: none; padding: 0; }
        .log-msg.guest .md-rendered table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.85rem; }
        .log-msg.guest .md-rendered th, .log-msg.guest .md-rendered td { border: 1px solid #334155; padding: 0.375rem 0.75rem; text-align: left; }
        .log-msg.guest .md-rendered th { background: #1e293b; font-weight: 600; }
        .log-msg.guest .md-rendered tr:nth-child(even) { background: #0f172a; }
        .log-msg.guest .md-rendered ul, .log-msg.guest .md-rendered ol { margin: 0.25em 0; padding-left: 1.5em; }
        .log-msg.guest .md-rendered li { margin: 0.125em 0; }
        .log-msg.guest .md-rendered blockquote { border-left: 3px solid #38bdf8; padding-left: 0.75rem; margin: 0.5em 0; color: #94a3b8; }
        .log-msg.guest .md-rendered a { color: #38bdf8; text-decoration: none; }
        .log-msg.guest .md-rendered a:hover { text-decoration: underline; }
        .log-msg.guest .md-rendered hr { border: none; border-top: 1px solid #334155; margin: 0.75em 0; }
        .log-msg.guest .md-rendered strong { font-weight: 600; }
        .log-msg.guest .md-rendered em { font-style: italic; }
        .log-msg.system { color: #64748b; font-size: 0.75rem; font-style: italic; padding-left: 0.75rem; }
        .log-msg.error { background: #1c0a0a; border-left: 2px solid #ef4444; color: #fca5a5; }
        .log-msg.unknown-event { background: #1e293b; border-left: 2px solid #475569; color: #64748b; font-size: 0.75rem; }
        .log-msg.unknown-event pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
        .log-msg .timestamp { color: #475569; font-size: 0.7rem; font-family: 'SF Mono', 'Fira Code', monospace; margin-right: 0.5rem; }

        /* Thinking blocks — collapsible reasoning output */
        .thinking-block { margin-bottom: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid #2d1b69; }
        .thinking-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: #1a1038; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .thinking-block-header:hover { background: #251747; }
        .thinking-block-header .thinking-icon { margin-right: 0.5rem; }
        .thinking-block-header .thinking-label { font-weight: 600; color: #a78bfa; font-size: 0.8rem; }
        .thinking-block-header .thinking-chevron { color: #6b5b95; transition: transform 0.15s; font-size: 0.75rem; }
        .thinking-block-header .thinking-chevron.open { transform: rotate(90deg); }
        .thinking-block-body { display: none; background: #0f0a1e; border-top: 1px solid #2d1b69; }
        .thinking-block-body.open { display: block; }
        .thinking-block-body .thinking-content { padding: 0.5rem 0.75rem; font-size: 0.8rem; color: #94a3b8; font-style: italic; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

        /* Tool call blocks */
        .tool-block { margin-bottom: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid #334155; }
        .tool-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: #1e293b; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .tool-block-header:hover { background: #253347; }
        .tool-block-header .tool-icon { margin-right: 0.5rem; }
        .tool-block-header .tool-name { font-weight: 600; color: #f59e0b; font-family: 'SF Mono', 'Fira Code', monospace; }
        .tool-block-header .tool-status { margin-left: 0.75rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .tool-block-header .tool-status.running { color: #f59e0b; }
        .tool-block-header .tool-status.success { color: #22c55e; }
        .tool-block-header .tool-status.error { color: #ef4444; }
        .tool-block-header .tool-chevron { color: #64748b; transition: transform 0.15s; font-size: 0.75rem; }
        .tool-block-header .tool-chevron.open { transform: rotate(90deg); }
        .tool-block-body { display: none; background: #0f172a; border-top: 1px solid #334155; }
        .tool-block-body.open { display: block; }
        .tool-block-body .tool-args { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #94a3b8; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; }
        .tool-block-body .tool-output { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #cbd5e1; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; border-top: 1px solid #1e293b; }
        .tool-block-body .tool-output pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: inherit; font-size: inherit; color: inherit; }
        .tool-block-body .tool-output .output-label { color: #475569; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }

        /* Subtle bash command-line highlighting (Prism.js tokens) */
        .command-line { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; color: #cbd5e1; margin-left: 0.5rem; }
        .command-line .token.function       { color: #8ddb8c; }
        .command-line .token.parameter      { color: #6cb6ff; }
        .command-line .token.string         { color: #96d0ff; }
        .command-line .token.operator       { color: #768390; }
        .command-line .token.keyword        { color: #f47067; }
        .command-line .token.comment        { color: #64748b; }
        .command-line .token.variable       { color: #f69d50; }
        .command-line .token.punctuation    { color: #475569; }
        .command-line .token.builtin        { color: #8ddb8c; }
        .command-line .token.class-name     { color: #dcbdfb; }
        .command-line .token.url            { color: #96d0ff; }
        .command-line-plain { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; color: #94a3b8; margin-left: 0.5rem; }

        .streaming-cursor::after { content: '▊'; animation: blink 1s infinite; color: #22c55e; }
        @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #475569; font-size: 0.875rem; flex-direction: column; gap: 0.5rem; }
        .empty-state span { font-size: 2rem; }

        .tab-bar { display: flex; gap: 0; margin-bottom: 1rem; }
        .tab { padding: 0.5rem 1rem; background: #1e293b; border: 1px solid #334155; border-bottom: none; border-radius: 0.375rem 0.375rem 0 0; cursor: pointer; font-size: 0.875rem; }
        .tab.active { background: #334155; }
        .log-breadcrumb { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: #1e293b; border-radius: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .log-breadcrumb .crumb { color: #38bdf8; cursor: pointer; text-decoration: underline; font-size: 0.875rem; }
        .log-breadcrumb .crumb:hover { color: #7dd3fc; }
        .log-breadcrumb .separator { color: #475569; font-size: 0.75rem; }
        .log-breadcrumb .current { color: #94a3b8; font-size: 0.875rem; }
        .log-task-item { padding: 0.5rem 0.75rem; margin-bottom: 0.25rem; background: #1e293b; border-radius: 0.375rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .log-task-item:hover { background: #334155; }
        .log-task-id { font-size: 0.85rem; color: #e2e8f0; }
        .log-task-count { font-size: 0.7rem; color: #64748b; }
        .log-entry-line { padding: 0.375rem 0.75rem; border-bottom: 1px solid #1e293b; font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .log-entry-line:last-child { border-bottom: none; }
        .log-entry-line .log-level-badge { display: inline-block; padding: 0.05rem 0.35rem; border-radius: 0.25rem; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-right: 0.5rem; min-width: 3.5em; text-align: center; vertical-align: middle; }
        .log-entry-line .log-level-badge.tool { background: #422006; color: #fbbf24; }
        .log-entry-line .log-level-badge.text { background: #172554; color: #60a5fa; }
        .log-entry-line .log-level-badge.info { background: #1e3a5f; color: #38bdf8; }
        .log-entry-line .log-level-badge.system { background: #1e293b; color: #64748b; }
        .log-entry-line .log-level-badge.error { background: #450a0a; color: #fca5a5; }
        .log-entry-line .log-level-badge.thinking { background: #1e1045; color: #a78bfa; }
        .log-entry-line .log-timestamp { color: #475569; font-size: 0.65rem; font-family: 'SF Mono', 'Fira Code', monospace; margin-right: 0.5rem; }
        .log-entry-line .log-content { color: #cbd5e1; }
        .log-entry-line[data-level="tool"] { border-left: 2px solid #f59e0b; }
        .log-entry-line[data-level="text"] { border-left: 2px solid #3b82f6; }
        .log-entry-line[data-level="info"] { border-left: 2px solid #06b6d4; }
        .log-entry-line[data-level="system"] { border-left: 2px solid #64748b; }
        .log-entry-line[data-level="error"] { border-left: 2px solid #ef4444; }
        .log-entry-line[data-level="thinking"] { border-left: 2px solid #a78bfa; }
        .log-entry-line[data-level=""] { border-left: 2px solid #334155; }
        .badge { display: inline-block; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.625rem; font-weight: 600; text-transform: uppercase; }
        .badge-pending { background: #334155; color: #94a3b8; }
        .badge-assigned { background: #1e3a5f; color: #38bdf8; }
        .badge-running { background: #422006; color: #f59e0b; }
        .badge-completed { background: #052e16; color: #22c55e; }
        .badge-failed { background: #450a0a; color: #ef4444; }
        .badge-cancelled { background: #1c1917; color: #78716c; }
        .task-error { background: #1c0a0a; border: 1px solid #7f1d1d; border-radius: 0.375rem; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: #fca5a5; line-height: 1.5; }
        .task-error-label { font-weight: 600; color: #ef4444; margin-bottom: 0.25rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .task-error-text { white-space: pre-wrap; word-break: break-word; }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Hotelier</h1>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="guest-count">0</div>
                <div class="stat-label">Guests</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="task-count">0</div>
                <div class="stat-label">Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="idle-count">0</div>
                <div class="stat-label">Idle</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="running-count">0</div>
                <div class="stat-label">Running</div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="sidebar">
            <div class="panel">
                <h3>🤖 Guests</h3>
                <div id="guest-list"></div>
            </div>
            <div class="panel">
                <h3>📋 Submit Task</h3>
                <div class="submit-form">
                    <div class="form-group">
                        <label>Repositories (comma-separated)</label>
                        <input type="text" id="task-repos" placeholder="https://github.com/user/repo.git, git@github.com:user/repo.git">
                    </div>
                    <div class="form-group">
                        <label>Prompt</label>
                        <textarea id="task-prompt" placeholder="Describe the task..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma-separated, optional)</label>
                        <input type="text" id="task-tags" placeholder="business-default, android">
                    </div>
                    <button class="btn" onclick="submitTask()">Submit Task</button>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="tab-bar">
                <div class="tab active" onclick="showTab('tasks')">Tasks</div>
                <div class="tab" onclick="showTab('logs')">Logs</div>
            </div>
            <div id="tab-tasks">
                <div id="task-list"></div>
            </div>
            <div id="tab-logs" style="display:none;">
                <div id="log-view">
                    <div class="empty-state"><span>📋</span>No logs configured</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // Lightweight router — keeps the browser URL in sync with UI state.
        // Uses history.pushState so the address bar reflects the current view
        // and page refreshes restore the correct state.
        // =====================================================================

        let refreshInterval;
        let ws;
        let activeTaskId = null;
        let taskLogs = {};  // Accumulates logs per task: { taskId: [entries] }

        const router = {
            // Push a new URL without reloading the page.
            // When routerReplaceMode is true (initial dispatch), uses
            // replaceState instead to avoid polluting the history stack.
            push(path) {
                if (routerReplaceMode) {
                    history.replaceState({ path }, '', path);
                } else {
                    history.pushState({ path }, '', path);
                }
            },

            // Parse the current pathname into a structured route object.
            parse() {
                const parts = location.pathname.split('/').filter(Boolean);
                if (parts.length === 0 || (parts.length === 1 && parts[0] === 'tasks')) {
                    return { view: 'tasks' };
                }
                // /task/:id shows task detail in the Logs tab
                if (parts[0] === 'task' && parts[1]) {
                    return { view: 'taskDetail', taskId: parts[1] };
                }
                if (parts[0] === 'logs' && parts.length === 1) {
                    return { view: 'logs' };
                }
                if (parts[0] === 'logs' && parts[1]) {
                    return { view: 'logs', date: parts[1], taskID: parts[2] || null };
                }
                return { view: 'tasks' };
            },

            // Dispatch the parsed route to the appropriate UI view.
            // When fromInitialLoad is true, navigation functions should use
            // replaceState instead of pushState (set via the global flag below).
            async dispatch(fromInitialLoad) {
                const route = this.parse();
                switch (route.view) {
                case 'taskDetail':
                    selectTask(route.taskId, fromInitialLoad);
                    break;
                case 'logs':
                    showTab('logs', true, fromInitialLoad);
                    if (route.date) {
                        await loadLogTasks(route.date, fromInitialLoad);
                        if (route.taskID) {
                            await loadLogEntries(route.date, route.taskID, fromInitialLoad);
                        }
                    }
                    break;
                default:
                    showTab('tasks', true, fromInitialLoad);
                    break;
                }
            },
        };

        // Flag: when true, router.push() acts as replaceState instead.
        // Set during initial dispatch to avoid polluting the history stack.
        let routerReplaceMode = false;

        // Internal helper: activate a tab by name in the DOM.
        // When called from the router (skipUrl === true) we do not push a
        // second history entry.
        function activateTabByName(name) {
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.textContent.trim() === name);
            });
        }

        // showTab switches the visible tab panel.
        //   tab              — 'tasks' or 'logs'
        //   skipUrl          — when true, do NOT call router.push (used by
        //                      router dispatch and popstate so we don't
        //                      double-push).
        //   fromInitialLoad  — when true, URL changes use replaceState
        //                      instead of pushState.
        function showTab(tab, skipUrl, fromInitialLoad) {
            if (!skipUrl) {
                if (tab === 'tasks') router.push('/tasks');
                // 'logs' — loadLogDates() pushes /logs, so skip here
            }
            activateTabByName(tab === 'tasks' ? 'Tasks' : 'Logs');
            document.getElementById('tab-tasks').style.display = tab === 'tasks' ? 'block' : 'none';
            document.getElementById('tab-logs').style.display = tab === 'logs' ? 'block' : 'none';
            if (tab === 'logs') {
                loadLogDates(fromInitialLoad);
            }
        }

        async function refresh() {
            try {
                const [guestsRes, tasksRes] = await Promise.all([
                    fetch('/api/guests'),
                    fetch('/api/tasks')
                ]);
                const guests = await guestsRes.json();
                const tasks = await tasksRes.json();
                renderGuests(guests);
                renderTasks(tasks);
                updateStats(guests, tasks);
            } catch (e) {
                console.error('refresh failed:', e);
            }
        }

        function updateStats(guests, tasks) {
            document.getElementById('guest-count').textContent = guests.count || 0;
            document.getElementById('task-count').textContent = tasks.count || 0;
            document.getElementById('idle-count').textContent = (guests.guests || []).filter(a => a.state === 'IDLE').length;
            document.getElementById('running-count').textContent = (guests.guests || []).filter(a => a.state === 'RUNNING').length;
        }

        function renderGuests(data) {
            const list = document.getElementById('guest-list');
            const guests = data.guests || [];
            if (guests.length === 0) {
                list.innerHTML = '<div style="padding:0.5rem;color:#64748b;font-size:0.875rem;">No guests connected</div>';
                return;
            }
            list.innerHTML = guests.map(a => {
                const statusClass = `status-${a.state.toLowerCase()}`;
                return `<div class="guest-item">
                    <div class="guest-name"><span class="guest-status ${statusClass}"></span>${a.name || a.id}</div>
                    <div class="guest-tags">${(a.tags || []).join(', ')}</div>
                </div>`;
            }).join('');
        }

        function renderTasks(data) {
            const list = document.getElementById('task-list');
            const tasks = data.tasks || [];
            if (tasks.length === 0) {
                list.innerHTML = '<div style="padding:0.5rem;color:#64748b;font-size:0.875rem;">No tasks yet</div>';
                return;
            }
            list.innerHTML = tasks.map(t => {
                const badgeClass = `badge-${t.status.toLowerCase()}`;
                const itemClass = t.status.toLowerCase();
                const isActive = t.id === activeTaskId ? ' active' : '';
                let errorHtml = '';
                if (t.status === 'FAILED' && t.error) {
                    const errorText = t.error.length > 120 ? t.error.substring(0, 120) + '...' : t.error;
                    errorHtml = `<div class="task-prompt" style="color:#fca5a5;">⚠ ${escapeHtml(errorText)}</div>`;
                }
                return `<div class="task-item ${itemClass}${isActive}" onclick="selectTask('${t.id}')">
                    <div class="task-id">${t.id} <span class="badge ${badgeClass}">${t.status}</span></div>
                    <div class="task-meta">${t.assigned_to ? '→ ' + t.assigned_to : 'unassigned'} · ${new Date(t.created_at).toLocaleString()}</div>
                    <div class="task-prompt">${escapeHtml(t.prompt.substring(0, 120))}${t.prompt.length > 120 ? '...' : ''}</div>
                    ${errorHtml}
                </div>`;
            }).join('');
        }

        function currentToolId(block) {
            return block ? block.toolId : '';
        }

        // renderCommandLineHeader returns the HTML fragment that replaces the
        // old tool-ID span.  For "bash" tools it renders a Prism.js-highlighted
        // command line; for all other tools it shows the raw args plainly.
        function renderCommandLineHeader(toolName, args) {
            if (!args || args.trim() === '') return '';
            if (toolName === 'bash') {
                // tool_args is JSON-encoded: {"command":"hostname"}
                // Extract the actual command string for display.
                try {
                    const parsed = JSON.parse(args);
                    if (parsed.command) {
                        args = parsed.command;
                    }
                } catch (_) {
                    // Not valid JSON — use as-is
                }
                return `<span class="command-line language-bash">${escapeHtml(args)}</span>`;
            }
            return `<span class="command-line-plain">${escapeHtml(args)}</span>`;
        }

        // highlightCommandLines finds all .command-line.language-bash elements
        // inside the given container and runs Prism.highlightElement on them.
        function highlightCommandLines(container) {
            if (typeof Prism === 'undefined') return;
            container.querySelectorAll('.command-line.language-bash').forEach(el => {
                Prism.highlightElement(el);
            });
        }

        function renderToolBlockStart(block, timeStr, cursorClass) {
            // Create the tool block div in the DOM using a fragment
            const frag = document.createDocumentFragment();
            const div = document.createElement('div');
            div.className = 'tool-block';
            div.id = 'tool-' + block.toolId;
            const cmdLine = renderCommandLineHeader(block.toolName, block.args);
            div.innerHTML = `
                <div class="tool-block-header" onclick="toggleToolBlock('${block.toolId}')">
                    <div>
                        <span class="tool-icon">🔧</span>
                        <span class="tool-name">${escapeHtml(block.toolName)}</span>
                        ${cmdLine}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <span class="tool-status running">running</span>
                        <span class="tool-chevron">▶</span>
                    </div>
                </div>
                <div class="tool-block-body" id="tool-body-${block.toolId}">
                    ${block.args ? `<div class="tool-args">${escapeHtml(block.args)}</div>` : ''}
                    <div class="tool-output"><div class="output-label">Output</div></div>
                </div>
            `;
            frag.appendChild(div);
            highlightCommandLines(div);
            return frag;
        }

        // buildToolBlockHTML creates a complete tool-block div as innerHTML.
        // Used by renderTaskDetail which builds the full view at once.
        // Completed blocks (done/error) are rendered open so the output is
        // visible immediately; running blocks stay collapsed.
        function buildToolBlockHTML(toolName, toolId, args, output, status) {
            const statusClass = status === 'error' ? 'error' : 'success';
            const statusLabel = status === 'error' ? 'error' : 'done';
            const argsHtml = args ? `<div class="tool-args">${escapeHtml(args)}</div>` : '';
            const outputHtml = output
                ? `<div class="tool-output"><div class="output-label">Output</div><pre>${escapeHtml(output)}</pre></div>`
                : '<div class="tool-output"><div class="output-label">Output</div></div>';
            const cmdLine = renderCommandLineHeader(toolName, args);
            // Open completed blocks so output is visible without clicking
            const isDone = status === 'success' || status === 'error';
            const bodyOpen = isDone ? ' open' : '';
            const chevronOpen = isDone ? ' open' : '';
            return `<div class="tool-block" id="tool-${toolId}">
                <div class="tool-block-header" onclick="toggleToolBlock('${toolId}')">
                    <div>
                        <span class="tool-icon">🔧</span>
                        <span class="tool-name">${escapeHtml(toolName)}</span>
                        ${cmdLine}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <span class="tool-status ${statusClass}">${statusLabel}</span>
                        <span class="tool-chevron${chevronOpen}">▶</span>
                    </div>
                </div>
                <div class="tool-block-body${bodyOpen}" id="tool-body-${toolId}">
                    ${argsHtml}${outputHtml}
                </div>
            </div>`;
        }

        function renderToolBlockEnd(block) {
            // Update existing tool block in place — never create a new div
            const blockEl = document.getElementById('tool-' + block.toolId);
            if (!blockEl) return;

            const statusClass = block.status === 'error' ? 'error' : 'success';
            const statusLabel = block.status === 'error' ? 'error' : 'done';
            const cmdLine = renderCommandLineHeader(block.toolName, block.args);

            // Update header
            const header = blockEl.querySelector('.tool-block-header');
            header.innerHTML = `
                <div>
                    <span class="tool-icon">🔧</span>
                    <span class="tool-name">${escapeHtml(block.toolName)}</span>
                    ${cmdLine}
                </div>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                    <span class="tool-status ${statusClass}">${statusLabel}</span>
                    <span class="tool-chevron">▶</span>
                </div>
            `;
            highlightCommandLines(blockEl);

            // Update body: append result to output as pre-formatted text
            const bodyEl = blockEl.querySelector('.tool-block-body');
            const outputDiv = bodyEl.querySelector('.tool-output');
            if (outputDiv && block.output) {
                outputDiv.innerHTML = '<pre>' + escapeHtml(block.output) + '</pre>';
            } else if (!outputDiv && block.output) {
                bodyEl.innerHTML = `<div class="tool-output"><div class="output-label">Output</div><pre>${escapeHtml(block.output)}</pre></div>`;
            }
        }

        function toggleToolBlock(toolId) {
            const body = document.getElementById('tool-body-' + toolId);
            const chevron = body?.previousElementSibling?.querySelector('.tool-chevron');
            if (body) {
                body.classList.toggle('open');
                if (chevron) chevron.classList.toggle('open');
            }
        }

        // Thinking block helpers
        let _thinkingBlockCounter = 0;

        function nextThinkingBlockId() {
            _thinkingBlockCounter++;
            return 'thinking-' + _thinkingBlockCounter;
        }

        function toggleThinkingBlock(blockId) {
            const body = document.getElementById('thinking-body-' + blockId);
            const header = body?.previousElementSibling;
            const chevron = header?.querySelector('.thinking-chevron');
            if (body) {
                body.classList.toggle('open');
                if (chevron) chevron.classList.toggle('open');
            }
        }

        // buildThinkingBlockHTML creates a collapsible thinking block.
        function buildThinkingBlockHTML(content, blockId) {
            if (!blockId) blockId = nextThinkingBlockId();
            return `<div class="thinking-block" id="thinking-${blockId}">
                <div class="thinking-block-header" onclick="toggleThinkingBlock('${blockId}')">
                    <div>
                        <span class="thinking-icon">💭</span>
                        <span class="thinking-label">Thinking</span>
                    </div>
                    <span class="thinking-chevron">▶</span>
                </div>
                <div class="thinking-block-body" id="thinking-body-${blockId}">
                    <div class="thinking-content">${escapeHtml(content)}</div>
                </div>
            </div>`;
        }

        // renderUnknownEvent renders an unrecognized RPC event in a grey <pre> block.
        function renderUnknownEvent(event) {
            const pre = document.createElement('pre');
            pre.className = 'log-msg unknown-event';
            pre.innerHTML = `<code>${escapeHtml(JSON.stringify(event, null, 2))}</code>`;
            return pre;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse(text);
            }
            return escapeHtml(text);
        }

        function selectTask(taskId, fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            activeTaskId = taskId;
            router.push('/task/' + taskId);
            routerReplaceMode = false;
            refresh();
            // Show Logs tab but skip loadLogDates (we're showing task detail, not log browser)
            activateTabByName('Logs');
            document.getElementById('tab-tasks').style.display = 'none';
            document.getElementById('tab-logs').style.display = 'block';
            // Use the task detail API (has structured tool fields) for rich rendering
            refreshTaskDetail(taskId);
        }

        async function refreshTaskDetail(taskId) {
            try {
                const res = await fetch(`/api/tasks/${taskId}`);
                if (!res.ok) return;
                const data = await res.json();
                renderTaskDetail(data.task, data.logs || [], data.log_count || 0);
            } catch (e) {
                console.error('failed to load task detail:', e);
            }
        }

        function renderTaskDetail(task, logs, logCount) {
            const view = document.getElementById('log-view');
            if (!task) return;

            const badgeClass = `badge-${task.status.toLowerCase()}`;
            const promptHtml = escapeHtml(task.prompt);

            let logsHtml = '';
            if (logs.length === 0) {
                logsHtml += '<div class="log-msg system">Waiting for guest output...</div>';
            } else {
                const isRunning = task.status === 'RUNNING' || task.status === 'ASSIGNED';
                let currentToolBlock = null;

                logs.forEach((log, i) => {
                    const isLast = i === logs.length - 1 && isRunning;
                    const timeStr = new Date(log.timestamp).toLocaleTimeString();
                    const cursorClass = isLast ? ' streaming-cursor' : '';
                    const level = log.level || '';

                    // Use structured fields to determine event type.
                    if (level === 'tool' && log.tool_type) {
                        if (log.tool_type === 'start') {
                            if (currentToolBlock) {
                                // Flush previous incomplete block
                                logsHtml += buildToolBlockHTML(
                                    currentToolBlock.toolName, currentToolBlock.toolId,
                                    currentToolBlock.args, currentToolBlock.output, 'running'
                                );
                            }
                            currentToolBlock = {
                                toolName: log.tool_name, toolId: log.tool_id,
                                args: log.tool_args, output: '', status: 'running', hasOutput: false
                            };
                            return;
                        }

                        if (log.tool_type === 'output') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                currentToolBlock.output += log.tool_output;
                                currentToolBlock.hasOutput = true;
                            }
                            return;
                        }

                        if (log.tool_type === 'end') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                if (log.tool_output) currentToolBlock.output += log.tool_output;
                                currentToolBlock.status = log.tool_error ? 'error' : 'success';
                            }
                            // Build and append the complete tool block now that we have all output
                            if (currentToolBlock) {
                                logsHtml += buildToolBlockHTML(
                                    currentToolBlock.toolName, currentToolBlock.toolId,
                                    currentToolBlock.args, currentToolBlock.output,
                                    currentToolBlock.status
                                );
                            }
                            currentToolBlock = null;
                            return;
                        }
                    }

                    // Non-tool log lines
                    if (currentToolBlock) {
                        logsHtml += buildToolBlockHTML(
                            currentToolBlock.toolName, currentToolBlock.toolId,
                            currentToolBlock.args, currentToolBlock.output, 'running'
                        );
                        currentToolBlock = null;
                    }

                    let msgHtml;
                    if (level === 'thinking') {
                        msgHtml = buildThinkingBlockHTML(log.line);
                    } else if (level === 'system') {
                        msgHtml = `<div class="log-msg system${cursorClass}">${escapeHtml(log.line)}</div>`;
                    } else if (level === 'error') {
                        msgHtml = `<div class="log-msg error${cursorClass}">${escapeHtml(log.line)}</div>`;
                    } else {
                        msgHtml = `<div class="log-msg guest${cursorClass}"><div class="md-rendered">${renderMarkdown(log.line)}</div></div>`;
                    }
                    logsHtml += msgHtml;
                });

                // Close any remaining open tool block
                if (currentToolBlock) {
                    logsHtml += buildToolBlockHTML(
                        currentToolBlock.toolName, currentToolBlock.toolId,
                        currentToolBlock.args, currentToolBlock.output, 'running'
                    );
                    currentToolBlock = null;
                }
            }

            // Build error banner if task failed
            let errorBannerHtml = '';
            if (task.status === 'FAILED' && task.error) {
                errorBannerHtml = `<div class="task-error"><div class="task-error-label">Failure Reason</div><div class="task-error-text">${escapeHtml(task.error)}</div></div>`;
            }

            const detailContainer = document.createElement('div');
            detailContainer.className = 'task-detail';
            detailContainer.innerHTML = `
                <div class="task-detail-header">
                    <div>
                        <div class="task-detail-id">${escapeHtml(task.id)} <span class="badge ${badgeClass}">${task.status}</span></div>
                        <div class="task-detail-meta">${task.assigned_to ? 'Guest: ' + escapeHtml(task.assigned_to) : 'Unassigned'} · ${logs.length} log entries</div>
                    </div>
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        <button class="btn btn-sm btn-ghost" onclick="rerunTask('${task.id}')">🔄 Re-run</button>
                        <button class="btn btn-sm btn-ghost" onclick="closeTaskDetail()">Close</button>
                    </div>
                </div>
                <div class="task-detail-prompt">${promptHtml}</div>
                ${errorBannerHtml}
                <div class="task-detail-body"></div>
            `;
            const detailBody = detailContainer.querySelector('.task-detail-body');
            detailBody.innerHTML = logsHtml;
            highlightCommandLines(detailBody);
            view.innerHTML = '';
            view.appendChild(detailContainer);

            // Sync taskLogs so appendLogToDetail doesn't double-render
            if (activeTaskId && taskLogs[task.id]) {
                taskLogs[task.id] = logs.map(l => ({
                    task_id: l.task_id || activeTaskId,
                    line: l.line,
                    level: l.level || 'info',
                    timestamp: new Date().toISOString()
                }));
            }

            // Scroll to bottom
            const scrollBody = view.querySelector('.task-detail-body');
            if (scrollBody) scrollBody.scrollTop = scrollBody.scrollHeight;
        }

        async function submitTask() {
            const repos = document.getElementById('task-repos').value;
            const prompt = document.getElementById('task-prompt').value;
            const tags = document.getElementById('task-tags').value;

            if (!prompt) {
                alert('Prompt is required');
                return;
            }

            const task = {
                repos: repos ? repos.split(',').map(s => s.trim()).filter(Boolean) : [],
                prompt: prompt,
                tags: tags ? tags.split(',').map(s => s.trim()).filter(Boolean) : []
            };

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
                if (res.ok) {
                    document.getElementById('task-repos').value = '';
                    document.getElementById('task-prompt').value = '';
                    document.getElementById('task-tags').value = '';
                    refresh();
                }
            } catch (e) {
                console.error('submit failed:', e);
            }
        }

        // rerunTask creates a new task from an existing one.
        async function rerunTask(taskId) {
            try {
                const res = await fetch('/api/tasks/' + taskId + '/rerun', {
                    method: 'POST',
                });
                if (!res.ok) {
                    alert('Failed to re-run task');
                    return;
                }
                const newTask = await res.json();
                refresh();
                // Navigate to the new task
                selectTask(newTask.id);
            } catch (e) {
                console.error('rerun failed:', e);
            }
        }

        // WebSocket for live updates
        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${location.host}/ws`;
            console.log('Connecting to WebSocket:', url);
            ws = new WebSocket(url);
            ws.onopen = () => {
                console.log('WebSocket connected');
            };
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
            ws.onclose = (event) => {
                console.log('WebSocket closed (code:', event.code, 'reason:', event.reason, ') — reconnecting in 5s');
                setTimeout(connectWS, 5000);
            };
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.method === 'task.updated') {
                        // Parse params — may be a string or already an object
                        let params = {};
                        if (typeof msg.params === 'string') {
                            try { params = JSON.parse(msg.params); } catch(e) {}
                        } else {
                            params = msg.params || {};
                        }
                        let taskId = params.task_id || null;
                        refresh();
                        if (taskId === activeTaskId) {
                            refreshTaskDetail(taskId);
                        }
                    } else if (msg.method === 'task.log') {
                        // Parse params — params may be a string (JSON-encoded) or already an object
                        let params = {};
                        if (typeof msg.params === 'string') {
                            try { params = JSON.parse(msg.params); } catch(e) { params = {}; }
                        } else {
                            params = msg.params || {};
                        }

                        // Accumulate log in memory with structured tool fields
                        const logEntry = {
                            task_id: params.task_id,
                            line: params.line,
                            level: params.level || 'info',
                            timestamp: new Date().toISOString(),
                            tool_type:   params.tool_type,
                            tool_name:   params.tool_name,
                            tool_id:     params.tool_id,
                            tool_args:   params.tool_args,
                            tool_output: params.tool_output,
                            tool_error:  params.tool_error,
                        };
                        if (!taskLogs[params.task_id]) {
                            taskLogs[params.task_id] = [];
                        }
                        taskLogs[params.task_id].push(logEntry);

                        // Append to detail view if active
                        if (params.task_id === activeTaskId) {
                            appendLogToDetail(logEntry);
                        }
                    }
                } catch (e) {}
            };
        }

        function appendLogToDetail(logEntry) {
            const view = document.getElementById('log-view');
            const body = view.querySelector('.task-detail-body');
            if (!body) return;

            const level = logEntry.level || '';
            const line = logEntry.line;

            // Use structured fields to determine event type.
            if (level === 'tool' && logEntry.tool_type) {
                if (logEntry.tool_type === 'start') {
                    const frag = renderToolBlockStart({
                        toolName: logEntry.tool_name, toolId: logEntry.tool_id,
                        args: logEntry.tool_args, output: '', status: 'running', hasOutput: false
                    }, '', '');
                    body.appendChild(frag);
                    body.scrollTop = body.scrollHeight;
                    return;
                }

                if (logEntry.tool_type === 'output') {
                    const block = body.querySelector(`#tool-${logEntry.tool_id}`);
                    if (block) {
                        const outputDiv = block.querySelector('.tool-output');
                        if (outputDiv) {
                            const pre = outputDiv.querySelector('pre');
                            if (pre) {
                                pre.textContent += logEntry.tool_output;
                            } else {
                                outputDiv.innerHTML = '<pre>' + escapeHtml(logEntry.tool_output) + '</pre>';
                            }
                        }
                    }
                    body.scrollTop = body.scrollHeight;
                    return;
                }

                if (logEntry.tool_type === 'end') {
                    const block = body.querySelector(`#tool-${logEntry.tool_id}`);
                    if (block) {
                        const statusClass = logEntry.tool_error ? 'error' : 'success';
                        const statusLabel = logEntry.tool_error ? 'error' : 'done';
                        // Reconstruct args from the existing tool-args div
                        const argsEl = block.querySelector('.tool-args');
                        const args = argsEl ? argsEl.textContent : '';
                        const cmdLine = renderCommandLineHeader(logEntry.tool_name, args);
                        const header = block.querySelector('.tool-block-header');
                        header.innerHTML = `
                            <div>
                                <span class="tool-icon">🔧</span>
                                <span class="tool-name">${escapeHtml(logEntry.tool_name)}</span>
                                ${cmdLine}
                            </div>
                            <div style="display:flex;align-items:center;gap:0.5rem;">
                                <span class="tool-status ${statusClass}">${statusLabel}</span>
                                <span class="tool-chevron">▶</span>
                            </div>
                        `;
                        highlightCommandLines(block);
                        const bodyEl = block.querySelector('.tool-block-body');
                        let outputDiv = bodyEl.querySelector('.tool-output');
                        if (!outputDiv) {
                            bodyEl.innerHTML = '<div class="tool-output"><div class="output-label">Output</div></div>';
                            outputDiv = bodyEl.querySelector('.tool-output');
                        }
                        if (logEntry.tool_output) {
                            const pre = outputDiv.querySelector('pre');
                            if (pre) {
                                pre.textContent += logEntry.tool_output;
                            } else {
                                outputDiv.innerHTML = '<pre>' + escapeHtml(logEntry.tool_output) + '</pre>';
                            }
                        }
                        // Auto-open the block when completed
                        bodyEl.classList.add('open');
                        const chevron = header.querySelector('.tool-chevron');
                        if (chevron) chevron.classList.add('open');
                    }
                    body.scrollTop = body.scrollHeight;
                    return;
                }
            }

            // Non-tool log lines: render based on level
            let msgEl;
            if (level === 'thinking') {
                // Render as a collapsible thinking block
                const blockId = nextThinkingBlockId();
                msgEl = document.createElement('div');
                msgEl.className = 'thinking-block';
                msgEl.id = 'thinking-' + blockId;
                msgEl.innerHTML = `
                    <div class="thinking-block-header" onclick="toggleThinkingBlock('${blockId}')">
                        <div>
                            <span class="thinking-icon">💭</span>
                            <span class="thinking-label">Thinking</span>
                        </div>
                        <span class="thinking-chevron">▶</span>
                    </div>
                    <div class="thinking-block-body" id="thinking-body-${blockId}">
                        <div class="thinking-content">${escapeHtml(line)}</div>
                    </div>
                `;
            } else if (level === 'system') {
                msgEl = document.createElement('div');
                msgEl.className = 'log-msg system';
                msgEl.textContent = line;
            } else if (level === 'error') {
                msgEl = document.createElement('div');
                msgEl.className = 'log-msg error';
                msgEl.textContent = line;
            } else {
                msgEl = document.createElement('div');
                msgEl.className = 'log-msg guest';
                const inner = document.createElement('div');
                inner.className = 'md-rendered';
                inner.innerHTML = renderMarkdown(line);
                msgEl.appendChild(inner);
            }
            body.appendChild(msgEl);
            body.scrollTop = body.scrollHeight;

            // Update log count in header
            const meta = view.querySelector('.task-detail-meta');
            if (meta) {
                const count = taskLogs[logEntry.task_id]?.length || 0;
                meta.textContent = `${meta.textContent.split(' · ')[0]} · ${count} log entries`;
            }
        }

        // =====================================================================
        // Log browser
        // =====================================================================

        let logBreadcrumb = []; // [date, taskID?, ...]

        async function loadLogDates(fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            router.push('/logs');
            routerReplaceMode = false;
            const view = document.getElementById('log-view');
            try {
                const res = await fetch('/api/logs');
                if (!res.ok) {
                    view.innerHTML = '<div class="empty-state"><span>⚠️</span>Log store not configured (set log_dir in server.yaml)</div>';
                    return;
                }
                const data = await res.json();
                renderLogDates(data.dates || []);
            } catch (e) {
                view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load logs: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderLogDates(dates) {
            const view = document.getElementById('log-view');
            if (dates.length === 0) {
                view.innerHTML = '<div class="empty-state"><span>📭</span>No log dates found</div>';
                return;
            }
            let html = '<div class="log-breadcrumb"><span class="current">All Dates</span></div>';
            html += '<div id="log-dates-list">';
            html += dates.map(d => `
                <div class="log-task-item" onclick="loadLogTasks('${d}')">
                    <span class="log-task-id">📅 ${d}</span>
                </div>
            `).join('');
            html += '</div>';
            view.innerHTML = html;
        }

        async function loadLogTasks(date, fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            router.push('/logs/' + date);
            routerReplaceMode = false;
            logBreadcrumb = [date];
            const view = document.getElementById('log-view');
            try {
                const res = await fetch('/api/logs/' + date);
                if (!res.ok) {
                    view.innerHTML = '<div class="empty-state"><span>⚠️</span>No tasks found for ' + date + '</div>';
                    return;
                }
                const data = await res.json();
                renderLogTaskList(date, data.summaries || [], data.count || 0);
            } catch (e) {
                view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load tasks: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderLogTaskList(date, summaries, count) {
            const view = document.getElementById('log-view');
            let html = '<div class="log-breadcrumb">';
            html += '<span class="crumb" onclick="loadLogDates()">All Dates</span>';
            html += '<span class="separator">›</span>';
            html += '<span class="current">' + date + ' (' + count + ' tasks)</span>';
            html += '</div>';
            if (summaries.length === 0) {
                html += '<div class="empty-state"><span>📭</span>No tasks for this date</div>';
            } else {
                html += '<div id="log-tasks-list">';
                html += summaries.map(s => {
                    const ts = s.start_timestamp
                        ? new Date(s.start_timestamp).toLocaleString()
                        : 'unknown';
                    return `
                    <div class="log-task-item" onclick="loadLogEntries('${date}', '${s.task_id}')">
                        <span class="log-task-id">🔖 ${escapeHtml(s.task_id)}</span>
                        <span class="log-task-count">${ts}</span>
                    </div>`;
                }).join('');
                html += '</div>';
            }
            view.innerHTML = html;
        }

        async function loadLogEntries(date, taskID, fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            router.push('/logs/' + date + '/' + taskID);
            routerReplaceMode = false;
            logBreadcrumb = [date, taskID];
            const view = document.getElementById('log-view');
            try {
                const res = await fetch('/api/logs/' + date + '/' + taskID);
                if (!res.ok) {
                    view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load entries</div>';
                    return;
                }
                const data = await res.json();
                renderLogEntries(date, taskID, data.entries || [], data.count || 0);
            } catch (e) {
                view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load entries: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderLogEntries(date, taskID, entries, count) {
            const view = document.getElementById('log-view');
            let html = '<div class="log-breadcrumb">';
            html += '<span class="crumb" onclick="loadLogDates()">All Dates</span>';
            html += '<span class="separator">›</span>';
            html += '<span class="crumb" onclick="loadLogTasks(\'' + date + '\')">' + date + '</span>';
            html += '<span class="separator">›</span>';
            html += '<span class="current">' + escapeHtml(taskID) + ' (' + count + ' entries)</span>';
            html += '</div>';

            if (entries.length === 0) {
                html += '<div class="empty-state"><span>📭</span>No log entries for this task</div>';
            } else {
                // Use rich tool-block rendering (same as task detail view)
                const isRunning = false; // Logs view is static; streaming handled separately
                let currentToolBlock = null;
                let entriesHtml = '';

                entries.forEach((log) => {
                    const level = log.level || '';

                    // Use structured fields to determine event type.
                    if (level === 'tool' && log.tool_type) {
                        if (log.tool_type === 'start') {
                            if (currentToolBlock) {
                                // Flush previous incomplete block
                                entriesHtml += buildToolBlockHTML(
                                    currentToolBlock.toolName, currentToolBlock.toolId,
                                    currentToolBlock.args, currentToolBlock.output, 'running'
                                );
                            }
                            currentToolBlock = {
                                toolName: log.tool_name, toolId: log.tool_id,
                                args: log.tool_args, output: '', status: 'running', hasOutput: false
                            };
                            return;
                        }

                        if (log.tool_type === 'output') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                currentToolBlock.output += log.tool_output;
                                currentToolBlock.hasOutput = true;
                            }
                            return;
                        }

                        if (log.tool_type === 'end') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                if (log.tool_output) currentToolBlock.output += log.tool_output;
                                currentToolBlock.status = log.tool_error ? 'error' : 'success';
                            }
                            // Build and append the complete tool block now that we have all output
                            entriesHtml += buildToolBlockHTML(
                                currentToolBlock.toolName, currentToolBlock.toolId,
                                currentToolBlock.args, currentToolBlock.output,
                                currentToolBlock.status
                            );
                            currentToolBlock = null;
                            return;
                        }
                    }

                    // Non-tool log lines
                    if (currentToolBlock) {
                        entriesHtml += buildToolBlockHTML(
                            currentToolBlock.toolName, currentToolBlock.toolId,
                            currentToolBlock.args, currentToolBlock.output, 'running'
                        );
                        currentToolBlock = null;
                    }

                    let msgHtml;
                    if (level === 'thinking') {
                        msgHtml = buildThinkingBlockHTML(log.line);
                    } else if (level === 'system') {
                        msgHtml = `<div class="log-msg system">${escapeHtml(log.line)}</div>`;
                    } else if (level === 'error') {
                        msgHtml = `<div class="log-msg error">${escapeHtml(log.line)}</div>`;
                    } else {
                        msgHtml = `<div class="log-msg guest"><div class="md-rendered">${renderMarkdown(log.line)}</div></div>`;
                    }
                    entriesHtml += msgHtml;
                });

                // Close any remaining open tool block
                if (currentToolBlock) {
                    entriesHtml += buildToolBlockHTML(
                        currentToolBlock.toolName, currentToolBlock.toolId,
                        currentToolBlock.args, currentToolBlock.output, 'running'
                    );
                    currentToolBlock = null;
                }

                html += '<div id="log-entries-list">' + entriesHtml + '</div>';
            }
            view.innerHTML = html;
            highlightCommandLines(view);
        }

        // Handle browser back/forward — re-dispatch to the correct view.
        window.addEventListener('popstate', async () => {
            await router.dispatch(false);
        });

        // Initial load: refresh data, connect WebSocket, then dispatch the
        // current URL to the correct view (restores state after page refresh).
        (async () => {
            connectWS();
            refreshInterval = setInterval(refresh, 5000);
            await refresh();
            await router.dispatch(true);
        })();
    </script>
</body>
</html>
