<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotelier — Guest Queue Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.30.0/components/prism-bash.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; }
        .header { background: #1e293b; padding: 1rem 2rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.5rem; color: #38bdf8; }
        .stats { display: flex; gap: 2rem; }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: #38bdf8; }
        .stat-label { font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; }
        /* The concurrency cap is editable in place (issue #264): a small
           number field with an update button, in the shape of the stat the
           header had before. */
        .concurrency-edit { display: flex; gap: 0.375rem; align-items: center; justify-content: center; font-weight: normal; }
        .concurrency-input { width: 7ch; padding: 0.125rem 0.25rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.375rem; color: #38bdf8; font-size: 1.1rem; font-weight: bold; text-align: center; font-family: inherit; }
        .container { display: flex; height: calc(100vh - 60px); }
        .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; }
        .main { display: flex; flex-direction: column; flex: 1; overflow: hidden; padding: 1rem; min-height: 0; }
        .panel { padding: 1rem; border-bottom: 1px solid #334155; }
        .panel h3 { font-size: 0.875rem; color: #94a3b8; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .guest-item { padding: 0.5rem; margin-bottom: 0.5rem; background: #0f172a; border-radius: 0.375rem; cursor: pointer; }
        .guest-item:hover { background: #1e293b; }
        .guest-name { font-weight: 600; font-size: 0.875rem; }
        .guest-tags { font-size: 0.75rem; color: #64748b; margin-top: 0.25rem; }
        .guest-uid { font-size: 0.7rem; color: #64748b; margin-top: 0.25rem; font-family: 'SF Mono', 'Fira Code', monospace; }
        .guest-host { font-size: 0.7rem; color: #64748b; margin-top: 0.125rem; }
        .guest-latency { font-size: 0.7rem; color: #64748b; margin-top: 0.125rem; }
        .guest-latency.latency-warn { color: #f59e0b; }
        .guest-latency.latency-crit { color: #ef4444; }
        .guest-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.5rem; }
        .status-idle { background: #22c55e; }
        .status-running { background: #f59e0b; }
        .status-disconnected { background: #ef4444; }
        .task-item { padding: 0.75rem; margin-bottom: 0.5rem; background: #1e293b; border-radius: 0.375rem; border-left: 3px solid #38bdf8; cursor: pointer; transition: background 0.15s; position: relative; }
        .task-item:hover { background: #334155; }
        .task-item.active { background: #334155; border-left-color: #38bdf8; box-shadow: inset 0 0 0 1px #38bdf8; }
        .task-item.completed { border-left-color: #22c55e; }
        .task-item.failed { border-left-color: #ef4444; }
        .task-item.cancelled { border-left-color: #94a3b8; }
        .task-btn-row { position: absolute; top: 0.5rem; right: 0.5rem; display: flex; gap: 0.25rem; align-items: center; }
        .task-id { font-weight: 600; font-size: 0.875rem; }
        /* Task title shown ahead of the ID (issue #229). In the overview
           list it truncates with an ellipsis (the full title stays
           available via the element's title attribute); the drill-down
           shows it in full. */
        .task-title { font-weight: 600; margin-right: 0.375rem; }
        .task-item .task-title { display: inline-block; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
        .task-detail-id .task-title { white-space: normal; overflow-wrap: anywhere; }
        .task-title a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
        .task-title a:hover { text-decoration: none; }
        .task-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
        .task-prompt { font-size: 0.85rem; color: #cbd5e1; margin-top: 0.5rem; }
        .submit-form { padding: 1rem; background: #1e293b; border-radius: 0.375rem; margin-bottom: 1rem; }
        .submit-form h3 { margin-bottom: 0.75rem; }
        .form-group { margin-bottom: 0.75rem; }
        .form-group label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.375rem; color: #e2e8f0; font-family: inherit; }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .btn { padding: 0.5rem 1rem; background: #3b82f6; color: white; border: none; border-radius: 0.375rem; cursor: pointer; font-size: 0.875rem; }
        .btn:hover { background: #2563eb; }
        .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; }
        .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
        .btn-ghost:hover { background: #1e293b; color: #e2e8f0; }
        .btn-danger { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
        .btn-danger:hover { background: #991b1b; color: #fecaca; }

        /* Task detail view */
        .task-detail { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        .task-detail-header { display: flex; justify-content: space-between; align-items: center; padding: 1rem; background: #1e293b; border-radius: 0.5rem 0.5rem 0 0; border: 1px solid #334155; border-bottom: none; }
        .task-detail-id { font-weight: 600; font-size: 0.875rem; color: #38bdf8; }
        .task-detail-id .task-title a { color: inherit; }
        .task-detail-meta { font-size: 0.75rem; color: #94a3b8; margin-top: 0.25rem; }
        /* Hourglass spinner for running tasks (issue #210). In the task
           detail view rotation is keyed off the task's log count (angle =
           log_count % 360 degrees), so the ⏳ advances each time a new log
           entry arrives. inline-block so the transform applies to the glyph;
           the transition animates the step. On the /tasks/ overview page the
           angle instead tracks activity (issue #246): a JS ticker advances it
           in small steps while the task's log count is changing between
           updates, so the list spinner interpolates linearly per tick. */
        .task-spinner { display: inline-block; transform: rotate(0deg); transition: transform 0.3s ease; }
        .task-spinner.list-spinner { transition: transform 0.05s linear; }
        /* Collapsible prompt section */
        .task-detail-prompt { border: 1px solid #334155; border-top: none; border-radius: 0 0 0.5rem 0.5rem; margin-bottom: 1rem; overflow: hidden; }
        .task-detail-prompt-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 1rem; background: #1e293b; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .task-detail-prompt-header:hover { background: #253347; }
        .task-detail-prompt-header .prompt-label { font-weight: 600; color: #38bdf8; }
        .task-detail-prompt-header .prompt-preview { color: #64748b; font-size: 0.75rem; margin-left: 0.5rem; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 400px; display: inline-block; }
        .task-detail-prompt-header .prompt-chevron { color: #64748b; transition: transform 0.15s; font-size: 0.75rem; }
        .task-detail-prompt-header .prompt-chevron.open { transform: rotate(90deg); }
        .task-detail-prompt-body { display: none; background: #0f172a; }
        .task-detail-prompt-body.open { display: block; }
        .task-detail-prompt-body .md-rendered { padding: 0.75rem 1rem; font-size: 0.85rem; color: #cbd5e1; line-height: 1.6; }
        .task-detail-prompt-body .md-rendered h1, .task-detail-prompt-body .md-rendered h2, .task-detail-prompt-body .md-rendered h3, .task-detail-prompt-body .md-rendered h4, .task-detail-prompt-body .md-rendered h5, .task-detail-prompt-body .md-rendered h6 { margin: 0.5em 0 0.25em; font-weight: 600; }
        .task-detail-prompt-body .md-rendered h1 { font-size: 1.15em; }
        .task-detail-prompt-body .md-rendered h2 { font-size: 1.05em; }
        .task-detail-prompt-body .md-rendered h3 { font-size: 1em; }
        .task-detail-prompt-body .md-rendered p { margin: 0.25em 0; }
        .task-detail-prompt-body .md-rendered code { background: #1e293b; padding: 0.125em 0.375em; border-radius: 0.25em; font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', monospace; }
        .task-detail-prompt-body .md-rendered pre { background: #1e293b; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin: 0.5em 0; }
        .task-detail-prompt-body .md-rendered pre code { background: none; padding: 0; }
        .task-detail-prompt-body .md-rendered ul, .task-detail-prompt-body .md-rendered ol { margin: 0.25em 0; padding-left: 1.5em; }
        .task-detail-prompt-body .md-rendered li { margin: 0.125em 0; }
        .task-detail-prompt-body .md-rendered blockquote { border-left: 3px solid #38bdf8; padding-left: 0.75rem; margin: 0.5em 0; color: #94a3b8; }
        .task-detail-prompt-body .md-rendered a { color: #38bdf8; text-decoration: none; }
        .task-detail-prompt-body .md-rendered a:hover { text-decoration: underline; }
        .task-detail-prompt-body .md-rendered strong { font-weight: 600; }
        .task-detail-prompt-body .md-rendered em { font-style: italic; }
        .task-detail-prompt-body .md-rendered table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.85rem; }
        .task-detail-prompt-body .md-rendered th, .task-detail-prompt-body .md-rendered td { border: 1px solid #334155; padding: 0.375rem 0.75rem; text-align: left; }
        .task-detail-prompt-body .md-rendered th { background: #1e293b; font-weight: 600; }
        .task-detail-prompt-body .md-rendered tr:nth-child(even) { background: #0f172a; }
        .task-detail-body { flex: 1; overflow-y: auto; padding: 0.5rem 0; }

        /* Streaming log messages */
        .log-msg { margin-bottom: 0.5rem; padding: 0.5rem 0.75rem; border-radius: 0.375rem; font-size: 0.85rem; line-height: 1.6; }
        .log-msg.guest { background: #0f172a; border-left: 2px solid #22c55e; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; white-space: pre-wrap; }
        .log-msg.guest .md-rendered { white-space: normal; }
        .log-msg.guest .md-rendered h1, .log-msg.guest .md-rendered h2, .log-msg.guest .md-rendered h3, .log-msg.guest .md-rendered h4, .log-msg.guest .md-rendered h5, .log-msg.guest .md-rendered h6 { margin: 0.5em 0 0.25em; font-weight: 600; }
        .log-msg.guest .md-rendered h1 { font-size: 1.25em; }
        .log-msg.guest .md-rendered h2 { font-size: 1.1em; }
        .log-msg.guest .md-rendered h3 { font-size: 1em; }
        .log-msg.guest .md-rendered p { margin: 0.25em 0; }
        .log-msg.guest .md-rendered code { background: #1e293b; padding: 0.125em 0.375em; border-radius: 0.25em; font-size: 0.9em; font-family: 'SF Mono', 'Fira Code', monospace; }
        .log-msg.guest .md-rendered pre { background: #1e293b; padding: 0.75rem; border-radius: 0.375rem; overflow-x: auto; margin: 0.5em 0; }
        .log-msg.guest .md-rendered pre code { background: none; padding: 0; }
        .log-msg.guest .md-rendered table { border-collapse: collapse; width: 100%; margin: 0.5em 0; font-size: 0.85rem; }
        .log-msg.guest .md-rendered th, .log-msg.guest .md-rendered td { border: 1px solid #334155; padding: 0.375rem 0.75rem; text-align: left; }
        .log-msg.guest .md-rendered th { background: #1e293b; font-weight: 600; }
        .log-msg.guest .md-rendered tr:nth-child(even) { background: #0f172a; }
        .log-msg.guest .md-rendered ul, .log-msg.guest .md-rendered ol { margin: 0.25em 0; padding-left: 1.5em; }
        .log-msg.guest .md-rendered li { margin: 0.125em 0; }
        .log-msg.guest .md-rendered blockquote { border-left: 3px solid #38bdf8; padding-left: 0.75rem; margin: 0.5em 0; color: #94a3b8; }
        .log-msg.guest .md-rendered a { color: #38bdf8; text-decoration: none; }
        .log-msg.guest .md-rendered a:hover { text-decoration: underline; }
        .log-msg.guest .md-rendered hr { border: none; border-top: 1px solid #334155; margin: 0.75em 0; }
        .log-msg.guest .md-rendered strong { font-weight: 600; }
        .log-msg.guest .md-rendered em { font-style: italic; }
        .log-msg.system { color: #64748b; font-size: 0.75rem; font-style: italic; padding-left: 0.75rem; }
        .log-msg.error { background: #1c0a0a; border-left: 2px solid #ef4444; color: #fca5a5; }
        .log-msg.unknown-event { background: #1e293b; border-left: 2px solid #475569; color: #64748b; font-size: 0.75rem; }
        .log-msg.unknown-event pre { margin: 0; white-space: pre-wrap; word-break: break-word; }
        .log-msg .timestamp { color: #475569; font-size: 0.7rem; font-family: 'SF Mono', 'Fira Code', monospace; margin-right: 0.5rem; }

        /* Thinking blocks — collapsible reasoning output */
        .thinking-block { margin-bottom: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid #2d1b69; }
        .thinking-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: #1a1038; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .thinking-block-header:hover { background: #251747; }
        .thinking-block-header .thinking-icon { margin-right: 0.5rem; }
        .thinking-block-header .thinking-label { font-weight: 600; color: #a78bfa; font-size: 0.8rem; }
        .thinking-block-header > div:first-child { min-width: 0; } /* allow shrink to prevent overflow */
        .thinking-block-header .thinking-preview { color: #7c6bb5; font-size: 0.75rem; margin-left: 0.5rem; font-style: italic; }
        .thinking-block-header .thinking-chevron { color: #6b5b95; transition: transform 0.15s; font-size: 0.75rem; }
        .thinking-block-header .thinking-chevron.open { transform: rotate(90deg); }
        .thinking-block-body { display: none; background: #0f0a1e; border-top: 1px solid #2d1b69; }
        .thinking-block-body.open { display: block; }
        .thinking-block-body .thinking-content { padding: 0.5rem 0.75rem; font-size: 0.8rem; color: #94a3b8; font-style: italic; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }

        /* Spawn block — collapsible pre-run troubleshooting output (Issue #45) */
        .spawn-block { margin-bottom: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid #1e3a5f; }
        .spawn-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: #0c1929; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .spawn-block-header:hover { background: #162640; }
        .spawn-block-header .spawn-icon { margin-right: 0.5rem; }
        .spawn-block-header .spawn-label { font-weight: 600; color: #38bdf8; font-size: 0.8rem; }
        .spawn-block-header .spawn-preview { color: #2563eb; font-size: 0.75rem; margin-left: 0.5rem; font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; display: inline-block; }
        .spawn-block-header .spawn-chevron { color: #3b82f6; transition: transform 0.15s; font-size: 0.75rem; }
        .spawn-block-header .spawn-chevron.open { transform: rotate(90deg); }
        .spawn-block-body { display: none; background: #0a1628; border-top: 1px solid #1e3a5f; }
        .spawn-block-body.open { display: block; }
        .spawn-block-body .spawn-content { padding: 0.5rem 0.75rem; font-size: 0.8rem; color: #64748b; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        /* Compaction block — context compaction events (issue #53) */
        .compaction-block { margin-bottom: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid #134e4a; }
        .compaction-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: #042f2e; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .compaction-block-header:hover { background: #134e4a; }
        .compaction-block-header .compaction-icon { margin-right: 0.5rem; }
        .compaction-block-header .compaction-label { font-weight: 600; color: #2dd4bf; font-size: 0.8rem; }
        .compaction-block-header .compaction-reason { color: #5eead4; font-size: 0.7rem; margin-left: 0.5rem; background: rgba(45, 212, 191, 0.12); padding: 0.1rem 0.4rem; border-radius: 0.25rem; font-family: 'SF Mono', 'Fira Code', monospace; }
        .compaction-block-header .compaction-tokens { color: #99f6e4; font-size: 0.7rem; margin-left: 0.5rem; font-family: 'SF Mono', 'Fira Code', monospace; }
        .compaction-block-header .compaction-status { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .compaction-block-header .compaction-status.running { color: #f59e0b; }
        .compaction-block-header .compaction-status.done { color: #2dd4bf; }
        .compaction-block-header .compaction-status.error { color: #ef4444; }
        .compaction-block-header .compaction-chevron { color: #2dd4bf; transition: transform 0.15s; font-size: 0.75rem; }
        .compaction-block-header .compaction-chevron.open { transform: rotate(90deg); }
        .compaction-block-body { display: none; background: #022c22; border-top: 1px solid #134e4a; }
        .compaction-block-body.open { display: block; }
        .compaction-block-body .compaction-summary { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #cbd5e1; font-family: 'SF Mono', 'Fira Code', monospace; }
        .compaction-block-body .compaction-summary .output-label { color: #475569; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .compaction-block-body .compaction-summary pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: inherit; font-size: inherit; color: inherit; max-height: 300px; overflow-y: auto; }
        .compaction-block-body .compaction-error-text { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #fca5a5; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; }
        .compaction-block-body .compaction-pending { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #64748b; font-style: italic; }

        /* Tool call blocks */
        .tool-block { margin-bottom: 0.75rem; border-radius: 0.5rem; overflow: hidden; border: 1px solid #334155; }
        .tool-block-header { display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; background: #1e293b; cursor: pointer; user-select: none; font-size: 0.8rem; }
        .tool-block-header:hover { background: #253347; }
        .tool-block-header .tool-icon { margin-right: 0.5rem; }
        .tool-block-header .tool-name { font-weight: 600; color: #f59e0b; font-family: 'SF Mono', 'Fira Code', monospace; }
        .tool-block-header .tool-status { margin-left: 0.75rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; }
        .tool-block-header .tool-status.running { color: #f59e0b; }
        .tool-block-header .tool-status.success { color: #22c55e; }
        .tool-block-header .tool-status.error { color: #ef4444; }
        .tool-block-header .tool-chevron { color: #64748b; transition: transform 0.15s; font-size: 0.75rem; }
        .tool-block-header .tool-chevron.open { transform: rotate(90deg); }
        .tool-block-body { display: none; background: #0f172a; border-top: 1px solid #334155; }
        .tool-block-body.open { display: block; }
        .tool-block-body .tool-args { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #94a3b8; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; }
        .tool-block-body .tool-output { padding: 0.5rem 0.75rem; font-size: 0.75rem; color: #cbd5e1; font-family: 'SF Mono', 'Fira Code', monospace; white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; border-top: 1px solid #1e293b; }
        .tool-block-body .tool-output pre { margin: 0; white-space: pre-wrap; word-break: break-all; font-family: inherit; font-size: inherit; color: inherit; }
        .tool-block-body .tool-output .output-label { color: #475569; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }

        /* Inline diff for edit tool calls (Issue #2) */
        .tool-diff { margin: 0.5rem 0.75rem; border: 1px solid #1e293b; border-radius: 0.25rem; background: #0c1929; overflow-x: auto; }
        .diff-hunk { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; line-height: 1.5; }
        .diff-hunk + .diff-hunk { border-top: 1px dashed #334155; }
        .diff-line { display: flex; padding: 0 0.5rem; }
        .diff-sign { flex: 0 0 0.75rem; user-select: none; color: #475569; }
        .diff-text { flex: 1; white-space: pre-wrap; word-break: break-word; }
        .diff-line.same .diff-text { color: #64748b; }
        .diff-line.del { background: rgba(239, 68, 68, 0.10); }
        .diff-line.del .diff-sign { color: #f87171; }
        .diff-line.add { background: rgba(34, 197, 94, 0.10); }
        .diff-line.add .diff-sign { color: #4ade80; }
        .diff-word-del { background: rgba(239, 68, 68, 0.28); border-radius: 0.125rem; }
        .diff-word-add { background: rgba(34, 197, 94, 0.28); border-radius: 0.125rem; }

        /* Subtle bash command-line highlighting (Prism.js tokens) */
        .command-line { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; color: #cbd5e1; margin-left: 0.5rem; }
        .command-line .token.function       { color: #8ddb8c; }

        .streaming-cursor::after { content: '▊'; animation: blink 1s infinite; color: #22c55e; }

        .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: #475569; font-size: 0.875rem; flex-direction: column; gap: 0.5rem; }
        .empty-state span { font-size: 2rem; }

        .tab-bar { display: flex; gap: 0; margin-bottom: 1rem; }
        .tab { padding: 0.5rem 1rem; background: #1e293b; border: 1px solid #334155; border-bottom: none; border-radius: 0.375rem 0.375rem 0 0; cursor: pointer; font-size: 0.875rem; }
        .tab.active { background: #334155; }
        .log-breadcrumb { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem; background: #1e293b; border-radius: 0.5rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .log-breadcrumb .crumb { color: #38bdf8; cursor: pointer; text-decoration: underline; font-size: 0.875rem; }
        .log-breadcrumb .crumb:hover { color: #7dd3fc; }
        .log-breadcrumb .separator { color: #475569; font-size: 0.75rem; }
        .log-breadcrumb .current { color: #94a3b8; font-size: 0.875rem; }
        .log-breadcrumb .download-btn { margin-left: auto; }
        .log-task-item { padding: 0.5rem 0.75rem; margin-bottom: 0.25rem; background: #1e293b; border-radius: 0.375rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .log-task-item:hover { background: #334155; }
        .log-task-id { font-size: 0.85rem; color: #e2e8f0; }
        .log-task-count { font-size: 0.7rem; color: #64748b; }
        /* Task output search (issue #270). The form carries a query and a
           lookback window and nothing else: the window rules (default, cap,
           rejection) live in the server, so the page never pre-judges them. */
        .search-form { display: flex; gap: 0.5rem; align-items: flex-end; margin-bottom: 0.75rem; flex-wrap: wrap; }
        .search-form label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.25rem; }
        .search-form input { width: 100%; padding: 0.5rem; background: #0f172a; border: 1px solid #334155; border-radius: 0.375rem; color: #e2e8f0; font-family: inherit; }
        .search-form .search-query-group { flex: 1; min-width: 200px; }
        .search-form .search-days-group { width: 9rem; }
        .search-note { padding: 0.5rem 0.75rem; margin-bottom: 0.75rem; background: #1e293b; border-radius: 0.375rem; font-size: 0.8rem; color: #94a3b8; }
        .search-note.error { background: #450a0a; color: #fca5a5; }
        .search-match { padding: 0.5rem 0.75rem; margin-bottom: 0.5rem; background: #1e293b; border-radius: 0.375rem; cursor: pointer; }
        .search-match:hover { background: #334155; }
        .search-match-head { display: flex; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.375rem; font-size: 0.75rem; color: #64748b; }
        .search-match-task { color: #e2e8f0; font-size: 0.85rem; }
        .search-match-status { display: inline-block; padding: 0.05rem 0.35rem; border-radius: 0.25rem; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; background: #1e3a5f; color: #38bdf8; margin-left: 0.35rem; }
        .search-match-lines { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; line-height: 1.4; }
        .search-match-line { white-space: pre-wrap; word-break: break-word; color: #cbd5e1; }
        .search-match-line.context { color: #64748b; }
        .search-match-line mark { background: #0ea5e9; color: #0f172a; border-radius: 0.15rem; }
        .log-entry-line { padding: 0.375rem 0.75rem; border-bottom: 1px solid #1e293b; font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        .log-entry-line:last-child { border-bottom: none; }
        .log-entry-line .log-level-badge { display: inline-block; padding: 0.05rem 0.35rem; border-radius: 0.25rem; font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-right: 0.5rem; min-width: 3.5em; text-align: center; vertical-align: middle; }
        .log-entry-line .log-level-badge.tool { background: #422006; color: #fbbf24; }
        .log-entry-line .log-level-badge.text { background: #172554; color: #60a5fa; }
        .log-entry-line .log-level-badge.info { background: #1e3a5f; color: #38bdf8; }
        .log-entry-line .log-level-badge.system { background: #1e293b; color: #64748b; }
        .log-entry-line .log-level-badge.error { background: #450a0a; color: #fca5a5; }
        .log-entry-line .log-level-badge.thinking { background: #1e1045; color: #a78bfa; }
        .log-entry-line .log-timestamp { color: #475569; font-size: 0.65rem; font-family: 'SF Mono', 'Fira Code', monospace; margin-right: 0.5rem; }
        .log-entry-line .log-content { color: #cbd5e1; }
        .log-entry-line[data-level="tool"] { border-left: 2px solid #f59e0b; }
        .log-entry-line[data-level="text"] { border-left: 2px solid #3b82f6; }
        .log-entry-line[data-level="info"] { border-left: 2px solid #06b6d4; }
        .log-entry-line[data-level="system"] { border-left: 2px solid #64748b; }
        .log-entry-line[data-level="error"] { border-left: 2px solid #ef4444; }
        .log-entry-line[data-level="thinking"] { border-left: 2px solid #a78bfa; }
        .log-entry-line[data-level=""] { border-left: 2px solid #334155; }
        .badge { display: inline-block; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.625rem; font-weight: 600; text-transform: uppercase; }
        .badge-pending { background: #334155; color: #94a3b8; }
        .badge-assigned { background: #1e3a5f; color: #38bdf8; }
        .badge-running { background: #422006; color: #f59e0b; }
        .badge-completed { background: #052e16; color: #22c55e; }
        .badge-failed { background: #450a0a; color: #ef4444; }
        .badge-cancelled { background: #1c1917; color: #78716c; }
        .badge-priority { background: #1e293b; color: #fbbf24; margin-left: 0.25rem; }
        .persona-badge { display: inline-block; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.625rem; font-weight: 600; }
        .persona-badge-0 { background: #1e1045; color: #c4b5fd; }
        .persona-badge-1 { background: #1e3a5f; color: #93c5fd; }
        .persona-badge-2 { background: #0f4c4a; color: #5eead4; }
        .persona-badge-3 { background: #14532d; color: #86efac; }
        .persona-badge-4 { background: #78350f; color: #fde68a; }
        .persona-badge-5 { background: #7f1d1d; color: #fca5a5; }
        .persona-badge-6 { background: #831843; color: #f9a8d4; }
        .persona-badge-7 { background: #312e81; color: #a5b4fc; }
        .task-error { background: #1c0a0a; border: 1px solid #7f1d1d; border-radius: 0.375rem; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.85rem; color: #fca5a5; line-height: 1.5; }
        .task-error-label { font-weight: 600; color: #ef4444; margin-bottom: 0.25rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .task-error-text { white-space: pre-wrap; word-break: break-word; }

        /* Task summary — coloured status counts */
        .task-summary { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0.5rem 1rem; background: #1e293b; border-bottom: 1px solid #334155; font-size: 0.8rem; align-items: center; }
        .task-summary-count { font-weight: 600; }
        .task-summary-count.total { color: #38bdf8; }
        .task-summary-count.completed { color: #22c55e; }
        .task-summary-count.running { color: #f59e0b; }
        .task-summary-count.failed { color: #ef4444; }
        .task-summary-count.pending { color: #94a3b8; }
        .task-summary-count.assigned { color: #38bdf8; }
        .task-summary-count.cancelled { color: #78716c; }
        .task-summary-sep { color: #334155; }

        /* Task status filter row */
        .task-filter-row { display: flex; flex-wrap: wrap; gap: 0.375rem; padding: 0.5rem 1rem; background: #0f172a; border-bottom: 1px solid #334155; align-items: center; }
        .task-filter-label { color: #64748b; font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 0.25rem; }
        .task-filter-btn { padding: 0.2rem 0.6rem; border-radius: 0.25rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; cursor: pointer; border: 1px solid transparent; background: transparent; color: #64748b; transition: all 0.15s; }
        .task-filter-btn:hover { color: #e2e8f0; }
        .task-filter-btn.active { border-color: currentColor; }
        .task-filter-btn.active[data-status="PENDING"] { background: #334155; color: #94a3b8; }
        .task-filter-btn.active[data-status="ASSIGNED"] { background: #1e3a5f; color: #38bdf8; }
        .task-filter-btn.active[data-status="RUNNING"] { background: #422006; color: #f59e0b; }
        .task-filter-btn.active[data-status="COMPLETED"] { background: #052e16; color: #22c55e; }
        .task-filter-btn.active[data-status="FAILED"] { background: #450a0a; color: #ef4444; }
        .task-filter-btn.active[data-status="CANCELLED"] { background: #1c1917; color: #78716c; }
        .task-filter-btn.inactive { opacity: 0.4; }

        /* Task preference filter (issue #281): a substring field that
           filters the list client-side and, once applied, makes the
           backend prioritise matching tasks. */
        .task-pref-row { display: flex; flex-wrap: wrap; gap: 0.375rem; padding: 0.5rem 1rem; background: #0f172a; border-bottom: 1px solid #334155; align-items: center; }
        .task-pref-input { flex: 1; min-width: 8rem; background: #1e293b; border: 1px solid #334155; border-radius: 0.375rem; color: #e2e8f0; padding: 0.3rem 0.5rem; font-size: 0.8rem; }
        .task-pref-input:focus { outline: none; border-color: #38bdf8; }
        /* .btn:hover carries a pseudo-class and so outranks a lone class —
           and the cursor is on this button precisely when the operator
           checks whether the backend is set. Repeating the hover selector
           keeps the mark visible under the cursor. */
        .task-pref-applied, .task-pref-applied:hover { background: #1e3a5f; color: #38bdf8; }

        /* Pending-expand button — shown below task list when pending tasks are hidden */
        .pending-expand-btn { display: block; width: 100%; margin-top: 0.5rem; padding: 0.6rem 1rem;
            background: #1e293b; border: 1px dashed #334155; border-radius: 0.375rem;
            color: #94a3b8; cursor: pointer; font-size: 0.85rem; text-align: center;
            transition: background 0.15s, border-color 0.15s; }
        .pending-expand-btn:hover { background: #334155; border-color: #475569; color: #e2e8f0; }

        /* Block counter — increasing number shown on thinking/output blocks */
        .block-counter { color: #475569; font-size: 0.65rem; font-family: 'SF Mono', 'Fira Code', monospace; margin-left: 0.5rem; }

        /* Block timestamp — local HH:MM next to chevron */
        .block-timestamp { color: #475569; font-size: 0.65rem; font-family: 'SF Mono', 'Fira Code', monospace; margin-right: 0.25rem; }

        /* Full-screen task logs (issue #205) exist only where the layout is
           stacked, so both the toggle and the rules it drives live inside the
           narrow-viewport media query below. */
        .task-detail-fullscreen-btn { display: none; }

        /* The sidebar drawer (issue #234) is a narrow-viewport affordance for
           the same reason: on a big screen the sidebar is always shown, so the
           button would have nothing to do. Hidden by default, revealed below. */
        .sidebar-toggle { display: none; }

        /* Mobile-friendly layout (issue #203) — big screens are untouched; */
        /* everything below only applies at narrow viewports.           */
        @media (max-width: 768px) {
            body { display: flex; flex-direction: column; }
            .header { flex-wrap: wrap; gap: 0.5rem 1rem; padding: 0.75rem 1rem; }
            .header h1 { font-size: 1.15rem; }
            .stats { gap: 1rem; }
            .stat-value { font-size: 1.15rem; }
            .container { height: auto; flex: 1; min-height: 0; flex-direction: column; }
            /* The sidebar panels are the least interesting part of the UI, so
               on a phone they are collapsed behind the toggle in the top bar
               (issue #234): by default the top bar and the task area get the
               screen, and the sidebar drops in below the header on demand.
               The markup is unchanged, so nothing is lost — the drawer holds
               the same panels the desktop layout shows side by side. The open
               state lives on <body> (see setSidebarOpen) so a re-render cannot
               lose it, and this rule stays before the logs-fullscreen rules
               below so full screen keeps hiding the sidebar. */
            .sidebar-toggle { display: inline-block; margin-left: auto; }
            .sidebar { display: none; width: 100%; max-height: 45vh; border-right: none; border-bottom: 1px solid #334155; }
            body.sidebar-open .sidebar { display: block; }
            .main { padding: 0.75rem; }
            .tab { padding: 0.5rem 0.75rem; }
            /* Keep long task IDs/meta from forcing a min-width wider than the screen */
            .task-id, .task-meta { word-break: break-word; }
            /* Action buttons move below the task text instead of overlapping it */
            .task-btn-row { position: static; justify-content: flex-end; margin-top: 0.5rem; }
            .task-detail-header { flex-wrap: wrap; gap: 0.25rem 1rem; }
            /* Corner button that expands an open task's logs to the whole screen
               (issue #205) — revealed only where the layout is stacked. */
            .task-detail-fullscreen-btn { display: inline-block; }
            /* Full-screen task logs (issue #205) — the open task's log stream
               takes the whole viewport: the header stats, the sidebar and the tab
               bar are hidden so only the log view is left on screen. The toggle
               lives in the corner of the task detail header (see
               .task-detail-fullscreen-btn), so one control expands and collapses.
               Scoping these rules to the same media query that reveals the toggle
               keeps the mode and its exit in one place: if the viewport crosses
               the breakpoint while full screen is active (a phone rotated to
               landscape), the layout self-heals instead of stranding the user
               with no visible way out. The 100vh fallback is for browsers without
               the dynamic viewport unit; dvh tracks the mobile URL bar as it
               shows/hides.
               https://developer.mozilla.org/en-US/docs/Web/CSS/length#viewport_percentage_units */
            body.logs-fullscreen .header,
            body.logs-fullscreen .sidebar,
            body.logs-fullscreen .tab-bar { display: none; }
            body.logs-fullscreen .container { height: 100vh; height: 100dvh; }
            .task-detail-prompt-header .prompt-preview { max-width: 100%; }
            .spawn-block-header .spawn-preview { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏨 Hotelier</h1>
        <div class="stats">
            <div class="stat">
                <div class="stat-value" id="guest-count">0</div>
                <div class="stat-label">Guests</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="task-count">0</div>
                <div class="stat-label">Tasks</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="idle-count">0</div>
                <div class="stat-label">Idle</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="running-count">0</div>
                <div class="stat-label">Running</div>
            </div>
            <!-- The live concurrency cap and what is held behind it (issue #250),
                 with the cap settable in place: the field posts a runtime
                 override that the schedule takes back at the next boundary
                 (issue #264). -->
            <div class="stat">
                <div class="stat-value concurrency-edit">
                    <input type="text" id="concurrency-cap-input" class="concurrency-input"
                           aria-label="Live concurrency cap: a whole number, or unlimited"
                           title="Live concurrency cap — a number (0 pauses new work), or 'unlimited'. The next scheduled change still applies.">
                    <button class="btn btn-sm" onclick="updateConcurrencyCap()">Set</button>
                </div>
                <div class="stat-label" id="concurrency-label">Concurrency</div>
            </div>
        </div>
        <!-- Draw-down control for the sidebar panels (issue #234). Shown only
             at narrow viewports, where the sidebar is collapsed by default. -->
        <button class="btn btn-sm btn-ghost sidebar-toggle" onclick="toggleSidebar()" aria-expanded="false" aria-controls="sidebar" title="Show the guests list and the submit form">&#x2630; Panels</button>
    </div>

    <div class="container">
        <div class="sidebar" id="sidebar">
            <div class="panel">
                <h3>🤖 Guests</h3>
                <div id="guest-list"></div>
            </div>
            <div class="panel">
                <h3>📋 Submit Task</h3>
                <div class="submit-form">
                    <div class="form-group">
                        <label>Prompt</label>
                        <textarea id="task-prompt" placeholder="Describe the task..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Tags (comma-separated, optional)</label>
                        <input type="text" id="task-tags" placeholder="business-default, android">
                    </div>
                    <div class="form-group">
                        <label>Repository (optional)</label>
                        <input type="text" id="task-repo-ref" placeholder="https://github.com/user/repo.git">
                    </div>
                    <div class="form-group">
                        <label>Priority</label>
                        <div style="display:flex;gap:0.5rem;">
                            <label style="display:flex;align-items:center;gap:0.25rem;cursor:pointer;font-size:0.85rem;color:#e2e8f0;">
                                <input type="radio" name="task-priority" value="firefighter">🧑‍🚒 Firefighter
                            </label>
                            <label style="display:flex;align-items:center;gap:0.25rem;cursor:pointer;font-size:0.85rem;color:#e2e8f0;">
                                <input type="radio" name="task-priority" value="teacher">🧑‍🏫 Teacher
                            </label>
                            <label style="display:flex;align-items:center;gap:0.25rem;cursor:pointer;font-size:0.85rem;color:#e2e8f0;">
                                <input type="radio" name="task-priority" value="orangutan" checked>🦧 Orangutan
                            </label>
                        </div>
                    </div>
                    <button class="btn" onclick="submitTask()">Submit Task</button>
                </div>
            </div>
        </div>

        <div class="main">
            <div class="tab-bar">
                <div class="tab active" onclick="showTab('tasks')">Tasks</div>
                <div class="tab" onclick="showTab('logs')">Logs</div>
                <div class="tab" onclick="showTab('search')">Search</div>
            </div>
            <div id="tab-tasks" style="display:flex;flex-direction:column;flex:1;overflow-y:auto;min-height:0;">
                <div id="task-summary" class="task-summary"></div>
                <div id="task-filter-row" class="task-filter-row"></div>
                <div class="task-pref-row">
                    <span class="task-filter-label">Preference:</span>
                    <input type="text" id="task-pref-filter" class="task-pref-input" placeholder="substring of repo, title, prompt, persona or tags" oninput="onPrefFilterInput(this.value)">
                    <button id="task-pref-apply" class="btn btn-sm" onclick="applyPrefFilter()">&#127919; Prioritise</button>
                    <button class="btn btn-sm btn-ghost" onclick="clearPrefFilter()">&#10006; Clear</button>
                </div>
                <div id="task-list" style="flex:1;overflow-y:auto;min-height:0;"></div>
            </div>
            <div id="tab-logs" style="display:none;flex:1;overflow-y:auto;min-height:0;position:relative;">
                <div id="log-view" style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;">
                    <div class="empty-state"><span>📋</span>No logs configured</div>
                </div>
            </div>
            <!-- Task output search (issue #270): a thin client over
                 GET /api/tasks/search. No scanning logic lives here. -->
            <div id="tab-search" style="display:none;flex:1;overflow-y:auto;min-height:0;">
                <div class="search-form">
                    <div class="search-query-group">
                        <label for="search-query">Search task output</label>
                        <input type="text" id="search-query" placeholder="substring to look for…" onkeydown="if (event.key === 'Enter') runTaskSearch()">
                    </div>
                    <div class="search-days-group">
                        <label for="search-days">Lookback (days)</label>
                        <input type="number" id="search-days" value="5" onkeydown="if (event.key === 'Enter') runTaskSearch()">
                    </div>
                    <button class="btn" id="search-go" onclick="runTaskSearch()">Search</button>
                </div>
                <div id="search-results"><div class="empty-state"><span>🔎</span>Enter a query to search task output</div></div>
            </div>
        </div>
    </div>

    <script>
        // =====================================================================
        // Lightweight router — keeps the browser URL in sync with UI state.
        // Uses history.pushState so the address bar reflects the current view
        // and page refreshes restore the correct state.
        // =====================================================================

        let refreshInterval;
        let ws;
        let activeTaskId = null;
        let taskLogs = {};  // Accumulates logs per task: { taskId: [entries] }
        // Overview-page hourglass state (issue #246), keyed by task ID. Each
        // entry remembers the log count seen at the previous update, the
        // current rotation angle, and whether the hourglass is spinning:
        // a changed count between two frontend updates means activity, so the
        // spinner turns smoothly; an unchanged count pauses it where it is.
        const listSpinners = new Map(); // taskId -> { lastLogCount, angle, spinning }
        let listSpinnerTimer = null;
        const LIST_SPINNER_TICK_MS = 50;
        const LIST_SPINNER_DEG_PER_TICK = 3; // 60 degrees per second at 20 ticks/s
        // The angle grows monotonically and is only folded back into [0, 360)
        // once it reaches this many degrees. CSS interpolates rotate() between
        // two numeric angles rather than by the shortest arc, so folding at
        // every revolution would animate 357deg -> 0deg backwards through 357
        // degrees (see the CSS Transforms spec on transform interpolation).
        // Folding rarely keeps that sweep invisible while bounding the value.
        const LIST_SPINNER_FOLD_DEG = 360000; // 1000 revolutions
        // Guest UID -> hostname, refreshed from /api/guests on every poll so
        // the task views can say which machine a task is running on (issue #238).
        const guestHosts = {};

        // Task status filter state.  Keys are status strings (e.g. "COMPLETED").
        // true = shown, false = hidden.  Defaults: COMPLETED hidden, all others shown.
        let taskFilter = {
            PENDING:   false,
            ASSIGNED:  true,
            RUNNING:   true,
            COMPLETED: false,
            FAILED:    true,
            CANCELLED: true,
        };

        // Task preference filter (issue #281). prefFilterText is the live
        // client-side substring filter, trimmed once as it enters state and
        // persisted to the address bar as #filter=<encoded>. The fragment is
        // the field's only persistence path. prefFilterApplied is the filter
        // the last Prioritise submitted, i.e. what the backend is acting on;
        // it lives in the page alone.
        let prefFilterText = '';
        let prefFilterApplied = '';

        const router = {
            // Push a new URL without reloading the page.
            // When routerReplaceMode is true (initial dispatch), uses
            // replaceState instead to avoid polluting the history stack.
            push(path) {
                // The #filter=... fragment is the preference field's only
                // persistence path (issue #281), and router pushes own the
                // path half of the URL — so the push re-appends the current
                // fragment and path and fragment survive each other.
                const url = path + prefFilterFragment();
                if (routerReplaceMode) {
                    history.replaceState({ path }, '', url);
                } else {
                    history.pushState({ path }, '', url);
                }
            },

            // Parse the current pathname into a structured route object.
            parse() {
                const parts = location.pathname.split('/').filter(Boolean);
                if (parts.length === 0 || (parts.length === 1 && parts[0] === 'tasks')) {
                    return { view: 'tasks' };
                }
                // /task/:id shows task detail in the Logs tab
                if (parts[0] === 'task' && parts[1]) {
                    return { view: 'taskDetail', taskId: parts[1] };
                }
                if (parts[0] === 'logs' && parts.length === 1) {
                    return { view: 'logs' };
                }
                if (parts[0] === 'logs' && parts[1]) {
                    return { view: 'logs', date: parts[1], taskID: parts[2] || null };
                }
                // /search[?q=&days=] is the task output search (issue #270).
                // The query lives in the query string so a search is
                // shareable and survives a reload, like every other view.
                if (parts[0] === 'search') {
                    const params = new URLSearchParams(location.search);
                    return { view: 'search', q: params.get('q') || '', days: params.get('days') || '' };
                }
                return { view: 'tasks' };
            },

            // Dispatch the parsed route to the appropriate UI view.
            // When fromInitialLoad is true, navigation functions should use
            // replaceState instead of pushState (set via the global flag below).
            async dispatch(fromInitialLoad) {
                const route = this.parse();
                switch (route.view) {
                case 'taskDetail':
                    selectTask(route.taskId, fromInitialLoad);
                    break;
                case 'logs':
                    showTab('logs', true, fromInitialLoad);
                    if (route.date) {
                        await loadLogTasks(route.date, fromInitialLoad);
                        if (route.taskID) {
                            await loadLogEntries(route.date, route.taskID, fromInitialLoad);
                        }
                    }
                    break;
                case 'search':
                    showTab('search', true, fromInitialLoad);
                    // A URL that carries a query replays the search; the URL
                    // already says what the search was, so runTaskSearch must
                    // not touch it again (that would double-push on popstate).
                    if (route.q) {
                        document.getElementById('search-query').value = route.q;
                        // The URL is the whole description of a replayed
                        // search, window included, so the field is set from it
                        // even when it carries no days — an empty field means
                        // "the server's default" everywhere else on this page.
                        // Keeping a stale value instead would send a window
                        // wider than the URL names and paint a header for it:
                        // the same pane/URL disagreement searchSeq exists to
                        // prevent, on the replay path rather than the
                        // concurrent one.
                        document.getElementById('search-days').value = route.days;
                        await runTaskSearch(true);
                    }
                    break;
                default:
                    showTab('tasks', true, fromInitialLoad);
                    break;
                }
            },
        };

        // Flag: when true, router.push() acts as replaceState instead.
        // Set during initial dispatch to avoid polluting the history stack.
        let routerReplaceMode = false;

        // Internal helper: activate a tab by name in the DOM.
        // When called from the router (skipUrl === true) we do not push a
        // second history entry.
        function activateTabByName(name) {
            document.querySelectorAll('.tab').forEach(t => {
                t.classList.toggle('active', t.textContent.trim() === name);
            });
        }

        // showTab switches the visible tab panel.
        //   tab              — 'tasks', 'logs' or 'search'
        //   skipUrl          — when true, do NOT call router.push (used by
        //                      router dispatch and popstate so we don't
        //                      double-push).
        //   fromInitialLoad  — when true, URL changes use replaceState
        //                      instead of pushState.
        function showTab(tab, skipUrl, fromInitialLoad) {
            // Full screen only exists for the task detail view (issue #205);
            // switching tabs must never leave the dashboard without a sidebar.
            setLogsFullscreen(false);
            if (!skipUrl) {
                if (tab === 'tasks') router.push('/tasks');
                // 'logs' — loadLogDates() pushes /logs, so skip here.
                // 'search' — runTaskSearch() pushes /search only once a search
                // actually runs, so an empty tab click keeps the history clean.
            }
            activateTabByName(tab === 'tasks' ? 'Tasks' : tab === 'search' ? 'Search' : 'Logs');
            showPanel(tab);
            if (tab === 'logs') {
                loadLogDates(fromInitialLoad);
            }
        }

        // showPanel makes exactly one tab panel visible. Every view that
        // changes which panel the user is looking at goes through here, and
        // the panels it toggles are read from the markup rather than listed
        // here, so a panel added to the page cannot be forgotten: a hand-
        // kept list would leave stale results on screen above the view it
        // switched to, which is the bug this helper replaced. A panel is any
        // element whose id is 'tab-<name>', the same naming the lookup above
        // used; an element with that prefix that is not a panel would have to
        // be renamed (or given a class to select on) to stay out of this loop.
        function showPanel(tab) {
            for (const panel of document.querySelectorAll('[id^="tab-"]')) {
                panel.style.display = panel.id === 'tab-' + tab ? 'block' : 'none';
            }
        }

        async function refresh(skipDetailPatch) {
            try {
                const [guestsRes, tasksRes] = await Promise.all([
                    fetch('/api/guests'),
                    fetch('/api/tasks')
                ]);
                const guests = await guestsRes.json();
                const tasks = await tasksRes.json();
                indexGuestHosts(guests.guests || []);
                updateGuestLatencyThresholds(guests);
                renderGuests(guests);
                renderTasks(tasks);
                updateStats(guests, tasks);

                // Patch the active task's header metadata (status badge,
                // log count) without rebuilding the body. The WebSocket
                // streams log entries incrementally via appendLogToDetail(),
                // so we must NOT call refreshTaskDetail() here — it would
                // nuke the .task-detail-body and lose open/closed state of
                // tool blocks and thinking blocks.
                //
                // When skipDetailPatch is true, the caller is about to do a
                // full refreshTaskDetail() anyway, so skip the redundant fetch.
                if (activeTaskId && !skipDetailPatch) {
                    patchTaskDetailMeta(activeTaskId);
                }
            } catch (e) {
                console.error('refresh failed:', e);
            }
        }

        function updateStats(guests, tasks) {
            document.getElementById('guest-count').textContent = guests.count || 0;
            document.getElementById('task-count').textContent = tasks.count || 0;
            document.getElementById('idle-count').textContent = (guests.guests || []).filter(a => a.state === 'IDLE').length;
            document.getElementById('running-count').textContent = (guests.guests || []).filter(a => a.state === 'RUNNING').length;
            renderConcurrency(guests.concurrency);
        }

        // renderConcurrency draws the concurrency picture (issue #250) into
        // the editable cap field and the label below it (issue #264): the
        // field carries the cap in force — the number an operator can
        // change — and the label carries what the cap is doing: in flight,
        // the next scheduled change, and any queue it is holding back.
        function renderConcurrency(c) {
            const input = document.getElementById('concurrency-cap-input');
            const label = document.getElementById('concurrency-label');
            if (!c || c.cap === undefined || c.cap === null) {
                if (document.activeElement !== input) input.value = '';
                label.textContent = 'Concurrency';
                return;
            }
            // The header polls while the user may be typing a new cap; only
            // refresh the field when it is not focused.
            if (document.activeElement !== input) input.value = c.cap;
            const bits = ['Concurrency', (c.in_flight || 0) + ' in flight'];
            if (c.next_change && c.next_change.at) {
                bits.push('next ' + c.next_change.at + ' → ' + c.next_change.cap);
            }
            if (c.waiting_on_cap > 0) {
                bits.push(c.waiting_on_cap + ' waiting on cap');
            }
            label.textContent = bits.join(' \u00b7 ');
        }

        // updateConcurrencyCap posts the cap field to /api/concurrency
        // (issue #264). The server honours the value until the next
        // scheduled boundary — the schedule's next shrink or expansion
        // still takes over on its own — and nothing about it persists to
        // disk; a config reload or restart returns authority to the file.
        async function updateConcurrencyCap() {
            const input = document.getElementById('concurrency-cap-input');
            const raw = input.value.trim();
            let cap;
            if (raw === '' || raw.toLowerCase() === 'unlimited') {
                cap = 'unlimited';
            } else if (/^\d+$/.test(raw)) {
                cap = parseInt(raw, 10);
            } else {
                alert('Concurrency cap must be a whole number (0 pauses new work) or "unlimited"');
                return;
            }
            try {
                const res = await fetch('/api/concurrency', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({cap: cap}),
                });
                if (!res.ok) {
                    const errText = await res.text().catch(() => '');
                    alert('Failed to set concurrency cap (HTTP ' + res.status + '): ' + errText.trim());
                    return;
                }
                renderConcurrency(await res.json());
            } catch (e) {
                alert('Failed to set concurrency cap: ' + e.message);
            }
        }

        // indexGuestHosts records the host each guest reported at registration
        // so task views can name the machine a task runs on (issue #238). A
        // guest that reports no host (an older guest binary) simply has no
        // entry, and guestLabel falls back to the bare UID.
        function indexGuestHosts(guests) {
            Object.keys(guestHosts).forEach(id => delete guestHosts[id]);
            (guests || []).forEach(g => {
                if (g && g.id && g.host) guestHosts[g.id] = g.host;
            });
        }

        // guestLabel renders a task's assignee as "uid @ host" once the host is
        // known, and as the bare UID otherwise (issue #238).
        function guestLabel(guestID) {
            if (!guestID) return 'Unassigned';
            const host = guestHosts[guestID];
            return host ? escapeHtml(guestID) + ' @ ' + escapeHtml(host) : escapeHtml(guestID);
        }

        // Check-in latency colour thresholds, in seconds (issue #240).
        // Refreshed from the server's live config on every /api/guests poll so
        // a config hot-reload is reflected without a page reload.
        //   warn (orange) — two heartbeat intervals: at least one heartbeat was
        //                   missed, which is unexpected.
        //   crit (red)    — half the silence timeout: halfway towards the guest
        //                   being declared stale. 0 (or a disabled timeout)
        //                   means no red tier.
        let latencyWarnSeconds = 60;
        let latencyCritSeconds = 0;

        function updateGuestLatencyThresholds(data) {
            const interval = data.heartbeat_interval > 0 ? data.heartbeat_interval : 30;
            latencyWarnSeconds = 2 * interval;
            latencyCritSeconds = data.silence_timeout > 0 ? data.silence_timeout / 2 : 0;
        }

        // latencyTier maps a heartbeat age in seconds to its colour class.
        // The critical tier is checked first so it wins when the thresholds
        // are configured close together.
        function latencyTier(seconds) {
            if (latencyCritSeconds > 0 && seconds >= latencyCritSeconds) return 'latency-crit';
            if (seconds >= latencyWarnSeconds) return 'latency-warn';
            return '';
        }

        function formatAge(seconds) {
            const s = Math.max(0, Math.round(seconds));
            if (s < 60) return s + 's';
            if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
            return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
        }

        function renderGuests(data) {
            const list = document.getElementById('guest-list');
            const guests = data.guests || [];
            if (guests.length === 0) {
                list.innerHTML = '<div style="padding:0.5rem;color:#64748b;font-size:0.875rem;">No guests connected</div>';
                return;
            }
            list.innerHTML = guests.map(a => {
                const statusClass = `status-${a.state.toLowerCase()}`;
                // Seconds since the last heartbeat, measured on the server to
                // avoid client/server clock skew. Absent from an older server,
                // in which case the row is simply not rendered (issue #240).
                const latency = typeof a.heartbeat_age_seconds === 'number'
                    ? `<div class="guest-latency ${latencyTier(a.heartbeat_age_seconds)}" title="Time since last heartbeat">&#9201; ${formatAge(a.heartbeat_age_seconds)} ago</div>`
                    : '';
                // The UID is always shown: it is what a task is assigned to, so
                // hiding it behind a display name leaves the two views
                // unrelatable (issue #238). When the guest has no name the
                // heading already is the UID, so do not repeat it.
                return `<div class="guest-item">
                    <div class="guest-name"><span class="guest-status ${statusClass}"></span>${a.name || a.id}</div>
                    ${a.name && a.name !== a.id ? `<div class="guest-uid" title="Guest UID">${escapeHtml(a.id)}</div>` : ''}
                    ${a.host ? `<div class="guest-host" title="Machine this guest runs on">&#128421; ${escapeHtml(a.host)}</div>` : ''}
                    ${latency}
                    <div class="guest-tags">${(a.tags || []).join(', ')}</div>
                </div>`;
            }).join('');
        }

        // renderTaskSummary computes per-status counts and renders a compact
        // summary bar: "total · completed · running · failed · pending · assigned · cancelled"
        function renderTaskSummary(tasks) {
            const summary = document.getElementById('task-summary');
            if (!summary) return;

            const counts = { PENDING: 0, ASSIGNED: 0, RUNNING: 0, COMPLETED: 0, FAILED: 0, CANCELLED: 0 };
            tasks.forEach(t => { if (counts[t.status] !== undefined) counts[t.status]++; });
            const total = tasks.length;

            const parts = [
                { count: total, cls: 'total', label: 'total' },
                { count: counts.COMPLETED, cls: 'completed', label: 'completed' },
                { count: counts.RUNNING, cls: 'running', label: 'running' },
                { count: counts.FAILED, cls: 'failed', label: 'failed' },
                { count: counts.PENDING, cls: 'pending', label: 'pending' },
                { count: counts.ASSIGNED, cls: 'assigned', label: 'assigned' },
                { count: counts.CANCELLED, cls: 'cancelled', label: 'cancelled' },
            ];

            summary.innerHTML = parts.map((p, i) =>
                (i > 0 ? '<span class="task-summary-sep">·</span>' : '') +
                `<span class="task-summary-count ${p.cls}">${p.count}</span> <span style="color:#64748b;font-size:0.7rem;">${p.label}</span>`
            ).join('');
        }

        // renderTaskFilter renders toggle buttons for each status.
        // Clicking a button toggles its visibility (active/inactive).
        function renderTaskFilter() {
            const row = document.getElementById('task-filter-row');
            if (!row) return;

            const statuses = ['PENDING', 'ASSIGNED', 'RUNNING', 'COMPLETED', 'FAILED', 'CANCELLED'];
            row.innerHTML = '<span class="task-filter-label">Filter:</span>' +
                statuses.map(s => {
                    const active = taskFilter[s];
                    const cls = active ? 'active' : 'inactive';
                    return `<button class="task-filter-btn ${cls}" data-status="${s}" onclick="toggleTaskFilter('${s}')">${s}</button>`;
                }).join('');
        }

        // toggleTaskFilter toggles the visibility of a given status and re-renders.
        function toggleTaskFilter(status) {
            taskFilter[status] = !taskFilter[status];
            // Re-render tasks with the current data (cached from last refresh)
            fetch('/api/tasks').then(r => r.json()).then(data => renderTasks(data));
        }

        // expandPendingTasks shows hidden PENDING tasks by toggling the filter.
        // Called from the "N pending" expand button rendered below the task list.
        function expandPendingTasks() {
            taskFilter.PENDING = true;
            fetch('/api/tasks').then(r => r.json()).then(data => renderTasks(data));
        }

        // =====================================================================
        // Task preference filter (issue #281)
        //
        // The text field filters the rendered list by case-insensitive
        // substring and is persisted to the address bar as a #filter=...
        // fragment. "Prioritise" sends it to the backend, where matching
        // pending tasks drain before the rest until none are left (then
        // normal queue semantics apply). "Clear" clears field, fragment and
        // backend.
        // =====================================================================

        // matchesPrefFilter reports whether a task survives the client-side
        // substring filter. The fields weighed are the ones the backend
        // weighs (queue.matchesPreference), each tested on its own for the
        // same reason: a needle straddling a field boundary must not filter
        // the list without prioritising the drain, or the reverse, so field
        // order cannot matter here either.
        function matchesPrefFilter(t) {
            if (!prefFilterText) return true;
            const needle = prefFilterText.toLowerCase();
            const fields = [t.title || '', t.prompt || '', t.repo_ref || '', t.persona || '', (t.tags || []).join(' ')];
            return fields.some(f => f.toLowerCase().includes(needle));
        }

        // readPrefFilterHash returns the #filter=... fragment, trimmed as
        // every other path into this value is, or '' when the address bar
        // carries none (or one that cannot be decoded).
        function readPrefFilterHash() {
            if (!location.hash.startsWith('#filter=')) return '';
            try {
                return decodeURIComponent(location.hash.slice('#filter='.length)).trim();
            } catch (e) {
                return '';
            }
        }

        // prefFilterFragment renders the field's persistence path: the
        // #filter=... fragment, or '' when the field is empty. The router
        // and the field share this one rendering so a push cannot strip the
        // fragment and an edit cannot strip the path.
        function prefFilterFragment() {
            return prefFilterText ? '#filter=' + encodeURIComponent(prefFilterText) : '';
        }

        // updatePrefFilterURL mirrors the field into the address bar without
        // adding a history entry per keystroke.
        function updatePrefFilterURL() {
            const frag = prefFilterFragment();
            if (location.hash !== frag) {
                history.replaceState(null, '', location.pathname + frag);
            }
        }

        // syncPrefFilterFromURL adopts the field value from the address bar
        // (initial load and hash navigation), the field's only persistence
        // path.
        function syncPrefFilterFromURL() {
            const v = readPrefFilterHash();
            if (v !== prefFilterText) {
                prefFilterText = v;
                const el = document.getElementById('task-pref-filter');
                if (el) el.value = v;
            }
            // Seeding from the fragment must also refresh the controls: the
            // applied mark is page state, so a page seeded this way (reload,
            // second tab) needs its button to say the applied state is
            // unknown rather than imply no filter is live.
            updatePrefFilterControls();
        }

        // updatePrefFilterControls marks the Prioritise button while the
        // backend is acting on a filter.
        function updatePrefFilterControls() {
            const btn = document.getElementById('task-pref-apply');
            if (!btn) return;
            btn.classList.toggle('task-pref-applied', prefFilterApplied !== '');
            if (prefFilterApplied !== '') {
                btn.title = 'Backend is prioritising tasks matching: ' + prefFilterApplied;
            } else if (prefFilterText !== '') {
                // The applied mark is page state and nothing reads it back,
                // so a page seeded from the fragment cannot tell whether the
                // backend is still acting on this filter. Say so — the one
                // log line naming the filter is the record.
                btn.title = 'Filter in the field; whether the backend is applying it is unknown on this page — check the server log, or press Prioritise';
            } else {
                btn.title = 'Send this filter to the backend so matching tasks are prioritised';
            }
        }

        // The trimmed string is the only form this value ever takes — on
        // the way in here, and on the way back out of the fragment in
        // readPrefFilterHash — so the list filter and the value handed to
        // the backend are one string: a stray space must not make the
        // dashboard hide the tasks the queue drains first.
        function onPrefFilterInput(value) {
            prefFilterText = value.trim();
            updatePrefFilterURL();
            fetch('/api/tasks').then(r => r.json()).then(data => renderTasks(data));
        }

        async function applyPrefFilter() {
            // An empty field means "no filter", so Prioritise takes the
            // route Clear takes rather than swallowing the click and leaving
            // the button describing a filter it no longer holds.
            if (!prefFilterText) {
                await clearPrefFilter();
                return;
            }
            try {
                const res = await fetch('/api/tasks/filter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filter: prefFilterText })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                prefFilterApplied = data.filter || '';
            } catch (e) {
                alert('Failed to set the preference filter: ' + e.message);
                return;
            }
            updatePrefFilterControls();
            refresh();
        }

        async function clearPrefFilter() {
            const el = document.getElementById('task-pref-filter');
            if (el) el.value = '';
            prefFilterText = '';
            updatePrefFilterURL();
            try {
                // Always post the clear, whether or not this page believes a
                // filter is live: the applied mark is page state, so a page
                // reloaded from a fragment would otherwise skip the one
                // request that stops the backend prioritising the old filter.
                const res = await fetch('/api/tasks/filter', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filter: '' })
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                prefFilterApplied = '';
            } catch (e) {
                alert('Failed to clear the preference filter: ' + e.message);
                return;
            }
            updatePrefFilterControls();
            refresh();
        }

        // Re-render when the fragment is edited in the address bar or reached
        // through history navigation.
        window.addEventListener('hashchange', () => {
            syncPrefFilterFromURL();
            fetch('/api/tasks').then(r => r.json()).then(data => renderTasks(data));
        });

        function renderTasks(data) {
            const list = document.getElementById('task-list');
            const tasks = data.tasks || [];
            // Snapshot log-count deltas before rendering so the spinners in
            // this frame reflect the latest activity (issue #246).
            updateListSpinners(tasks);

            // Render summary and filter row (always with full data)
            renderTaskSummary(tasks);
            renderTaskFilter();

            // Apply filter
            const filtered = tasks.filter(t => taskFilter[t.status] !== false).filter(t => matchesPrefFilter(t));

            if (filtered.length === 0) {
                if (tasks.length === 0) {
                    list.innerHTML = '<div style="padding:0.5rem;color:#64748b;font-size:0.875rem;">No tasks yet</div>';
                } else {
                    list.innerHTML = '<div style="padding:0.5rem;color:#64748b;font-size:0.875rem;">No tasks match the active filter</div>';
                }
                return;
            }
            let html = filtered.map(t => {
                const badgeClass = `badge-${t.status.toLowerCase()}`;
                const itemClass = t.status.toLowerCase();
                const isActive = t.id === activeTaskId ? ' active' : '';
                let errorHtml = '';
                if (t.status === 'FAILED' && t.error) {
                    const errorText = t.error.length > 120 ? t.error.substring(0, 120) + '...' : t.error;
                    errorHtml = `<div class="task-prompt" style="color:#fca5a5;">⚠ ${escapeHtml(errorText)}</div>`;
                }
                const isCancellable = t.status !== 'COMPLETED' && t.status !== 'FAILED' && t.status !== 'CANCELLED';
                const cancelBtn = isCancellable ? `<button class="btn btn-sm btn-danger" onclick="event.stopPropagation(); cancelTask('${t.id}')">✖</button>` : '';
                const isRerunnable = t.status === 'FAILED' || t.status === 'CANCELLED';
                const rerunBtn = isRerunnable ? `<button class="btn btn-sm btn-ghost" onclick="event.stopPropagation(); rerunTask('${t.id}')">🔄</button>` : '';
                const btnRow = (rerunBtn || cancelBtn) ? `<div class="task-btn-row">${rerunBtn}${cancelBtn}</div>` : '';
                const logCount = t.log_count != null ? ` · ${t.log_count} log${t.log_count === 1 ? '' : 's'}${listSpinnerHTML(t)}` : '';
                // Priority label shown only for PENDING tasks, with the
                // bump controls alongside it (issue #266).
                const priorityLabel = t.status === 'PENDING' && t.priority ? `<span class="badge badge-priority" title="Priority">🔜${priorityToEmoji(t.priority)}</span>${priorityBumpButtonsHTML(t.id, t.priority, true)}` : '';
                const personaBadge = t.persona ? ` <span class="persona-badge ${personaColourClass(t.persona)}" title="Persona: ${escapeHtml(t.persona)}">🧑 ${escapeHtml(t.persona)}</span>` : '';
                return `<div class="task-item ${itemClass}${isActive}" onclick="selectTask('${t.id}')">
                    <div class="task-id">${taskTitleHTML(t)}${t.id} <span class="badge ${badgeClass}">${t.status}</span>${priorityLabel}${personaBadge}</div>
                    <div class="task-meta">${t.assigned_to ? '→ ' + guestLabel(t.assigned_to) : 'unassigned'} · ${new Date(t.created_at).toLocaleString()}${logCount}</div>
                    <div class="task-prompt">${escapeHtml(t.prompt.substring(0, 120))}${t.prompt.length > 120 ? '...' : ''}</div>
                    ${errorHtml}
                    ${btnRow}
                </div>`;
            }).join('');

            // Append "N pending" expand button when pending tasks are hidden
            const pendingCount = tasks.filter(t => t.status === 'PENDING').length;
            if (pendingCount > 0 && !taskFilter.PENDING) {
                html += `<button class="pending-expand-btn" onclick="expandPendingTasks()">▶ ${pendingCount} pending</button>`;
            }

            list.innerHTML = html;
        }

        function currentToolId(block) {
            return block ? block.toolId : '';
        }

        // renderCommandLineHeader returns the HTML fragment that replaces the
        // old tool-ID span.  For "bash" tools it renders a Prism.js-highlighted
        // command line; for all other tools it shows the raw args plainly.
        function renderCommandLineHeader(toolName, args) {
            if (!args || args.trim() === '') return '';
            if (toolName === 'bash') {
                // tool_args is JSON-encoded: {"command":"hostname"}
                // Extract the actual command string for display.
                try {
                    const parsed = JSON.parse(args);
                    if (parsed.command) {
                        args = parsed.command;
                    }
                } catch (_) {
