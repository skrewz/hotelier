                const chevron = lastBlock.querySelector('.spawn-chevron');
                if (bodyEl) bodyEl.classList.add('open');
                if (chevron) chevron.classList.add('open');
            } else {
                // Create a new spawn block, open while streaming
                const blockId = nextSpawnBlockId();
                const msgEl = document.createElement('div');
                msgEl.className = 'spawn-block';
                msgEl.id = 'spawn-' + blockId;
                const preview = getFirstLine(line);
                const ts = formatTimestamp(timestamp);
                const counter = entryCount != null ? `<span class="block-counter">${entryCount}</span>` : '';
                msgEl.innerHTML = `
                    <div class="spawn-block-header" onclick="toggleSpawnBlock('${blockId}')">
                        <div>
                            <span class="spawn-icon">🔍</span>
                            <span class="spawn-label">Spawn output</span>
                            ${preview ? `<span class="spawn-preview">${escapeHtml(preview)}</span>` : ''}
                            ${counter}
                        </div>
                        <div style="display:flex;align-items:center;gap:0.25rem;">
                            <span class="block-timestamp">${ts}</span>
                            <span class="spawn-chevron open">▶</span>
                        </div>
                    </div>
                    <div class="spawn-block-body open" id="spawn-body-${blockId}">
                        <div class="spawn-content">${escapeHtml(line)}</div>
                    </div>
                `;
                body.appendChild(msgEl);
            }
            scrollToBottomIfNeeded(body, wasAtBottom);
        }

        // _closeLastSpawnBlock closes the last spawn block (collapses it)
        // if one exists. Used when a non-spawn entry arrives.
        function _closeLastSpawnBlock(body) {
            const blocks = body.querySelectorAll('.spawn-block');
            const lastBlock = blocks.length > 0 ? blocks[blocks.length - 1] : null;
            if (lastBlock) {
                const bodyEl = lastBlock.querySelector('.spawn-block-body');
                const chevron = lastBlock.querySelector('.spawn-chevron');
                if (bodyEl) bodyEl.classList.remove('open');
                if (chevron) chevron.classList.remove('open');
            }
        }

        // _appendCompactionToDetail handles a compaction start/end entry in the
        // streaming path (issue #53). A start creates a running block; an end
        // completes the most recent open block (or creates a standalone one).
        function _appendCompactionToDetail(body, logEntry, wasAtBottom) {
            _closeLastThinkingBlock(body);
            _closeLastSpawnBlock(body);

            if (logEntry.compaction_type === 'start') {
                const frag = document.createElement('div');
                frag.innerHTML = buildCompactionBlockHTML(
                    logEntry.compaction_reason || '', 'running', 0, 0, '', '',
                    logEntry.timestamp, 1
                );
                const block = frag.firstElementChild;
                block.setAttribute('data-compaction-open', '1');
                body.appendChild(block);
                scrollToBottomIfNeeded(body, wasAtBottom);
                return;
            }

            // compaction_type === 'end'
            const blocks = body.querySelectorAll('.compaction-block');
            let target = null;
            for (let i = blocks.length - 1; i >= 0; i--) {
                if (blocks[i].getAttribute('data-compaction-open') === '1') {
                    target = blocks[i];
                    break;
                }
            }
            if (!target && blocks.length > 0) target = blocks[blocks.length - 1];

            const status = logEntry.compaction_error ? 'error' : 'done';
            const statusClass = status === 'error' ? 'error' : 'done';
            const statusLabel = status === 'error' ? 'failed' : 'completed';
            const tokensBefore = logEntry.compaction_tokens_before || 0;
            const tokensAfter = logEntry.compaction_tokens_after || 0;
            const tokensHtml = (tokensBefore > 0 || tokensAfter > 0)
                ? `<span class="compaction-tokens">${tokensBefore} → ${tokensAfter} tokens</span>` : '';
            const reason = logEntry.compaction_reason || '';
            const ts = formatTimestamp(logEntry.timestamp);
            const errorText = logEntry.compaction_error ? compactionErrorFromLine(logEntry.line) : '';

            if (!target) {
                // End without a start — standalone block.
                const frag = document.createElement('div');
                frag.innerHTML = buildCompactionBlockHTML(
                    reason, status, tokensBefore, tokensAfter,
                    logEntry.compaction_summary || '', errorText, logEntry.timestamp, 1
                );
                body.appendChild(frag.firstElementChild);
                scrollToBottomIfNeeded(body, wasAtBottom);
                return;
            }

            // Complete the existing block: rebuild header, fill body, open it.
            target.removeAttribute('data-compaction-open');
            const counterEl = target.querySelector('.block-counter');
            const entryCount = counterEl ? parseInt(counterEl.textContent, 10) + 1 : 2;
            const header = target.querySelector('.compaction-block-header');
            header.innerHTML = `
                <div>
                    <span class="compaction-icon">🗜️</span>
                    <span class="compaction-label">Compaction</span>
                    ${reason ? `<span class="compaction-reason">${escapeHtml(reason)}</span>` : ''}
                    ${tokensHtml}
                    <span class="block-counter">${entryCount}</span>
                </div>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                    <span class="compaction-status ${statusClass}">${statusLabel}</span>
                    <span class="block-timestamp">${ts}</span>
                    <span class="compaction-chevron open">▶</span>
                </div>
            `;
            const bodyEl = target.querySelector('.compaction-block-body');
            if (logEntry.compaction_error) {
                bodyEl.innerHTML = `<div class="compaction-error-text">${escapeHtml(errorText)}</div>`;
            } else if (logEntry.compaction_summary) {
                bodyEl.innerHTML = `<div class="compaction-summary"><div class="output-label">Summary</div><pre>${escapeHtml(logEntry.compaction_summary)}</pre></div>`;
            }
            bodyEl.classList.add('open');
            scrollToBottomIfNeeded(body, wasAtBottom);
        }

        // _appendTextToDetail appends a text delta to the last text message div.
        // If no text message div exists, creates a new one.
        function _appendTextToDetail(body, line, wasAtBottom) {
            const guestMsgs = body.querySelectorAll('.log-msg.guest');
            const lastMsg = guestMsgs.length > 0 ? guestMsgs[guestMsgs.length - 1] : null;
            if (lastMsg) {
                // Append to existing message's md-rendered div
                const mdEl = lastMsg.querySelector('.md-rendered');
                if (mdEl) {
                    mdEl.innerHTML = renderMarkdown(mdEl.textContent + line);
                }
            } else {
                // Create a new text message div
                const msgEl = document.createElement('div');
                msgEl.className = 'log-msg guest';
                const inner = document.createElement('div');
                inner.className = 'md-rendered';
                inner.innerHTML = renderMarkdown(line);
                msgEl.appendChild(inner);
                body.appendChild(msgEl);
            }
            scrollToBottomIfNeeded(body, wasAtBottom);
        }

        function appendLogToDetail(logEntry) {
            const view = document.getElementById('log-view');
            const body = view.querySelector('.task-detail-body');
            if (!body) return;

            // Capture scroll position BEFORE any DOM mutation.
            // After appending, scrollHeight increases and the "at bottom"
            // check would incorrectly return false even if the user was
            // at the bottom before the new content arrived.
            const wasAtBottom = isScrolledToBottom(body);

            const level = logEntry.level || '';
            const line = logEntry.line;

            // Use structured fields to determine event type.
            if (level === 'tool' && logEntry.tool_type) {
                if (logEntry.tool_type === 'start') {
                    // Close any open thinking block before tool starts
                    _closeLastThinkingBlock(body);
                    const frag = renderToolBlockStart({
                        toolName: logEntry.tool_name, toolId: logEntry.tool_id,
                        args: logEntry.tool_args, argsJSON: logEntry.tool_args_json,
                        output: '', status: 'running', hasOutput: false
                    }, '', '');
                    body.appendChild(frag);
                    scrollToBottomIfNeeded(body, wasAtBottom);
                    _lastAppendedLevel = 'tool';
                    return;
                }

                if (logEntry.tool_type === 'output') {
                    const block = body.querySelector(`#tool-${logEntry.tool_id}`);
                    if (block) {
                        const outputDiv = block.querySelector('.tool-output');
                        if (outputDiv) {
                            const pre = outputDiv.querySelector('pre');
                            if (pre) {
                                pre.textContent += logEntry.tool_output;
                            } else {
                                outputDiv.innerHTML = '<pre>' + escapeHtml(logEntry.tool_output) + '</pre>';
                            }
                        }
                        // Update counter
                        const counterEl = block.querySelector('.block-counter');
                        if (counterEl) {
                            counterEl.textContent = parseInt(counterEl.textContent, 10) + 1;
                        }
                        // Update timestamp
                        const tsEl = block.querySelector('.block-timestamp');
                        if (tsEl) {
                            tsEl.textContent = formatTimestamp(logEntry.timestamp);
                        }
                    }
                    scrollToBottomIfNeeded(body, wasAtBottom);
                    return;
                }

                if (logEntry.tool_type === 'end') {
                    const block = body.querySelector(`#tool-${logEntry.tool_id}`);
                    if (block) {
                        const statusClass = logEntry.tool_error ? 'error' : 'success';
                        const statusLabel = logEntry.tool_error ? 'error' : 'done';
                        // Reconstruct args from the existing tool-args div
                        const argsEl = block.querySelector('.tool-args');
                        const args = argsEl ? argsEl.textContent : '';
                        const cmdLine = renderCommandLineHeader(logEntry.tool_name, args);
                        // Update counter
                        const counterEl = block.querySelector('.block-counter');
                        let entryCount = counterEl ? parseInt(counterEl.textContent, 10) + 1 : 1;
                        const counterHtml = `<span class="block-counter">${entryCount}</span>`;
                        // Update timestamp
                        const ts = formatTimestamp(logEntry.timestamp);
                        const header = block.querySelector('.tool-block-header');
                        header.innerHTML = `
                            <div>
                                <span class="tool-icon">🔧</span>
                                <span class="tool-name">${escapeHtml(logEntry.tool_name)}</span>
                                ${cmdLine}
                                ${counterHtml}
                            </div>
                            <div style="display:flex;align-items:center;gap:0.5rem;">
                                <span class="tool-status ${statusClass}">${statusLabel}</span>
                                <span class="block-timestamp">${ts}</span>
                                <span class="tool-chevron">▶</span>
                            </div>
                        `;
                        highlightCommandLines(block);
                        const bodyEl = block.querySelector('.tool-block-body');
                        let outputDiv = bodyEl.querySelector('.tool-output');
                        if (!outputDiv) {
                            bodyEl.innerHTML = '<div class="tool-output"><div class="output-label">Output</div></div>';
                            outputDiv = bodyEl.querySelector('.tool-output');
                        }
                        if (logEntry.tool_output) {
                            const pre = outputDiv.querySelector('pre');
                            if (pre) {
                                pre.textContent += logEntry.tool_output;
                            } else {
                                outputDiv.innerHTML = '<pre>' + escapeHtml(logEntry.tool_output) + '</pre>';
                            }
                        }
                        // Auto-open the block when completed
                        bodyEl.classList.add('open');
                        const chevron = header.querySelector('.tool-chevron');
                        if (chevron) chevron.classList.add('open');
                    }
                    scrollToBottomIfNeeded(body, wasAtBottom);
                    _lastAppendedLevel = 'tool';
                    return;
                }
            }

            // Non-tool log lines: render based on level
            if (level === 'compaction' && logEntry.compaction_type) {
                // Context compaction events — pair start/end into a block (issue #53)
                _appendCompactionToDetail(body, logEntry, wasAtBottom);
                _lastAppendedLevel = 'compaction';
            } else if (level === 'thinking') {
                // Append to the last thinking block (streaming), or create a new
                // one that starts open so the user can see content arriving.
                // Track cumulative count for this thinking block.
                const existingBlocks = body.querySelectorAll('.thinking-block');
                let thinkingEntryCount = 1;
                if (existingBlocks.length > 0) {
                    const lastCounter = existingBlocks[existingBlocks.length - 1].querySelector('.block-counter');
                    if (lastCounter) thinkingEntryCount = parseInt(lastCounter.textContent, 10) + 1;
                }
                _appendThinkingToDetail(body, line, wasAtBottom, logEntry.timestamp, thinkingEntryCount);
                _closeLastSpawnBlock(body);
                _lastAppendedLevel = 'thinking';
            } else if (level === 'system' && line.startsWith('[spawn]')) {
                // Spawn output — append to last spawn block or create new one
                // (Issue #45). Keep block open while content is arriving.
                _closeLastThinkingBlock(body);
                const existingSpawnBlocks = body.querySelectorAll('.spawn-block');
                let spawnEntryCount = 1;
                if (existingSpawnBlocks.length > 0) {
                    const lastCounter = existingSpawnBlocks[existingSpawnBlocks.length - 1].querySelector('.block-counter');
                    if (lastCounter) spawnEntryCount = parseInt(lastCounter.textContent, 10) + 1;
                }
                _appendSpawnToDetail(body, line + '\n', wasAtBottom, logEntry.timestamp, spawnEntryCount);
                _lastAppendedLevel = 'spawn';
            } else {
                // Non-thinking, non-spawn entry: close any open blocks,
                // then append the new entry.
                _closeLastThinkingBlock(body);
                _closeLastSpawnBlock(body);

                if (level === 'system') {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'log-msg system';
                    msgEl.textContent = line;
                    body.appendChild(msgEl);
                } else if (level === 'error') {
                    const msgEl = document.createElement('div');
                    msgEl.className = 'log-msg error';
                    msgEl.textContent = line;
                    body.appendChild(msgEl);
                } else {
                    // Text/info: append to the last text message div.
                    _appendTextToDetail(body, line, wasAtBottom);
                }
                _lastAppendedLevel = level;
            }
            scrollToBottomIfNeeded(body, wasAtBottom);

            // Update log count in header, and with it the hourglass spinner's
            // rotation (issue #210): the angle is the count modulo 360, so
            // the ⏳ advances on every streamed entry. Update the existing
            // spans in place — replacing meta.innerHTML would recreate the
            // spinner span and lose the CSS rotation transition.
            const meta = view.querySelector('.task-detail-meta');
            if (meta) {
                const count = taskLogs[logEntry.task_id]?.length || 0;
                const countEl = meta.querySelector('.meta-log-count');
                if (countEl) {
                    countEl.textContent = `${count} log entries`;
                    const spinner = meta.querySelector('.task-spinner');
                    if (spinner) spinner.style.transform = `rotate(${count % 360}deg)`;
                }
            }
        }

        // =====================================================================
        // Task output search (issue #270)
        // =====================================================================
        // A thin client over GET /api/tasks/search (issue #269). The page
        // supplies a query and the window the user asked for; the server owns
        // every rule about that window — the 5-day default, the 14-day cap,
        // the 400 it answers when the cap is exceeded — and this code repeats
        // none of them. In particular the lookback field is sent verbatim:
        // clamping it here would quietly search less than the user asked for
        // while telling them it searched the whole window, which is the one
        // outcome issue #269 ruled out.

        // searchSeq hands every search a number so that only the newest one
        // may paint the results. A search is the one request on this page that
        // can take seconds — the server walks up to 14 days of traces — so two
        // can genuinely be in flight (Enter twice, or a slow one followed by a
        // fast one), and whichever resolved last would otherwise win the
        // results pane and contradict the URL and its own header.
        let searchSeq = 0;

        // runTaskSearch issues one search. fromRouter is true when the call
        // came from router.dispatch, where the URL already describes this
        // search and must be left alone.
        async function runTaskSearch(fromRouter) {
            const seq = ++searchSeq;
            const query = document.getElementById('search-query').value.trim();
            const days = document.getElementById('search-days').value.trim();
            const params = new URLSearchParams();
            if (query) params.set('q', query);
            if (days) params.set('days', days);
            if (!fromRouter) router.push('/search' + (params.toString() ? '?' + params.toString() : ''));
            const results = document.getElementById('search-results');

            // An empty query would make the server match every line in the
            // window, so do not send it.
            if (!query) {
                results.innerHTML = '<div class="search-note">Enter a query to search task output.</div>';
                return;
            }

            results.innerHTML = '<div class="empty-state"><span>🔎</span>Searching…</div>';
            let res;
            try {
                res = await fetch('/api/tasks/search?' + params.toString());
            } catch (e) {
                if (seq !== searchSeq) return; // a newer search owns the pane now
                results.innerHTML = '<div class="search-note error">Search failed: ' + escapeHtml(e.message) + '</div>';
                return;
            }
            if (seq !== searchSeq) return; // superseded while the request was out
            if (!res.ok) {
                // The server rejects bad or over-wide windows with a plain-text
                // reason; that reason is the message for the user, so show it
                // rather than second-guessing the request client-side.
                let reason = '';
                try { reason = (await res.text()).trim(); } catch (e) { reason = ''; }
                results.innerHTML = '<div class="search-note error">Search rejected (' + res.status + '): '
                    + escapeHtml(reason || res.statusText) + '</div>';
                return;
            }
            let data;
            try {
                data = await res.json();
            } catch (e) {
                if (seq !== searchSeq) return;
                results.innerHTML = '<div class="search-note error">Search returned an unreadable response.</div>';
                return;
            }
            if (seq !== searchSeq) return;
            renderSearchResults(data);
        }

        function renderSearchResults(data) {
            const matches = data.matches || [];
            let html = '<div class="search-note">' + matches.length + ' match(es) between '
                + escapeHtml(data.from || '') + ' and ' + escapeHtml(data.to || '')
                + ' for “' + escapeHtml(data.query || '') + '”</div>';
            // Both completeness flags come straight off the response; neither
            // is the page's judgement.
            if (data.truncated) {
                html += '<div class="search-note">The scan stopped at the server’s cap — newer matches in the window are not listed.</div>';
            }
            if (data.partial) {
                html += '<div class="search-note">Part of the window could not be read; the reason is in the server log.</div>';
            }
            if (matches.length === 0) {
                html += '<div class="empty-state"><span>🔎</span>No matches in that window</div>';
            } else {
                html += '<div id="search-matches">'
                    + matches.map(m => searchMatchHTML(m, data.query || '')).join('')
                    + '</div>';
            }
            document.getElementById('search-results').innerHTML = html;
        }

        // searchMatchHTML renders one hit: which task, when, and the line with
        // its neighbours. The row is the link — it opens the existing log view
        // for exactly that task and date, where the whole trace (and its
        // download) already lives.
        function searchMatchHTML(m, query) {
            const label = m.title ? getFirstLine(m.title, 80) : m.task_id;
            const status = m.status ? '<span class="search-match-status">' + escapeHtml(m.status) + '</span>' : '';
            const when = m.timestamp ? formatTimestamp(m.timestamp) : '';
            const lines = (m.context_before || []).map(l => searchLineHTML(l, query, true))
                .concat([searchLineHTML(m.line, query, false)])
                .concat((m.context_after || []).map(l => searchLineHTML(l, query, true)));
            return `
                <div class="search-match" data-date="${escapeAttr(m.date)}" data-task-id="${escapeAttr(m.task_id)}" onclick="openSearchHit(this.dataset.date, this.dataset.taskId)">
                    <div class="search-match-head">
                        <span class="search-match-task">🔖 ${escapeHtml(label)}${status}</span>
                        <span class="search-match-date">${escapeHtml(m.date || '')}${when ? ' ' + escapeHtml(when) : ''}</span>
                    </div>
                    <div class="search-match-lines">${lines.join('')}</div>
                </div>`;
        }

        function searchLineHTML(line, query, isContext) {
            return `<div class="search-match-line${isContext ? ' context' : ''}">${highlightMatch(line || '', query)}</div>`;
        }

        // highlightMatch escapes the line into HTML and wraps each occurrence
        // of the query in <mark>. It slices the *raw* text and escapes each
        // fragment, so neither the log text nor the query can inject markup;
        // a plain string scan also sidesteps any regex metacharacters the
        // query happens to contain.
        function highlightMatch(line, query) {
            if (!query) return escapeHtml(line);
            const haystack = line.toLowerCase();
            const needle = query.toLowerCase();
            let out = '';
            let i = 0;
            for (;;) {
                const at = haystack.indexOf(needle, i);
                if (at === -1) { out += escapeHtml(line.slice(i)); break; }
                out += escapeHtml(line.slice(i, at))
                    + '<mark>' + escapeHtml(line.slice(at, at + needle.length)) + '</mark>';
                i = at + needle.length;
            }
            return out;
        }

        // openSearchHit leaves the search panel for the log browser's entry
        // view of the matched trace. Like selectTask it shows the Logs panel
        // without loadLogDates() — the latter would render the date list in
        // the same pane and race the entries for innerHTML.
        function openSearchHit(date, taskID) {
            setLogsFullscreen(false);
            activateTabByName('Logs');
            showPanel('logs');
            loadLogEntries(date, taskID);
        }

        // =====================================================================
        // Log browser
        // =====================================================================

        let logBreadcrumb = []; // [date, taskID?, ...]

        async function loadLogDates(fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            router.push('/logs');
            routerReplaceMode = false;
            const view = document.getElementById('log-view');
            try {
                const res = await fetch('/api/logs');
                if (!res.ok) {
                    view.innerHTML = '<div class="empty-state"><span>⚠️</span>Log store not configured (set log_dir in server.yaml)</div>';
                    return;
                }
                const data = await res.json();
                renderLogDates(data.dates || []);
            } catch (e) {
                view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load logs: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderLogDates(dates) {
            const view = document.getElementById('log-view');
            if (dates.length === 0) {
                view.innerHTML = '<div class="empty-state"><span>📭</span>No log dates found</div>';
                return;
            }
            let html = '<div class="log-breadcrumb"><span class="current">All Dates</span></div>';
            html += '<div style="flex:1;overflow-y:auto;min-height:0;" id="log-dates-list">';
            html += dates.map(d => `
                <div class="log-task-item" onclick="loadLogTasks('${d}')">
                    <span class="log-task-id">📅 ${d}</span>
                </div>
            `).join('');
            html += '</div>';
            view.innerHTML = html;
        }

        async function loadLogTasks(date, fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            router.push('/logs/' + date);
            routerReplaceMode = false;
            logBreadcrumb = [date];
            const view = document.getElementById('log-view');
            try {
                const res = await fetch('/api/logs/' + date);
                if (!res.ok) {
                    view.innerHTML = '<div class="empty-state"><span>⚠️</span>No tasks found for ' + date + '</div>';
                    return;
                }
                const data = await res.json();
                renderLogTaskList(date, data.summaries || [], data.count || 0);
            } catch (e) {
                view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load tasks: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderLogTaskList(date, summaries, count) {
            const view = document.getElementById('log-view');
            let html = '<div class="log-breadcrumb">';
            html += '<span class="crumb" onclick="loadLogDates()">All Dates</span>';
            html += '<span class="separator">›</span>';
            html += '<span class="current">' + date + ' (' + count + ' tasks)</span>';
            html += '</div>';
            if (summaries.length === 0) {
                html += '<div style="flex:1;min-height:0;"><div class="empty-state"><span>📭</span>No tasks for this date</div></div>';
            } else {
                html += '<div style="flex:1;overflow-y:auto;min-height:0;" id="log-tasks-list">';
                html += summaries.map(s => {
                    const ts = s.start_timestamp
                        ? new Date(s.start_timestamp).toLocaleString()
                        : 'unknown';
                    return `
                    <div class="log-task-item" onclick="loadLogEntries('${date}', '${s.task_id}')">
                        <span class="log-task-id">🔖 ${escapeHtml(s.task_id)}</span>
                        <span class="log-task-count">${ts}</span>
                    </div>`;
                }).join('');
                html += '</div>';
            }
            view.innerHTML = html;
        }

        async function loadLogEntries(date, taskID, fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            router.push('/logs/' + date + '/' + taskID);
            routerReplaceMode = false;
            logBreadcrumb = [date, taskID];
            const view = document.getElementById('log-view');
            try {
                const res = await fetch('/api/logs/' + date + '/' + taskID);
                if (!res.ok) {
                    view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load entries</div>';
                    return;
                }
                const data = await res.json();
                renderLogEntries(date, taskID, data.entries || [], data.count || 0);
            } catch (e) {
                view.innerHTML = '<div class="empty-state"><span>⚠️</span>Failed to load entries: ' + escapeHtml(e.message) + '</div>';
            }
        }

        function renderLogEntries(date, taskID, entries, count) {
            const view = document.getElementById('log-view');
            let html = '<div class="log-breadcrumb">';
            html += '<span class="crumb" onclick="loadLogDates()">All Dates</span>';
            html += '<span class="separator">›</span>';
            html += '<span class="crumb" onclick="loadLogTasks(\'' + date + '\')">' + date + '</span>';
            html += '<span class="separator">›</span>';
            html += '<span class="current">' + escapeHtml(taskID) + ' (' + count + ' entries)</span>';
            html += '<button class="btn btn-sm btn-ghost download-btn" onclick="downloadLog(\'' + date + '\', \'' + escapeHtml(taskID) + '\')">⬇ Download</button>';
            html += '</div>';

            if (entries.length === 0) {
                html += '<div style="flex:1;min-height:0;"><div class="empty-state"><span>📭</span>No log entries for this task</div></div>';
            } else {
                // Use rich tool-block rendering (same as task detail view)
                const isRunning = false; // Logs view is static; streaming handled separately
                let currentToolBlock = null;
                let currentCompaction = null;
                let entriesHtml = '';

                // Accumulator for merging consecutive thinking entries into
                // a single block — matches renderTaskDetail's behaviour.
                let pendingThinkingLines = '';

                let pendingThinkingTimestamp = null;
                let pendingThinkingCount = 0;
                function flushPendingThinking() {
                    if (pendingThinkingLines) {
                        entriesHtml += buildThinkingBlockHTML(pendingThinkingLines, null, pendingThinkingTimestamp, pendingThinkingCount);
                        pendingThinkingLines = '';
                        pendingThinkingTimestamp = null;
                        pendingThinkingCount = 0;
                    }
                }

                // Accumulator for merging consecutive [spawn] lines into
                // a collapsible spawn block (Issue #45).
                let pendingSpawnLines = '';
                let pendingSpawnTimestamp = null;
                let pendingSpawnCount = 0;
                function flushPendingSpawn() {
                    if (pendingSpawnLines) {
                        entriesHtml += buildSpawnBlockHTML(pendingSpawnLines, null, pendingSpawnTimestamp, pendingSpawnCount);
                        pendingSpawnLines = '';
                        pendingSpawnTimestamp = null;
                        pendingSpawnCount = 0;
                    }
                }

                entries.forEach((log) => {
                    const level = log.level || '';

                    // Use structured fields to determine event type.
                    if (level === 'tool' && log.tool_type) {
                        // Flush pending thinking/spawn before tool processing
                        flushPendingThinking();
                        flushPendingSpawn();

                        if (log.tool_type === 'start') {
                            if (currentToolBlock) {
                                // Flush previous incomplete block
                                entriesHtml += buildToolBlockHTML(
                                    currentToolBlock.toolName, currentToolBlock.toolId,
                                    currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                                    currentToolBlock.timestamp, currentToolBlock.entryCount
                                );
                            }
                            currentToolBlock = {
                                toolName: log.tool_name, toolId: log.tool_id,
                                args: log.tool_args, argsJSON: log.tool_args_json,
                                output: '', status: 'running', hasOutput: false,
                                timestamp: log.timestamp, entryCount: 1
                            };
                            return;
                        }

                        if (log.tool_type === 'output') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                currentToolBlock.output += log.tool_output;
                                currentToolBlock.hasOutput = true;
                                currentToolBlock.entryCount++;
                                if (log.timestamp) currentToolBlock.timestamp = log.timestamp;
                            }
                            return;
                        }

                        if (log.tool_type === 'end') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                if (log.tool_output) currentToolBlock.output += log.tool_output;
                                currentToolBlock.status = log.tool_error ? 'error' : 'success';
                                currentToolBlock.entryCount++;
                                if (log.timestamp) currentToolBlock.timestamp = log.timestamp;
                            }
                            // Build and append the complete tool block now that we have all output
                            entriesHtml += buildToolBlockHTML(
                                currentToolBlock.toolName, currentToolBlock.toolId,
                                currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output,
                                currentToolBlock.status, currentToolBlock.timestamp, currentToolBlock.entryCount
                            );
                            currentToolBlock = null;
                            return;
                        }
                    }

                    // Compaction events (issue #53): pair start → end into a
                    // single collapsible block.
                    if (level === 'compaction' && log.compaction_type) {
                        flushPendingThinking();
                        flushPendingSpawn();
                        if (currentToolBlock) {
                            entriesHtml += buildToolBlockHTML(
                                currentToolBlock.toolName, currentToolBlock.toolId,
                                currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                                currentToolBlock.timestamp, currentToolBlock.entryCount
                            );
                            currentToolBlock = null;
                        }
                        if (log.compaction_type === 'start') {
                            currentCompaction = {
                                reason: log.compaction_reason || '',
                                status: 'running', tokensBefore: 0, tokensAfter: 0,
                                summary: '', errorText: '',
                                timestamp: log.timestamp, entryCount: 1
                            };
                            return;
                        }
                        // compaction_type === 'end'
                        const compStatus = log.compaction_error ? 'error' : 'done';
                        const compErrorText = log.compaction_error ? compactionErrorFromLine(log.line) : '';
                        if (currentCompaction) {
                            if (log.compaction_reason) currentCompaction.reason = log.compaction_reason;
                            currentCompaction.tokensBefore = log.compaction_tokens_before || 0;
                            currentCompaction.tokensAfter = log.compaction_tokens_after || 0;
                            currentCompaction.summary = log.compaction_summary || '';
                            currentCompaction.errorText = compErrorText;
                            currentCompaction.status = compStatus;
                            currentCompaction.entryCount++;
                            if (log.timestamp) currentCompaction.timestamp = log.timestamp;
                        } else {
                            // End without a start — render as a standalone block.
                            currentCompaction = {
                                reason: log.compaction_reason || '',
                                status: compStatus,
                                tokensBefore: log.compaction_tokens_before || 0,
                                tokensAfter: log.compaction_tokens_after || 0,
                                summary: log.compaction_summary || '',
                                errorText: compErrorText,
                                timestamp: log.timestamp, entryCount: 1
                            };
                        }
                        entriesHtml += buildCompactionBlockHTML(
                            currentCompaction.reason, currentCompaction.status,
                            currentCompaction.tokensBefore, currentCompaction.tokensAfter,
                            currentCompaction.summary, currentCompaction.errorText,
                            currentCompaction.timestamp, currentCompaction.entryCount
                        );
                        currentCompaction = null;
                        return;
                    }

                    // Non-tool log lines
                    if (currentToolBlock) {
                        entriesHtml += buildToolBlockHTML(
                            currentToolBlock.toolName, currentToolBlock.toolId,
                            currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                            currentToolBlock.timestamp, currentToolBlock.entryCount
                        );
                        currentToolBlock = null;
                    }

                    if (level === 'thinking') {
                        // Accumulate consecutive thinking entries
                        flushPendingSpawn();
                        pendingThinkingLines += log.line;
                        pendingThinkingCount++;
                        if (log.timestamp) pendingThinkingTimestamp = log.timestamp;
                    } else if (level === 'system' && log.line.startsWith('[spawn]')) {
                        // Spawn output — group consecutive [spawn] lines (Issue #45)
                        flushPendingThinking();
                        pendingSpawnLines += log.line + '\n';
                        pendingSpawnCount++;
                        if (log.timestamp) pendingSpawnTimestamp = log.timestamp;
                    } else if (level === 'system') {
                        flushPendingThinking();
                        flushPendingSpawn();
                        entriesHtml += `<div class="log-msg system">${escapeHtml(log.line)}</div>`;
                    } else if (level === 'error') {
                        flushPendingThinking();
                        flushPendingSpawn();
                        entriesHtml += `<div class="log-msg error">${escapeHtml(log.line)}</div>`;
                    } else {
                        flushPendingThinking();
                        flushPendingSpawn();
                        entriesHtml += `<div class="log-msg guest"><div class="md-rendered">${renderMarkdown(log.line)}</div></div>`;
                    }
                });

                // Flush any remaining accumulated entries
                flushPendingThinking();
                flushPendingSpawn();

                // Close any remaining open compaction block (start without end)
                if (currentCompaction) {
                    entriesHtml += buildCompactionBlockHTML(
                        currentCompaction.reason, 'running',
                        currentCompaction.tokensBefore, currentCompaction.tokensAfter,
                        currentCompaction.summary, currentCompaction.errorText,
                        currentCompaction.timestamp, currentCompaction.entryCount
                    );
                    currentCompaction = null;
                }

                // Close any remaining open tool block
                if (currentToolBlock) {
                    entriesHtml += buildToolBlockHTML(
                        currentToolBlock.toolName, currentToolBlock.toolId,
                        currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                        currentToolBlock.timestamp, currentToolBlock.entryCount
                    );
                    currentToolBlock = null;
                }

                html += '<div style="flex:1;overflow-y:auto;min-height:0;" id="log-entries-list">' + entriesHtml + '</div>';
            }
            view.innerHTML = html;
            highlightCommandLines(view);
        }

        // downloadLog triggers a browser download of the raw JSONL log file
        // for a task (Issue #6).
        function downloadLog(date, taskID) {
            const url = '/api/logs/' + date + '/' + taskID + '/download';
            const a = document.createElement('a');
            a.href = url;
            a.download = taskID + '.jsonl';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // downloadTaskLog downloads a task's whole execution trace (Issue
        // #208). Unlike downloadLog it needs no date partition — the task view
        // only knows the task ID, and the server resolves which date
        // directories hold the trace and stitches them together. It fetches
        // rather than clicking an anchor so a failure (nothing flushed yet, log
        // store disabled) surfaces as an error instead of being saved to disk
        // as a .jsonl file containing the error text.
        async function downloadTaskLog(taskID) {
            const url = '/api/tasks/' + encodeURIComponent(taskID) + '/download';
            try {
                const res = await fetch(url);
                if (!res.ok) {
                    alert('Failed to download trace (HTTP ' + res.status + '): ' + (await res.text()).trim());
                    return;
                }
                // The server names the file, including the date span when the
                // trace was spread over several partitions.
                const match = (res.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/);
                const blob = await res.blob();
                const href = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = href;
                a.download = match ? match[1] : taskID + '.jsonl';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(href);
            } catch (e) {
                alert('Failed to download trace: ' + e.message);
            }
        }

        // Handle browser back/forward — re-dispatch to the correct view.
        window.addEventListener('popstate', async () => {
            syncPrefFilterFromURL();
            await router.dispatch(false);
        });

        // Initial load: refresh data, connect WebSocket, then dispatch the
        // current URL to the correct view (restores state after page refresh).
        (async () => {
            // Read the fragment before dispatch: router.push's replaceState
            // during dispatch would otherwise drop it from the address bar.
            syncPrefFilterFromURL();
            connectWS();
            refreshInterval = setInterval(refresh, 5000);
            await refresh();
            await router.dispatch(true);
            updatePrefFilterURL();
        })();
    </script>
</body>
</html>
