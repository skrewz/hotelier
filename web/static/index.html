                    // Not valid JSON — use as-is
                }
                return `<span class="command-line language-bash">${escapeHtml(args)}</span>`;
            }
            return `<span class="command-line-plain">${escapeHtml(args)}</span>`;
        }

        // highlightCommandLines finds all .command-line.language-bash elements
        // inside the given container and runs Prism.highlightElement on them.
        function highlightCommandLines(container) {
            if (typeof Prism === 'undefined') return;
            container.querySelectorAll('.command-line.language-bash').forEach(el => {
                Prism.highlightElement(el);
            });
        }

        function renderToolBlockStart(block, timeStr, cursorClass) {
            // Create the tool block div in the DOM using a fragment
            const frag = document.createDocumentFragment();
            const div = document.createElement('div');
            div.className = 'tool-block';
            div.id = 'tool-' + block.toolId;
            const cmdLine = renderCommandLineHeader(block.toolName, block.args);
            const ts = formatTimestamp(timeStr);
            div.innerHTML = `
                <div class="tool-block-header" onclick="toggleToolBlock('${block.toolId}')">
                    <div>
                        <span class="tool-icon">🔧</span>
                        <span class="tool-name">${escapeHtml(block.toolName)}</span>
                        ${cmdLine}
                        <span class="block-counter">1</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <span class="tool-status running">running</span>
                        <span class="block-timestamp">${ts}</span>
                        <span class="tool-chevron">▶</span>
                    </div>
                </div>
                <div class="tool-block-body" id="tool-body-${block.toolId}">
                    ${block.args ? `<div class="tool-args">${escapeHtml(block.args)}</div>` : ''}
                    ${buildEditDiffHTML(block.argsJSON)}
                    <div class="tool-output"><div class="output-label">Output</div></div>
                </div>
            `;
            frag.appendChild(div);
            highlightCommandLines(div);
            return frag;
        }

        // =====================================================================
        // Inline diff rendering for edit tool calls (Issue #2)
        // =====================================================================

        // diffLCSOps computes a minimal edit script between two arrays of
        // comparable items using longest-common-subsequence dynamic
        // programming. Returns [{type: 'same'|'del'|'add', value}] where
        // 'del' items carry the old value and 'add' items carry the new one.
        function diffLCSOps(oldItems, newItems) {
            const n = oldItems.length, m = newItems.length;
            // dp[i][j] = length of the LCS of oldItems[i:] and newItems[j:]
            const dp = [];
            for (let i = 0; i <= n; i++) dp.push(new Array(m + 1).fill(0));
            for (let i = n - 1; i >= 0; i--) {
                for (let j = m - 1; j >= 0; j--) {
                    if (oldItems[i] === newItems[j]) dp[i][j] = dp[i + 1][j + 1] + 1;
                    else dp[i][j] = Math.max(dp[i + 1][j], dp[i][j + 1]);
                }
            }
            const ops = [];
            let i = 0, j = 0;
            while (i < n && j < m) {
                if (oldItems[i] === newItems[j]) {
                    ops.push({ type: 'same', value: oldItems[i] });
                    i++; j++;
                } else if (dp[i + 1][j] >= dp[i][j + 1]) {
                    ops.push({ type: 'del', value: oldItems[i] });
                    i++;
                } else {
                    ops.push({ type: 'add', value: newItems[j] });
                    j++;
                }
            }
            while (i < n) { ops.push({ type: 'del', value: oldItems[i] }); i++; }
            while (j < m) { ops.push({ type: 'add', value: newItems[j] }); j++; }
            return ops;
        }

        // diffTokenize splits a line into whitespace-preserving tokens so that
        // word-level diffs reconstruct the original line exactly.
        function diffTokenize(line) {
            return line.match(/\s+|\S+/g) || [];
        }

        // diffLineHTML renders one diff line. inner, when provided, is
        // pre-escaped (and possibly annotated) markup; otherwise text is
        // escaped verbatim.
        function diffLineHTML(type, text, inner) {
            const sign = type === 'del' ? '-' : type === 'add' ? '+' : ' ';
            const content = (inner !== undefined) ? inner : escapeHtml(text);
            return `<div class="diff-line ${type}"><span class="diff-sign">${sign}</span><span class="diff-text">${content}</span></div>`;
        }

        // diffWordPairHTML renders a paired del/add line with word-level
        // highlighting. When the two lines share too few tokens to make word
        // spans meaningful, it falls back to plain whole-line highlighting.
        function diffWordPairHTML(oldLine, newLine) {
            const oldTokens = diffTokenize(oldLine);
            const newTokens = diffTokenize(newLine);
            const ops = diffLCSOps(oldTokens, newTokens);
            const shared = ops.filter(o => o.type === 'same').length;
            const maxLen = Math.max(oldTokens.length, newTokens.length);
            if (maxLen === 0 || shared / maxLen < 0.3) {
                return diffLineHTML('del', oldLine) + diffLineHTML('add', newLine);
            }
            let delInner = '', addInner = '';
            for (const op of ops) {
                if (op.type === 'same') {
                    delInner += escapeHtml(op.value);
                    addInner += escapeHtml(op.value);
                } else if (op.type === 'del') {
                    delInner += `<span class="diff-word-del">${escapeHtml(op.value)}</span>`;
                } else {
                    addInner += `<span class="diff-word-add">${escapeHtml(op.value)}</span>`;
                }
            }
            return diffLineHTML('del', null, delInner) + diffLineHTML('add', null, addInner);
        }

        // diffHunkHTML renders one oldText → newText replacement as a group of
        // diff lines. Changed lines are paired (positionally) for word-level
        // highlighting; unpaired lines are shown as whole-line changes.
        function diffHunkHTML(oldText, newText) {
            const oldLines = oldText.split('\n');
            const newLines = newText.split('\n');
            // Size guard: LCS is O(n*m). Above this product, fall back to a
            // naive full-replacement rendering (all old lines, then all new).
            if (oldLines.length * newLines.length > 250000) {
                let html = '';
                for (const l of oldLines) html += diffLineHTML('del', l);
                for (const l of newLines) html += diffLineHTML('add', l);
                return `<div class="diff-hunk">${html}</div>`;
            }
            const ops = diffLCSOps(oldLines, newLines);
            let html = '';
            let i = 0;
            while (i < ops.length) {
                if (ops[i].type === 'same') {
                    html += diffLineHTML('same', ops[i].value);
                    i++;
                    continue;
                }
                const dels = [], adds = [];
                while (i < ops.length && ops[i].type !== 'same') {
                    (ops[i].type === 'del' ? dels : adds).push(ops[i].value);
                    i++;
                }
                const pairs = Math.min(dels.length, adds.length);
                for (let p = 0; p < pairs; p++) html += diffWordPairHTML(dels[p], adds[p]);
                for (let p = pairs; p < dels.length; p++) html += diffLineHTML('del', dels[p]);
                for (let p = pairs; p < adds.length; p++) html += diffLineHTML('add', adds[p]);
            }
            return `<div class="diff-hunk">${html}</div>`;
        }

        // buildEditDiffHTML renders the inline diff for an edit tool call from
        // its raw args JSON. Returns '' when there is nothing diffable:
        // missing/unparseable args, non-edit shape (no edits array), or
        // identical old/new text.
        // The diff is computed here from oldText/newText rather than from
        // Pi's result details.patch: the args are available at tool start,
        // before any result, and details is not guaranteed across providers.
        function buildEditDiffHTML(argsJSON) {
            if (!argsJSON) return '';
            let parsed;
            try {
                parsed = JSON.parse(argsJSON);
            } catch (_) {
                return '';
            }
            if (!parsed || !Array.isArray(parsed.edits)) return '';
            const hunks = [];
            for (const edit of parsed.edits) {
                if (!edit || typeof edit.oldText !== 'string' || typeof edit.newText !== 'string') continue;
                if (edit.oldText === edit.newText) continue;
                hunks.push(diffHunkHTML(edit.oldText, edit.newText));
            }
            if (hunks.length === 0) return '';
            return `<div class="tool-diff">${hunks.join('')}</div>`;
        }

        // buildToolBlockHTML creates a complete tool-block div as innerHTML.
        // Used by renderTaskDetail which builds the full view at once.
        // Completed blocks (done/error) are rendered collapsed by default.
        // Running blocks stay collapsed.
        //   toolName  — name of the tool (e.g. "bash")
        //   toolId    — unique tool call identifier
        //   args      — tool arguments (display string)
        //   argsJSON  — raw argument JSON (renders an inline diff for edit)
        //   output    — captured output
        //   status    — "running", "success", or "error"
        //   timestamp — ISO timestamp for latest activity (defaults to now)
        //   entryCount — number of log entries for this tool call (for counter)
        function buildToolBlockHTML(toolName, toolId, args, argsJSON, output, status, timestamp, entryCount) {
            const statusClass = status === 'error' ? 'error' : 'success';
            const statusLabel = status === 'error' ? 'error' : 'done';
            const argsHtml = args ? `<div class="tool-args">${escapeHtml(args)}</div>` : '';
            const diffHtml = buildEditDiffHTML(argsJSON);
            const outputHtml = output
                ? `<div class="tool-output"><div class="output-label">Output</div><pre>${escapeHtml(output)}</pre></div>`
                : '<div class="tool-output"><div class="output-label">Output</div></div>';
            const cmdLine = renderCommandLineHeader(toolName, args);
            // All blocks collapsed by default (Issue #46: completed collapsed)
            const bodyOpen = '';
            const chevronOpen = '';
            const ts = formatTimestamp(timestamp);
            const counter = entryCount != null ? `<span class="block-counter">${entryCount}</span>` : '';
            return `<div class="tool-block" id="tool-${toolId}">
                <div class="tool-block-header" onclick="toggleToolBlock('${toolId}')">
                    <div>
                        <span class="tool-icon">🔧</span>
                        <span class="tool-name">${escapeHtml(toolName)}</span>
                        ${cmdLine}
                        ${counter}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <span class="tool-status ${statusClass}">${statusLabel}</span>
                        <span class="block-timestamp">${ts}</span>
                        <span class="tool-chevron${chevronOpen}">▶</span>
                    </div>
                </div>
                <div class="tool-block-body${bodyOpen}" id="tool-body-${toolId}">
                    ${argsHtml}${diffHtml}${outputHtml}
                </div>
            </div>`;
        }

        function renderToolBlockEnd(block) {
            // Update existing tool block in place — never create a new div
            const blockEl = document.getElementById('tool-' + block.toolId);
            if (!blockEl) return;

            const statusClass = block.status === 'error' ? 'error' : 'success';
            const statusLabel = block.status === 'error' ? 'error' : 'done';
            const cmdLine = renderCommandLineHeader(block.toolName, block.args);
            const ts = formatTimestamp();

            // Count entries in this block (args + output lines).
            // NOTE: This path (renderToolBlockEnd) counts output lines, while
            // the streaming SSE path (handleLogEntry) increments by 1 per event.
            // The values may differ if a single SSE event delivers multi-line
            // output, but exact counter semantics are not guaranteed (Issue #46).
            let entryCount = 1; // start event
            if (block.output) {
                entryCount += block.output.split('\n').length;
            }

            // Update header
            const header = blockEl.querySelector('.tool-block-header');
            header.innerHTML = `
                <div>
                    <span class="tool-icon">🔧</span>
                    <span class="tool-name">${escapeHtml(block.toolName)}</span>
                    ${cmdLine}
                    <span class="block-counter">${entryCount}</span>
                </div>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                    <span class="tool-status ${statusClass}">${statusLabel}</span>
                    <span class="block-timestamp">${ts}</span>
                    <span class="tool-chevron">▶</span>
                </div>
            `;
            highlightCommandLines(blockEl);

            // Update body: append result to output as pre-formatted text
            const bodyEl = blockEl.querySelector('.tool-block-body');
            const outputDiv = bodyEl.querySelector('.tool-output');
            if (outputDiv && block.output) {
                outputDiv.innerHTML = '<pre>' + escapeHtml(block.output) + '</pre>';
            } else if (!outputDiv && block.output) {
                bodyEl.innerHTML = `<div class="tool-output"><div class="output-label">Output</div><pre>${escapeHtml(block.output)}</pre></div>`;
            }
        }

        function togglePromptBlock() {
            const body = document.querySelector('.task-detail-prompt-body');
            const header = document.querySelector('.task-detail-prompt-header');
            const chevron = header?.querySelector('.prompt-chevron');
            if (body) {
                body.classList.toggle('open');
                if (chevron) chevron.classList.toggle('open');
            }
        }

        function toggleToolBlock(toolId) {
            const body = document.getElementById('tool-body-' + toolId);
            const chevron = body?.previousElementSibling?.querySelector('.tool-chevron');
            if (body) {
                body.classList.toggle('open');
                if (chevron) chevron.classList.toggle('open');
            }
        }

        // Thinking block helpers
        // Prompt preview truncation limit (Issue #46: named constant per reviewer feedback)
        const PROMPT_PREVIEW_MAX_LEN = 80;

        let _thinkingBlockCounter = 0;

        function nextThinkingBlockId() {
            _thinkingBlockCounter++;
            return 'thinking-' + _thinkingBlockCounter;
        }

        function toggleThinkingBlock(blockId) {
            const body = document.getElementById('thinking-body-' + blockId);
            const header = body?.previousElementSibling;
            const chevron = header?.querySelector('.thinking-chevron');
            if (body) {
                body.classList.toggle('open');
                if (chevron) chevron.classList.toggle('open');
            }
        }

        // buildThinkingBlockHTML creates a collapsible thinking block.
        // content — accumulated thinking text
        // blockId — unique identifier for the block
        // timestamp — ISO timestamp string for the latest activity (defaults to now)
        // entryCount — number of log entries in this block (for counter display)
        function buildThinkingBlockHTML(content, blockId, timestamp, entryCount) {
            if (!blockId) blockId = nextThinkingBlockId();
            const preview = getFirstLine(content);
            const ts = formatTimestamp(timestamp);
            const counter = entryCount != null ? `<span class="block-counter">${entryCount}</span>` : '';
            return `<div class="thinking-block" id="thinking-${blockId}">
                <div class="thinking-block-header" onclick="toggleThinkingBlock('${blockId}')">
                    <div>
                        <span class="thinking-icon">💭</span>
                        <span class="thinking-label">Thinking</span>
                        ${preview ? `<span class="thinking-preview">${escapeHtml(preview)}</span>` : ''}
                        ${counter}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.25rem;">
                        <span class="block-timestamp">${ts}</span>
                        <span class="thinking-chevron">▶</span>
                    </div>
                </div>
                <div class="thinking-block-body" id="thinking-body-${blockId}">
                    <div class="thinking-content">${escapeHtml(content)}</div>
                </div>
            </div>`;
        }

        // =====================================================================
        // Spawn block helpers — collapsible pre-run troubleshooting output
        // (Issue #45)
        // =====================================================================

        let _spawnBlockCounter = 0;

        function nextSpawnBlockId() {
            _spawnBlockCounter++;
            return 'spawn-' + _spawnBlockCounter;
        }

        function toggleSpawnBlock(blockId) {
            const body = document.getElementById('spawn-body-' + blockId);
            if (!body) return;
            const header = body.previousElementSibling;
            const chevron = header?.querySelector('.spawn-chevron');
            body.classList.toggle('open');
            if (chevron) chevron.classList.toggle('open');
        }

        // buildSpawnBlockHTML creates a collapsible spawn block for pre-run
        // troubleshooting output. Always collapsed by default.
        //   content  — accumulated spawn output text (lines joined with newlines)
        //   blockId  — unique identifier for the block
        //   timestamp — ISO timestamp string for the latest activity (defaults to now)
        //   lineCount — number of spawn lines in this block (for counter display)
        function buildSpawnBlockHTML(content, blockId, timestamp, lineCount) {
            if (!blockId) blockId = nextSpawnBlockId();
            const preview = getFirstLine(content);
            const ts = formatTimestamp(timestamp);
            const counter = lineCount != null ? `<span class="block-counter">${lineCount}</span>` : '';
            return `<div class="spawn-block" id="spawn-${blockId}">
                <div class="spawn-block-header" onclick="toggleSpawnBlock('${blockId}')">
                    <div>
                        <span class="spawn-icon">🔍</span>
                        <span class="spawn-label">Spawn output</span>
                        ${preview ? `<span class="spawn-preview">${escapeHtml(preview)}</span>` : ''}
                        ${counter}
                    </div>
                    <div style="display:flex;align-items:center;gap:0.25rem;">
                        <span class="block-timestamp">${ts}</span>
                        <span class="spawn-chevron">▶</span>
                    </div>
                </div>
                <div class="spawn-block-body" id="spawn-body-${blockId}">
                    <div class="spawn-content">${escapeHtml(content)}</div>
                </div>
            </div>`;
        }

        // =====================================================================
        // Compaction block helpers — context compaction events (issue #53)
        // =====================================================================

        let _compactionBlockCounter = 0;

        function nextCompactionBlockId() {
            _compactionBlockCounter++;
            return 'compaction-' + _compactionBlockCounter;
        }

        function toggleCompactionBlock(blockId) {
            const body = document.getElementById('compaction-body-' + blockId);
            if (!body) return;
            const header = body.previousElementSibling;
            const chevron = header?.querySelector('.compaction-chevron');
            body.classList.toggle('open');
            if (chevron) chevron.classList.toggle('open');
        }

        // compactionErrorFromLine extracts the error message from a
        // [COMPACTION_END] ... [ERROR] <msg> log line.
        function compactionErrorFromLine(line) {
            const idx = line.indexOf('[ERROR] ');
            return idx >= 0 ? line.slice(idx + 8) : line;
        }

        // buildCompactionBlockHTML creates a collapsible compaction block.
        //   reason       — "manual", "threshold" or "overflow"
        //   status       — "running", "done" or "error"
        //   tokensBefore — context size before compaction (0 if unknown)
        //   tokensAfter  — estimated context size after compaction (0 if unknown)
        //   summary      — generated summary text (done)
        //   errorText    — error message (error)
        //   timestamp    — ISO timestamp for latest activity
        //   entryCount   — number of log entries in this block (start + end)
        function buildCompactionBlockHTML(reason, status, tokensBefore, tokensAfter, summary, errorText, timestamp, entryCount) {
            const blockId = nextCompactionBlockId();
            const statusClass = status === 'error' ? 'error' : (status === 'done' ? 'done' : 'running');
            const statusLabel = status === 'error' ? 'failed' : (status === 'done' ? 'completed' : 'compacting…');
            const tokensHtml = (tokensBefore > 0 || tokensAfter > 0)
                ? `<span class="compaction-tokens">${tokensBefore} → ${tokensAfter} tokens</span>` : '';
            const open = status === 'done' || status === 'error';
            let bodyContent;
            if (status === 'error') {
                bodyContent = `<div class="compaction-error-text">${escapeHtml(errorText || 'Compaction failed')}</div>`;
            } else if (summary) {
                bodyContent = `<div class="compaction-summary"><div class="output-label">Summary</div><pre>${escapeHtml(summary)}</pre></div>`;
            } else {
                bodyContent = '<div class="compaction-pending">Compacting…</div>';
            }
            return `<div class="compaction-block" id="compaction-${blockId}">
                <div class="compaction-block-header" onclick="toggleCompactionBlock('${blockId}')">
                    <div>
                        <span class="compaction-icon">🗜️</span>
                        <span class="compaction-label">Compaction</span>
                        ${reason ? `<span class="compaction-reason">${escapeHtml(reason)}</span>` : ''}
                        ${tokensHtml}
                        <span class="block-counter">${entryCount}</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:0.5rem;">
                        <span class="compaction-status ${statusClass}">${statusLabel}</span>
                        <span class="block-timestamp">${formatTimestamp(timestamp)}</span>
                        <span class="compaction-chevron${open ? ' open' : ''}">▶</span>
                    </div>
                </div>
                <div class="compaction-block-body${open ? ' open' : ''}" id="compaction-body-${blockId}">
                    ${bodyContent}
                </div>
            </div>`;
        }

        // renderUnknownEvent renders an unrecognized RPC event in a grey <pre> block.
        function renderUnknownEvent(event) {
            const pre = document.createElement('pre');
            pre.className = 'log-msg unknown-event';
            pre.innerHTML = `<code>${escapeHtml(JSON.stringify(event, null, 2))}</code>`;
            return pre;
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // A task counts as "running" while it is assigned to a guest or
        // actively executing. Matches the convention used when deciding
        // whether the log stream is still live in renderTaskDetail().
        function isTaskRunning(task) {
            return !!task && (task.status === 'RUNNING' || task.status === 'ASSIGNED');
        }

        // spinnerHTML returns the ⏳ spinner shown next to a running task's
        // log count (issue #210). Its rotation is keyed off the number: the
        // count modulo 360 gives an angle in degrees, so the hourglass turns
        // a little every time a new log entry arrives. Returns '' when the
        // task is not running, keeping callers free of status checks.
        function spinnerHTML(logCount, running) {
            if (!running) return '';
            const angle = (logCount || 0) % 360;
            return ` <span class="task-spinner" style="transform: rotate(${angle}deg)" title="Task running">⏳</span>`;
        }

        // listSpinnerHTML is the overview page's variant of spinnerHTML
        // (issue #246). Unlike the detail-view spinner its angle is not keyed
        // off the log count: the angle held in listSpinners is what the
        // markup renders, so a list re-render never snaps the hourglass back
        // while the ticker keeps it turning between renders.
        function listSpinnerHTML(task) {
            if (!isTaskRunning(task)) return '';
            const st = listSpinners.get(task.id);
            const angle = st ? st.angle : 0;
            return ` <span class="task-spinner list-spinner" data-task-id="${escapeAttr(task.id)}" style="transform: rotate(${angle}deg)" title="Task running">⏳</span>`;
        }

        // updateListSpinners runs on every task-list update (the 5s poller,
        // WebSocket task.updated, and filter toggles all arrive through
        // renderTasks). A task whose log count changed since the previous
        // update spins; one whose count is unchanged pauses at its current
        // angle. Tasks that settled or disappeared lose their state, and a
        // task seen for the first time starts at rest — there is no earlier
        // update yet to have changed anything.
        //
        // Log counts are tracked for every task, but only a task the list
        // actually renders (the same predicate renderTasks uses for
        // `filtered`) may be spinning: a running task hidden by the status
        // filter has no hourglass on screen, so leaving it spinning would
        // keep the ticker alive with nothing to animate.
        function updateListSpinners(tasks) {
            const live = new Set();
            for (const t of tasks || []) {
                if (!isTaskRunning(t)) continue;
                live.add(t.id);
                const count = t.log_count || 0;
                const visible = taskFilter[t.status] !== false;
                const st = listSpinners.get(t.id);
                if (!st) {
                    listSpinners.set(t.id, { lastLogCount: count, angle: 0, spinning: false });
                } else {
                    st.spinning = visible && count !== st.lastLogCount;
                    st.lastLogCount = count;
                }
            }
            for (const id of Array.from(listSpinners.keys())) {
                if (!live.has(id)) listSpinners.delete(id);
            }
            ensureListSpinnerTicker();
        }

        // ensureListSpinnerTicker starts the ticker when something should be
        // spinning and none is running yet; tickListSpinners stops it again
        // once nothing is.
        function ensureListSpinnerTicker() {
            if (listSpinnerTimer) return;
            for (const st of listSpinners.values()) {
                if (st.spinning) {
                    listSpinnerTimer = setInterval(tickListSpinners, LIST_SPINNER_TICK_MS);
                    return;
                }
            }
        }

        // tickListSpinners advances every spinning hourglass a few degrees
        // and writes the angle to the live DOM element between list renders —
        // this is what makes the rotation smooth rather than one step per log
        // entry. Paused spinners are left where they are. When nothing is
        // spinning the ticker stops itself.
        function tickListSpinners() {
            let anySpinning = false;
            const nodes = {};
            document.querySelectorAll('.task-item .list-spinner').forEach(el => { nodes[el.dataset.taskId] = el; });
            for (const [id, st] of listSpinners) {
                if (!st.spinning) continue;
                anySpinning = true;
                st.angle += LIST_SPINNER_DEG_PER_TICK;
                if (st.angle >= LIST_SPINNER_FOLD_DEG) st.angle %= 360;
                if (nodes[id]) nodes[id].style.transform = `rotate(${st.angle}deg)`;
            }
            if (!anySpinning && listSpinnerTimer) {
                clearInterval(listSpinnerTimer);
                listSpinnerTimer = null;
            }
        }

        // escapeAttr escapes a value for interpolation into a double-quoted
        // HTML attribute. escapeHtml is not enough for that context: it
        // serialises via innerHTML, which leaves quotes untouched, so a value
        // containing a quote would break out of the attribute.
        function escapeAttr(value) {
            const entities = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return String(value ?? '').replace(/[&<>"']/g, (c) => entities[c]);
        }

        // taskTitleHTML renders a task's optional title for display in
        // front of the task ID (issue #229). Returns '' when the task
        // carries no title, leaving the row exactly as it rendered before.
        // When the task also carries an http(s) reference URL the title
        // becomes an anchor opening in a new tab; any other scheme (or no
        // URL at all) renders as plain text, so a hostile caller cannot
        // smuggle a javascript: link through the task metadata. Titles
        // arrive from arbitrary callers, so they are always rendered as
        // escaped text, never as raw HTML.
        function taskTitleHTML(task) {
            if (!task || !task.title) return '';
            const text = escapeHtml(task.title);
            let inner = text;
            if (/^https?:\/\//i.test(task.url || '')) {
                inner = `<a href="${escapeAttr(task.url)}" target="_blank" rel="noopener noreferrer">${text}</a>`;
            }
            return `<span class="task-title" title="${escapeAttr(task.title)}">${inner}</span>`;
        }

// priorityToEmoji maps the API priority string to its display emoji.
        // API values are plain English: "firefighter", "teacher", "orangutan".
        function priorityToEmoji(priority) {
            const map = {
                'firefighter': '🧑‍🚒',
                'teacher': '🧑‍🏫',
                'orangutan': '🦧'
            };
            return map[priority] || priority;
        }

        // PRIORITY_LADDER lists the priority levels from highest to lowest.
        // The bump buttons step one position along this ladder (issue #266).
        const PRIORITY_LADDER = ['firefighter', 'teacher', 'orangutan'];

        // priorityBumpButtonsHTML renders the ⬆️/⬇️ controls for a pending
        // task. Each button shows an arrow and the emoji of the priority it
        // would move the task TO: an orangutan task therefore only shows
        // "⬆️🧑‍🏫", a firefighter task only "⬇️🧑‍🏫", a teacher task both
        // (issue #266).
        //
        // stopPropagation is set for buttons embedded in clickable list
        // rows, where a click must not also select the task.
        function priorityBumpButtonsHTML(taskId, priority, stopPropagation) {
            const idx = PRIORITY_LADDER.indexOf(priority);
            if (idx === -1) return '';
            const guard = stopPropagation ? 'event.stopPropagation(); ' : '';
            const attr = `data-task-id="${escapeAttr(taskId)}" data-priority="${escapeAttr(priority)}"`;
            let html = '';
            if (idx > 0) {
                const up = PRIORITY_LADDER[idx - 1];
                html += `<button class="btn btn-sm btn-ghost priority-bump priority-bump-up" ${attr} data-dir="up" title="Raise priority to ${escapeAttr(priorityToEmoji(up))} (${escapeAttr(up)})" onclick="${guard}bumpPriority(this.dataset.taskId, this.dataset.priority, this.dataset.dir)">&#x2B06;&#xFE0F;${priorityToEmoji(up)}</button>`;
            }
            if (idx < PRIORITY_LADDER.length - 1) {
                const down = PRIORITY_LADDER[idx + 1];
                html += `<button class="btn btn-sm btn-ghost priority-bump priority-bump-down" ${attr} data-dir="down" title="Lower priority to ${escapeAttr(priorityToEmoji(down))} (${escapeAttr(down)})" onclick="${guard}bumpPriority(this.dataset.taskId, this.dataset.priority, this.dataset.dir)">&#x2B07;&#xFE0F;${priorityToEmoji(down)}</button>`;
            }
            return html;
        }

        // bumpPriority moves a pending task one step up or down the
        // priority ladder via POST /api/tasks/:id/priority (issue #266).
        // dir is 'up' (towards firefighter) or 'down' (towards orangutan).
        async function bumpPriority(taskId, current, dir) {
            const idx = PRIORITY_LADDER.indexOf(current);
            const target = idx === -1 ? undefined : PRIORITY_LADDER[idx + (dir === 'up' ? -1 : 1)];
            if (!target) return; // already at the top or bottom of the ladder
            try {
                const res = await fetch('/api/tasks/' + encodeURIComponent(taskId) + '/priority', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ priority: target }),
                });
                if (!res.ok) {
                    const errText = await res.text();
                    alert('Failed to change priority: ' + errText);
                }
                // Refresh either way: on success to show the new priority,
                // on failure to show the true state (e.g. the task was
                // assigned while this request was in flight).
                refresh();
            } catch (e) {
                console.error('priority bump failed:', e);
                alert('Failed to change priority: ' + e.message);
            }
        }

        // personaColourClass returns a deterministic CSS class for the given
        // persona name, mapping it to one of several distinguishable colours.
        function personaColourClass(name) {
            if (!name) return '';
            let hash = 0;
            for (let i = 0; i < name.length; i++) {
                hash = ((hash << 5) - hash) + name.charCodeAt(i);
                hash |= 0;
            }
            const palette = 8;
            return 'persona-badge-' + ((hash % palette) + palette) % palette;
        }
        // getFirstLine extracts the first line of text, optionally truncated to maxLen chars.
        function getFirstLine(text, maxLen) {
            if (!text) return '';
            const line = text.split('\n')[0] || text;
            if (maxLen != null && line.length > maxLen) return line.substring(0, maxLen) + '…';
            return line;
        }

        // formatTimestamp returns a local HH:MM string from a Date or ISO string.
        function formatTimestamp(ts) {
            const d = ts instanceof Date ? ts : new Date(ts || Date.now());
            return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse(text);
            }
            return escapeHtml(text);
        }

        function selectTask(taskId, fromInitialLoad) {
            if (fromInitialLoad) routerReplaceMode = true;
            activeTaskId = taskId;
            router.push('/task/' + taskId);
            routerReplaceMode = false;
            // Skip the detail-meta patch in refresh() because we immediately
            // do a full refreshTaskDetail() below — avoids a redundant fetch.
            refresh(true);
            // Show Logs tab but skip loadLogDates (we're showing task detail, not log browser)
            activateTabByName('Logs');
            showPanel('logs');
            // Use the task detail API (has structured tool fields) for rich rendering
            refreshTaskDetail(taskId);
        }

        // =====================================================================
        // Full-screen task logs (issue #205)
        // =====================================================================
        // On a phone the layout stacks the sidebar above the main pane (issue
        // #203), which leaves the log stream of an open task a fraction of the
        // screen. setLogsFullscreen expands it to the whole viewport, or back
        // to that split-screen view. The single corner button in the task
        // detail header is both the expand and the collapse affordance, so the
        // state lives on <body> (where the CSS hangs off) and the button is
        // only re-labelled — re-rendering the detail view (polling, WS updates)
        // therefore never loses the mode.
        function setLogsFullscreen(on) {
            document.body.classList.toggle('logs-fullscreen', on);
            const btn = document.querySelector('.task-detail-fullscreen-btn');
            if (btn) {
                btn.textContent = on ? '\u26F6 Split screen' : '\u26F6 Full screen';
                btn.title = on ? 'Back to the split-screen view' : 'View these logs in full screen';
                btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            }
            // The log pane grows or shrinks; keep it pinned to the newest line.
            const logBody = document.querySelector('#log-view .task-detail-body');
            if (logBody) logBody.scrollTop = logBody.scrollHeight;
        }

        function toggleLogsFullscreen() {
            setLogsFullscreen(!document.body.classList.contains('logs-fullscreen'));
        }

        // Full screen is a narrow-viewport-only mode: the CSS that hides the
        // header, sidebar and tab bar is scoped to the same 768px breakpoint
        // that reveals the toggle. Crossing that breakpoint with the mode still
        // active (a phone rotated to landscape) would leave the layout hidden by
        // CSS but its only exit button hidden too, so drop the mode as soon as
        // the viewport stops matching the media query.
        // https://developer.mozilla.org/en-US/docs/Web/API/Window/matchMedia
        const narrowViewport = window.matchMedia('(max-width: 768px)');
        narrowViewport.addEventListener('change', () => {
            if (!narrowViewport.matches) setLogsFullscreen(false);
        });

        // =====================================================================
        // Sidebar drawer on narrow viewports (issue #234)
        // =====================================================================
        // The Guests list and the Submit Task form are the least interesting
        // part of the dashboard, so on a phone they are collapsed behind a
        // draw-down button in the top bar and the task area takes the screen.
        // As with full-screen logs (issue #205) the state lives on <body>, so
        // polling and WebSocket re-renders cannot lose it, and the one button
        // is both the open and the close affordance. Wider viewports ignore
        // the class: there the CSS shows the sidebar unconditionally and hides
        // the toggle, so crossing the breakpoint needs no clean-up here.
        function setSidebarOpen(on) {
            document.body.classList.toggle('sidebar-open', on);
            const btn = document.querySelector('.sidebar-toggle');
            if (btn) {
                btn.textContent = on ? '\u2715 Close panels' : '\u2630 Panels';
                btn.title = on ? 'Hide the guests list and the submit form' : 'Show the guests list and the submit form';
                btn.setAttribute('aria-expanded', on ? 'true' : 'false');
            }
        }

        function toggleSidebar() {
            setSidebarOpen(!document.body.classList.contains('sidebar-open'));
        }

        async function refreshTaskDetail(taskId) {
            try {
                const res = await fetch(`/api/tasks/${taskId}`);
                if (!res.ok) return;
                const data = await res.json();
                renderTaskDetail(data.task, data.logs || [], data.log_count || 0);
            } catch (e) {
                console.error('failed to load task detail:', e);
            }
        }

        // patchTaskDetailMeta updates only the header metadata (status badge,
        // persona badge, log count) of the active task detail view. It does NOT touch the
        // .task-detail-body, so open/closed state of tool blocks and thinking
        // blocks is preserved across polling refreshes.
        async function patchTaskDetailMeta(taskId) {
            try {
                const res = await fetch(`/api/tasks/${taskId}`);
                if (!res.ok) return;
                const data = await res.json();
                const task = data.task;
                if (!task) return;

                // Update status badge in header
                const badgeEl = document.querySelector('.task-detail-header .badge');
                if (badgeEl) {
                    const badgeClass = `badge-${task.status.toLowerCase()}`;
                    badgeEl.className = `badge ${badgeClass}`;
                    badgeEl.textContent = task.status;
                }

                // Update persona badge in header (add, remove, or keep)
                const detailIdEl = document.querySelector('.task-detail-id');
                if (detailIdEl) {
                    const existingPersona = detailIdEl.querySelector('.persona-badge');
                    if (task.persona) {
                        const colourCls = personaColourClass(task.persona);
                        if (existingPersona) {
                            existingPersona.className = 'persona-badge ' + colourCls;
                            existingPersona.textContent = `🧑 ${escapeHtml(task.persona)}`;
                            existingPersona.title = `Persona: ${escapeHtml(task.persona)}`;
                        } else {
                            const span = document.createElement('span');
                            span.className = 'persona-badge ' + colourCls;
                            span.title = `Persona: ${escapeHtml(task.persona)}`;
                            span.textContent = `🧑 ${escapeHtml(task.persona)}`;
                            detailIdEl.appendChild(span);
                        }
                    } else if (existingPersona) {
                        existingPersona.remove();
                    }
                }

                // Update priority badge in header (add, remove, or keep)
                // Priority badge only shown for PENDING tasks
                const headerRow = document.querySelector('.task-detail-header > div:last-child');
                if (headerRow) {
                    const existingPriority = headerRow.querySelector('.badge-priority');
                    const showPriority = task.status === 'PENDING' && task.priority;
                    // The bump controls live or die with the badge, and
                    // must reflect the current priority (issue #266).
                    headerRow.querySelectorAll('.priority-bump').forEach(b => b.remove());
                    if (showPriority) {
                        let badge = existingPriority;
                        if (badge) {
                            badge.textContent = `🔜${priorityToEmoji(task.priority)}`;
                            badge.title = `Priority`;
                        } else {
                            badge = document.createElement('span');
                            badge.className = 'badge badge-priority';
                            badge.title = 'Priority';
                            badge.textContent = `🔜${priorityToEmoji(task.priority)}`;
                            headerRow.insertBefore(badge, headerRow.firstChild);
                        }
                        badge.insertAdjacentHTML('afterend', priorityBumpButtonsHTML(task.id, task.priority, false));
                    } else if (existingPriority) {
                        existingPriority.remove();
                    }
                }

                // Update log count in header meta
                const metaEl = document.querySelector('.task-detail-meta');
                if (metaEl) {
                    const guestPart = task.assigned_to
                        ? 'Guest: ' + guestLabel(task.assigned_to)
                        : 'Unassigned';
                    const logCount = data.log_count || 0;
                    // innerHTML (not textContent) so the spinner span is
                    // added for running tasks and removed once they settle.
                    // guestPart is already escaped above.
                    metaEl.innerHTML = `${guestPart} · <span class="meta-log-count">${logCount} log entries</span>${spinnerHTML(logCount, isTaskRunning(task))}`;
                }
            } catch (e) {
                console.error('failed to patch task detail meta:', e);
            }
        }

        function renderTaskDetail(task, logs, logCount) {
            const view = document.getElementById('log-view');
            if (!task) return;

            const badgeClass = `badge-${task.status.toLowerCase()}`;
            const personaBadge = task.persona ? `<span class="persona-badge ${personaColourClass(task.persona)}" title="Persona: ${escapeHtml(task.persona)}">🧑 ${escapeHtml(task.persona)}</span>` : '';
            const promptMarkdown = renderMarkdown(task.prompt);
            // Extract first line of prompt for collapsed preview
            const promptPreview = getFirstLine(task.prompt, PROMPT_PREVIEW_MAX_LEN);

            let logsHtml = '';
            if (logs.length === 0) {
                logsHtml += '<div class="log-msg system">Waiting for guest output...</div>';
            } else {
                const isRunning = isTaskRunning(task);
                let currentToolBlock = null;
                let currentCompaction = null;

                // Accumulators for merging consecutive thinking/text/spawn entries
                let pendingThinkingLines = '';
                let pendingThinkingTimestamp = null;
                let pendingThinkingCount = 0;
                let pendingTextLines = '';
                let pendingSpawnLines = '';
                let pendingSpawnTimestamp = null;
                let pendingSpawnCount = 0;

                function flushPendingThinking() {
                    if (pendingThinkingLines) {
                        logsHtml += buildThinkingBlockHTML(pendingThinkingLines, null, pendingThinkingTimestamp, pendingThinkingCount);
                        pendingThinkingLines = '';
                        pendingThinkingTimestamp = null;
                        pendingThinkingCount = 0;
                    }
                }

                function flushPendingText() {
                    if (pendingTextLines) {
                        logsHtml += `<div class="log-msg guest${pendingTextCursor ? ' streaming-cursor' : ''}"><div class="md-rendered">${renderMarkdown(pendingTextLines)}</div></div>`;
                        pendingTextLines = '';
                        pendingTextCursor = '';
                    }
                }

                function flushPendingSpawn() {
                    if (pendingSpawnLines) {
                        logsHtml += buildSpawnBlockHTML(pendingSpawnLines, null, pendingSpawnTimestamp, pendingSpawnCount);
                        pendingSpawnLines = '';
                        pendingSpawnTimestamp = null;
                        pendingSpawnCount = 0;
                    }
                }

                let pendingTextCursor = '';

                logs.forEach((log, i) => {
                    const isLast = i === logs.length - 1 && isRunning;
                    const cursorClass = isLast ? ' streaming-cursor' : '';
                    const level = log.level || '';

                    // Use structured fields to determine event type.
                    if (level === 'tool' && log.tool_type) {
                        // Flush any pending thinking/text/spawn before tool processing.
                        flushPendingThinking();
                        flushPendingSpawn();
                        flushPendingText();

                        if (log.tool_type === 'start') {
                            if (currentToolBlock) {
                                // Flush previous incomplete block
                                logsHtml += buildToolBlockHTML(
                                    currentToolBlock.toolName, currentToolBlock.toolId,
                                    currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                                    currentToolBlock.timestamp, currentToolBlock.entryCount
                                );
                            }
                            currentToolBlock = {
                                toolName: log.tool_name, toolId: log.tool_id,
                                args: log.tool_args, argsJSON: log.tool_args_json,
                                output: '', status: 'running', hasOutput: false,
                                timestamp: log.timestamp, entryCount: 1
                            };
                            return;
                        }

                        if (log.tool_type === 'output') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                currentToolBlock.output += log.tool_output;
                                currentToolBlock.hasOutput = true;
                                currentToolBlock.entryCount++;
                                if (log.timestamp) currentToolBlock.timestamp = log.timestamp;
                            }
                            return;
                        }

                        if (log.tool_type === 'end') {
                            if (currentToolBlock && currentToolId(currentToolBlock) === log.tool_id) {
                                if (log.tool_output) currentToolBlock.output += log.tool_output;
                                currentToolBlock.status = log.tool_error ? 'error' : 'success';
                                currentToolBlock.entryCount++;
                                if (log.timestamp) currentToolBlock.timestamp = log.timestamp;
                            }
                            // Build and append the complete tool block now that we have all output
                            if (currentToolBlock) {
                                logsHtml += buildToolBlockHTML(
                                    currentToolBlock.toolName, currentToolBlock.toolId,
                                    currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output,
                                    currentToolBlock.status, currentToolBlock.timestamp, currentToolBlock.entryCount
                                );
                            }
                            currentToolBlock = null;
                            return;
                        }
                    }

                    // Compaction events (issue #53): pair start → end into a
                    // single collapsible block.
                    if (level === 'compaction' && log.compaction_type) {
                        flushPendingThinking();
                        flushPendingSpawn();
                        flushPendingText();
                        if (currentToolBlock) {
                            logsHtml += buildToolBlockHTML(
                                currentToolBlock.toolName, currentToolBlock.toolId,
                                currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                                currentToolBlock.timestamp, currentToolBlock.entryCount
                            );
                            currentToolBlock = null;
                        }
                        if (log.compaction_type === 'start') {
                            currentCompaction = {
                                reason: log.compaction_reason || '',
                                status: 'running', tokensBefore: 0, tokensAfter: 0,
                                summary: '', errorText: '',
                                timestamp: log.timestamp, entryCount: 1
                            };
                            return;
                        }
                        // compaction_type === 'end'
                        const compStatus = log.compaction_error ? 'error' : 'done';
                        const compErrorText = log.compaction_error ? compactionErrorFromLine(log.line) : '';
                        if (currentCompaction) {
                            if (log.compaction_reason) currentCompaction.reason = log.compaction_reason;
                            currentCompaction.tokensBefore = log.compaction_tokens_before || 0;
                            currentCompaction.tokensAfter = log.compaction_tokens_after || 0;
                            currentCompaction.summary = log.compaction_summary || '';
                            currentCompaction.errorText = compErrorText;
                            currentCompaction.status = compStatus;
                            currentCompaction.entryCount++;
                            if (log.timestamp) currentCompaction.timestamp = log.timestamp;
                        } else {
                            // End without a start — render as a standalone block.
                            currentCompaction = {
                                reason: log.compaction_reason || '',
                                status: compStatus,
                                tokensBefore: log.compaction_tokens_before || 0,
                                tokensAfter: log.compaction_tokens_after || 0,
                                summary: log.compaction_summary || '',
                                errorText: compErrorText,
                                timestamp: log.timestamp, entryCount: 1
                            };
                        }
                        logsHtml += buildCompactionBlockHTML(
                            currentCompaction.reason, currentCompaction.status,
                            currentCompaction.tokensBefore, currentCompaction.tokensAfter,
                            currentCompaction.summary, currentCompaction.errorText,
                            currentCompaction.timestamp, currentCompaction.entryCount
                        );
                        currentCompaction = null;
                        return;
                    }

                    // Non-tool log lines
                    if (currentToolBlock) {
                        logsHtml += buildToolBlockHTML(
                            currentToolBlock.toolName, currentToolBlock.toolId,
                            currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                            currentToolBlock.timestamp, currentToolBlock.entryCount
                        );
                        currentToolBlock = null;
                    }

                    if (currentCompaction) {
                        // A non-compaction entry arrived while a compaction was
                        // open — flush it as running.
                        logsHtml += buildCompactionBlockHTML(
                            currentCompaction.reason, 'running',
                            currentCompaction.tokensBefore, currentCompaction.tokensAfter,
                            currentCompaction.summary, currentCompaction.errorText,
                            currentCompaction.timestamp, currentCompaction.entryCount
                        );
                        currentCompaction = null;
                    }

                    if (level === 'thinking') {
                        // Merge consecutive thinking entries into a single block
                        flushPendingText();
                        flushPendingSpawn();
                        pendingThinkingLines += log.line;
                        pendingThinkingCount++;
                        if (log.timestamp) pendingThinkingTimestamp = log.timestamp;
                    } else if (level === 'system' && log.line.startsWith('[spawn]')) {
                        // Spawn output — group consecutive [spawn] lines into
                        // a collapsible block (Issue #45).
                        flushPendingThinking();
                        flushPendingText();
                        pendingSpawnLines += log.line + '\n';
                        pendingSpawnCount++;
                        if (log.timestamp) pendingSpawnTimestamp = log.timestamp;
                    } else {
                        // Non-thinking entry: flush pending thinking/spawn, then
                        // accumulate or flush text.
                        flushPendingThinking();
                        flushPendingSpawn();
                        if (level === 'system') {
                            logsHtml += `<div class="log-msg system${cursorClass}">${escapeHtml(log.line)}</div>`;
                        } else if (level === 'error') {
                            logsHtml += `<div class="log-msg error${cursorClass}">${escapeHtml(log.line)}</div>`;
                        } else {
                            // Text/info — accumulate consecutive text entries
                            // and merge into a single guest message.
                            pendingTextLines += log.line;
                            if (isLast) pendingTextCursor = cursorClass;
                        }
                    }
                });

                // Flush any remaining accumulators
                flushPendingThinking();
                flushPendingSpawn();
                flushPendingText();

                // Close any remaining open compaction block (start without end)
                if (currentCompaction) {
                    logsHtml += buildCompactionBlockHTML(
                        currentCompaction.reason, 'running',
                        currentCompaction.tokensBefore, currentCompaction.tokensAfter,
                        currentCompaction.summary, currentCompaction.errorText,
                        currentCompaction.timestamp, currentCompaction.entryCount
                    );
                    currentCompaction = null;
                }

                // Close any remaining open tool block
                if (currentToolBlock) {
                    logsHtml += buildToolBlockHTML(
                        currentToolBlock.toolName, currentToolBlock.toolId,
                        currentToolBlock.args, currentToolBlock.argsJSON, currentToolBlock.output, 'running',
                        currentToolBlock.timestamp, currentToolBlock.entryCount
                    );
                    currentToolBlock = null;
                }
            }

            // Build error banner if task failed
            let errorBannerHtml = '';
            if (task.status === 'FAILED' && task.error) {
                errorBannerHtml = `<div class="task-error"><div class="task-error-label">Failure Reason</div><div class="task-error-text">${escapeHtml(task.error)}</div></div>`;
            }

            const detailContainer = document.createElement('div');
            detailContainer.className = 'task-detail';
            detailContainer.innerHTML = `
                <div class="task-detail-header">
                    <div>
                        <div class="task-detail-id">${taskTitleHTML(task)}${escapeHtml(task.id)} <span class="badge ${badgeClass}">${task.status}</span>${personaBadge}</div>
                        <div class="task-detail-meta">${task.assigned_to ? 'Guest: ' + guestLabel(task.assigned_to) : 'Unassigned'} · <span class="meta-log-count">${logs.length} log entries</span>${spinnerHTML(logs.length, isTaskRunning(task))}</div>
                    </div>
                    <div style="display:flex;gap:0.5rem;align-items:center;">
                        ${task.status === 'PENDING' && task.priority ? `<span class="badge badge-priority" title="Priority">🔜${priorityToEmoji(task.priority)}</span>${priorityBumpButtonsHTML(task.id, task.priority, false)}` : ''}
                        <button class="btn btn-sm btn-ghost task-detail-fullscreen-btn" onclick="toggleLogsFullscreen()" aria-pressed="false" title="View these logs in full screen">&#x26F6; Full screen</button>
                        <button class="btn btn-sm btn-ghost download-task-btn" data-task-id="${escapeAttr(task.id)}" onclick="downloadTaskLog(this.dataset.taskId)" title="Download the whole trace as JSONL">⬇ Download</button>
                        <button class="btn btn-sm btn-ghost" data-task-id="${escapeAttr(task.id)}" onclick="rerunTask(this.dataset.taskId)">🔄 Re-run</button>
                        ${task.status !== 'COMPLETED' && task.status !== 'FAILED' && task.status !== 'CANCELLED' ? `<button class="btn btn-sm btn-danger" data-task-id="${escapeAttr(task.id)}" onclick="cancelTask(this.dataset.taskId)">✖ Cancel</button>` : ''}
                        <button class="btn btn-sm btn-ghost" onclick="closeTaskDetail()">Close</button>
                    </div>
                </div>
                <div class="task-detail-prompt">
                    <div class="task-detail-prompt-header" onclick="togglePromptBlock()">
                        <div style="display:flex;align-items:center;flex:1;min-width:0;">
                            <span class="prompt-label">📝 Prompt</span>
                            <span class="prompt-preview">${escapeHtml(promptPreview)}</span>
                        </div>
                        <span class="prompt-chevron">▶</span>
                    </div>
                    <div class="task-detail-prompt-body">
                        <div class="md-rendered">${promptMarkdown}</div>
                    </div>
                </div>
                ${errorBannerHtml}
                <div class="task-detail-body"></div>
            `;
            const detailBody = detailContainer.querySelector('.task-detail-body');
            detailBody.innerHTML = logsHtml;
            highlightCommandLines(detailBody);
            view.innerHTML = '';
            view.appendChild(detailContainer);

            // Polling re-renders the whole detail header, so re-apply the
            // full-screen label/aria state to the freshly built button.
            if (document.body.classList.contains('logs-fullscreen')) setLogsFullscreen(true);

            // Sync taskLogs so appendLogToDetail doesn't double-render
            if (activeTaskId && taskLogs[task.id]) {
                taskLogs[task.id] = logs.map(l => ({
                    task_id: l.task_id || activeTaskId,
                    line: l.line,
                    level: l.level || 'info',
                    timestamp: new Date().toISOString()
                }));
            }

            // Scroll to bottom
            const scrollBody = view.querySelector('.task-detail-body');
            if (scrollBody) scrollBody.scrollTop = scrollBody.scrollHeight;
        }

        async function submitTask() {
            const prompt = document.getElementById('task-prompt').value;
            const tags = document.getElementById('task-tags').value;
            const repoRef = document.getElementById('task-repo-ref').value.trim();
            const priorityRadio = document.querySelector('input[name="task-priority"]:checked');
            const priority = priorityRadio ? priorityRadio.value : 'orangutan';

            if (!prompt) {
                alert('Prompt is required');
                return;
            }

            const task = {
                prompt: prompt,
                tags: tags ? tags.split(',').map(s => s.trim()).filter(Boolean) : [],
                repo_ref: repoRef || undefined,
                priority: priority
            };

            try {
                const res = await fetch('/api/tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(task)
                });
                if (res.ok) {
                    document.getElementById('task-prompt').value = '';
                    document.getElementById('task-tags').value = '';
                    document.getElementById('task-repo-ref').value = '';
                    refresh();
                }
            } catch (e) {
                console.error('submit failed:', e);
            }
        }

        // rerunTask creates a new task from an existing one.
        async function rerunTask(taskId) {
            try {
                const res = await fetch('/api/tasks/' + encodeURIComponent(taskId) + '/rerun', {
                    method: 'POST',
                });
                if (!res.ok) {
                    alert('Failed to re-run task');
                    return;
                }
                const newTask = await res.json();
                refresh();
                // Navigate to the new task
                selectTask(newTask.id);
            } catch (e) {
                console.error('rerun failed:', e);
            }
        }

        // cancelTask sends a cancellation request for the given task.
        // For PENDING/ASSIGNED tasks, cancellation is immediate.
        // For RUNNING tasks, the server sends a cancel signal to the guest.
        async function cancelTask(taskId) {
            if (!confirm('Are you sure you want to cancel this task?')) return;
            try {
                const res = await fetch('/api/tasks/' + encodeURIComponent(taskId) + '/cancel', {
                    method: 'POST',
                });
                if (!res.ok) {
                    const errText = await res.text();
                    alert('Failed to cancel task: ' + errText);
                    return;
                }
                const result = await res.json();
                console.log('Task cancelled:', result);
                refresh();
            } catch (e) {
                console.error('cancel failed:', e);
                alert('Failed to cancel task: ' + e.message);
            }
        }

        // WebSocket for live updates
        function connectWS() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            const url = `${protocol}//${location.host}/ws`;
            console.log('Connecting to WebSocket:', url);
            ws = new WebSocket(url);
            ws.onopen = () => {
                console.log('WebSocket connected');
                // Reconnect: recover any messages missed during disconnect
                // by fetching the full detail for the active task.
                if (activeTaskId) {
                    refreshTaskDetail(activeTaskId);
                }
            };
            ws.onerror = (err) => {
                console.error('WebSocket error:', err);
            };
            ws.onclose = (event) => {
                console.log('WebSocket closed (code:', event.code, 'reason:', event.reason, ') — reconnecting in 5s');
                setTimeout(connectWS, 5000);
            };
            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.method === 'task.updated') {
                        // Parse params — may be a string or already an object
                        let params = {};
                        if (typeof msg.params === 'string') {
                            try { params = JSON.parse(msg.params); } catch(e) { console.error('failed to parse task.updated params:', e); }
                        } else {
                            params = msg.params || {};
                        }
                        let taskId = params.task_id || null;
                        refresh();
                        // refresh() already calls patchTaskDetailMeta() for
                        // the active task, so no extra work needed here.
                    } else if (msg.method === 'task.log') {
                        // Parse params — params may be a string (JSON-encoded) or already an object
                        let params = {};
                        if (typeof msg.params === 'string') {
                            try { params = JSON.parse(msg.params); } catch(e) { console.error('failed to parse task.log params:', e); params = {}; }
                        } else {
                            params = msg.params || {};
                        }

                        // Accumulate log in memory with structured tool fields
                        const logEntry = {
                            task_id: params.task_id,
                            line: params.line,
                            level: params.level || 'info',
                            timestamp: new Date().toISOString(),
                            tool_type:   params.tool_type,
                            tool_name:   params.tool_name,
                            tool_id:     params.tool_id,
                            tool_args:   params.tool_args,
                            tool_output: params.tool_output,
                            tool_error:  params.tool_error,
                            compaction_type:         params.compaction_type,
                            compaction_reason:       params.compaction_reason,
                            compaction_summary:      params.compaction_summary,
                            compaction_tokens_before: params.compaction_tokens_before,
                            compaction_tokens_after:  params.compaction_tokens_after,
                            compaction_error:        params.compaction_error,
                        };
                        if (!taskLogs[params.task_id]) {
                            taskLogs[params.task_id] = [];
                        }
                        taskLogs[params.task_id].push(logEntry);

                        // Append to detail view if active
                        if (params.task_id === activeTaskId) {
                            appendLogToDetail(logEntry);
                        }
                    }
                } catch (e) {
                    console.error('WebSocket message handling error:', e);
                }
            };
        }

        // isScrolledToBottom returns true if the element is scrolled within
        // `threshold` pixels of the bottom.  Default threshold is 10px.
        function isScrolledToBottom(el, threshold) {
            threshold = threshold || 10;
            return el.scrollHeight - el.scrollTop - el.clientHeight <= threshold;
        }

        // scrollToBottomIfNeeded scrolls the element to the bottom only if the
        // user was already at (or near) the bottom.  This lets the user scroll
        // up to read older content without being yanked back down.
        //
        // If wasAtBottom is provided (boolean), it is used directly instead of
        // checking the current scroll position.  This is needed when the caller
        // has already mutated the DOM (which changes scrollHeight), so the
        // "at bottom" check must be done against the pre-mutation state.
        function scrollToBottomIfNeeded(el, wasAtBottom) {
            if (wasAtBottom === undefined) {
                wasAtBottom = isScrolledToBottom(el);
            }
            if (wasAtBottom) {
                el.scrollTop = el.scrollHeight;
            }
        }

        // Track the last appended level for streaming logic
        let _lastAppendedLevel = '';

        // _appendThinkingToDetail appends a thinking delta to the last
        // thinking block (streaming). If no thinking block exists, or if the
        // last thinking block is NOT the last child of the body (meaning a
        // tool block or other content was rendered after it), creates a new
        // block. This ensures thinking tokens after tool calls appear in a
        // new block rather than accumulating in a stale one.
        //   body        — the .task-detail-body container
        //   line        — the new thinking delta text
        //   wasAtBottom — whether user was scrolled to bottom before append
        //   timestamp   — ISO timestamp of this delta (for display)
        //   entryCount  — cumulative entry count for this block (for counter)
        function _appendThinkingToDetail(body, line, wasAtBottom, timestamp, entryCount) {
            const blocks = body.querySelectorAll('.thinking-block');
            const lastBlock = blocks.length > 0 ? blocks[blocks.length - 1] : null;
            // Only append to an existing block if it is the last child of
            // the body.  If a tool block or other element follows it, the
            // thinking has resumed after an interruption and needs a new block.
            const canAppend = lastBlock && lastBlock === body.lastElementChild;
            if (canAppend) {
                // Append to existing block's thinking-content div
                const contentEl = lastBlock.querySelector('.thinking-content');
                if (contentEl) {
                    contentEl.textContent += line;
                }
                // Update preview label with first line of accumulated content
                const previewEl = lastBlock.querySelector('.thinking-preview');
                if (previewEl && contentEl) {
                    previewEl.textContent = getFirstLine(contentEl.textContent);
                }
                // Update counter
                const counterEl = lastBlock.querySelector('.block-counter');
                if (counterEl && entryCount != null) {
                    counterEl.textContent = entryCount;
                }
                // Update timestamp
                const tsEl = lastBlock.querySelector('.block-timestamp');
                if (tsEl) {
                    tsEl.textContent = formatTimestamp(timestamp);
                }
                // Ensure the block is open
                const bodyEl = lastBlock.querySelector('.thinking-block-body');
                const chevron = lastBlock.querySelector('.thinking-chevron');
                if (bodyEl) bodyEl.classList.add('open');
                if (chevron) chevron.classList.add('open');
            } else {
                // Create a new thinking block, open by default
                const blockId = nextThinkingBlockId();
                const msgEl = document.createElement('div');
                msgEl.className = 'thinking-block';
                msgEl.id = 'thinking-' + blockId;
                const preview = getFirstLine(line);
                const ts = formatTimestamp(timestamp);
                const counter = entryCount != null ? `<span class="block-counter">${entryCount}</span>` : '';
                msgEl.innerHTML = `
                    <div class="thinking-block-header" onclick="toggleThinkingBlock('${blockId}')">
                        <div>
                            <span class="thinking-icon">💭</span>
                            <span class="thinking-label">Thinking</span>
                            ${preview ? `<span class="thinking-preview">${escapeHtml(preview)}</span>` : ''}
                            ${counter}
                        </div>
                        <div style="display:flex;align-items:center;gap:0.25rem;">
                            <span class="block-timestamp">${ts}</span>
                            <span class="thinking-chevron open">▶</span>
                        </div>
                    </div>
                    <div class="thinking-block-body open" id="thinking-body-${blockId}">
                        <div class="thinking-content">${escapeHtml(line)}</div>
                    </div>
                `;
                body.appendChild(msgEl);
            }
            scrollToBottomIfNeeded(body, wasAtBottom);
        }

        // _closeLastThinkingBlock closes the last thinking block (collapses it)
        // if one exists. Used when a non-thinking entry arrives.
        function _closeLastThinkingBlock(body) {
            const blocks = body.querySelectorAll('.thinking-block');
            const lastBlock = blocks.length > 0 ? blocks[blocks.length - 1] : null;
            if (lastBlock) {
                const bodyEl = lastBlock.querySelector('.thinking-block-body');
                const chevron = lastBlock.querySelector('.thinking-chevron');
                if (bodyEl) bodyEl.classList.remove('open');
                if (chevron) chevron.classList.remove('open');
            }
        }

        // _appendSpawnToDetail appends a spawn line to the last spawn block
        // (streaming). If no spawn block exists, creates a new one.
        // Spawn blocks are kept open while content is arriving.
        function _appendSpawnToDetail(body, line, wasAtBottom, timestamp, entryCount) {
            const blocks = body.querySelectorAll('.spawn-block');
            const lastBlock = blocks.length > 0 ? blocks[blocks.length - 1] : null;
            const canAppend = lastBlock && lastBlock === body.lastElementChild;
            if (canAppend) {
                const contentEl = lastBlock.querySelector('.spawn-content');
                if (contentEl) {
                    contentEl.textContent += line;
                }
                const previewEl = lastBlock.querySelector('.spawn-preview');
                if (previewEl && contentEl) {
                    previewEl.textContent = getFirstLine(contentEl.textContent);
                }
                const counterEl = lastBlock.querySelector('.block-counter');
                if (counterEl && entryCount != null) {
                    counterEl.textContent = entryCount;
                }
                const tsEl = lastBlock.querySelector('.block-timestamp');
                if (tsEl) {
                    tsEl.textContent = formatTimestamp(timestamp);
                }
                // Keep the block open while content is arriving
                const bodyEl = lastBlock.querySelector('.spawn-block-body');
