# Hotelier Guest Configuration
url: "wss://hotelier.example.com:443/ws"
id: "guest-1"
name: "Development Guest #1"
tags:
  - "business-default"
  - "frontend"
task_timeout: 1800
heartbeat_interval: 15
working_dir: "/tmp/hotelier"
log_level: "info"

# mTLS client authentication for the WebSocket connection to the Check-In Host.
# When both client_cert and client_key are set, the guest will present the
# specified certificate during the TLS handshake (upgrades ws:// to wss://).
# Both fields must be set together — setting only one will cause a startup error.
#client_cert: "/path/to/client-cert.pem"
#client_key:  "/path/to/client-key.pem"

# Task isolation: every task runs inside its own chroot jail (issue #51).
# This is always enabled and cannot be disabled. The guest process must have
# CAP_SYS_CHROOT (run as root, or with --cap-add SYS_CHROOT) — the guest
# fails at startup otherwise.
