# Hotelier Check-In Host Configuration
host: "0.0.0.0"
port: 8080
read_timeout: 30
write_timeout: 30
max_log_size: 1048576
task_timeout: 3600
heartbeat_interval: 30
max_guests: 0
# log_dir: "/var/log/hotelier"  # Persist task logs to disk (empty = in-memory only)

# Personas define named sets of environment variables and file copies
# that are applied to a task's working directory. Tasks can specify a
# persona when they are created via the scheduling API.
#
# Environment variable values can contain <workpath> as a placeholder
# for the task's working directory.
#
# File copies specify absolute source paths (on the guest machine) and
# relative destination paths (within the task's working directory).
