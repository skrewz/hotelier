# Hotelier Check-In Host Configuration
# The HTTP API is unauthenticated and there is no TLS: bind to loopback or
# keep this port behind an authenticating proxy (see the README).
host: "0.0.0.0"
port: 8080
read_timeout: 30
write_timeout: 30
max_log_size: 1048576
task_timeout: 3600
heartbeat_interval: 30
# How long a guest may be silent (no heartbeats) before it is considered
# stale: its running task is failed and it is removed from the registry.
# 0 disables stale-guest removal.
silence_timeout: 180
max_guests: 0
# Static cap on how many tasks the host is willing to run at any moment
# (0 = unlimited). Used as-is when no concurrency_schedule is configured;
# the schedule takes precedence otherwise. The cap gates starting work: a
# pending task is admitted only while fewer tasks are ASSIGNED or RUNNING than
# the cap, tasks already running are left alone when it drops, and a queue held
# back says so in the log, in the task's held_reason and in /api/health.
max_concurrent_tasks: 0
# IANA timezone the schedule's "at" times are interpreted in, so the
# boundaries follow the wall clock across DST. Default: "UTC".
# The server binary embeds the tz database (time/tzdata), so a named zone
# resolves even in the scratch container image.
#schedule_timezone: "Australia/Sydney"
# Daily concurrency schedule: each entry takes effect at its wall-clock
# time and holds until the next entry; the last entry of the day holds
# through midnight to the first. In an entry, concurrency: 0 is a real cap
# and pauses all new work — unlike max_concurrent_tasks: 0, which means
# unlimited. Worked day/night example — cap 2 from 07:00 and 4 from 23:00
# Sydney time:
#concurrency_schedule:
#  - at: "07:00"
#    concurrency: 2
#  - at: "23:00"
#    concurrency: 4
# log_dir: "/var/log/hotelier"  # Persist task logs to disk (empty = in-memory only)
# How many days of task logs the prune sweep keeps: date directories older
# than today minus this many days are removed at startup and on the cleanup
# tick. The current day and in-window days are never touched, and queue_dir
# is left alone regardless of a persisted entry's age. 0 disables pruning
# (the max_guests convention: 0 = no limit).
log_retention_days: 14
# queue_dir: "/var/lib/hotelier/queue"  # Persist unprocessed tasks across restarts (empty = in-memory only)

